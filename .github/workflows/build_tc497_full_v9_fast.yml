name: Build TC497 FULL V9 Fast Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v9_fast.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-v9-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v8-review
          path: /tmp/v8
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35426397417
          github-token: ${{ github.token }}

      - name: Download V4 overlay report
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Download CODEX package
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Prepare
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/pkg /tmp/assets /tmp/v9 /tmp/report/screens TC497/FULL_V9_FAST_OUT
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          PKG_ZIP="$(find /tmp/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n 1)"
          unzip -q "$PKG_ZIP" -d /tmp/pkg
          GEN_DIR="$(find /tmp/pkg -type d -name FINAL_62 | head -n 1)"
          for f in WC-Y01.png WD-T03.png WC-D03.png WC-D05.png; do cp "$GEN_DIR/$f" "/tmp/assets/$f"; done

      - name: Preserve untouched picture regions
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error             -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -t 700 -map 0:v:0 -an -c:v copy /tmp/v9/prefix.mp4

          ffmpeg -y -loglevel error             -ss 1125 -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -map 0:v:0 -an -c:v copy /tmp/v9/suffix.mp4

      - name: Render only two affected chunks
        run: |
          set -euo pipefail
          python3 TC497/FULL_V9/v9_patch_chunk.py             --input /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             --manifest TC497/FULL_V9/v9_patch_manifest.json             --source-ass /tmp/v4report/overlay_v4.ass             --asset-dir /tmp/assets --start 700 --end 900             --output /tmp/v9/chunk_700_900.mp4

          python3 TC497/FULL_V9/v9_patch_chunk.py             --input /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             --manifest TC497/FULL_V9/v9_patch_manifest.json             --source-ass /tmp/v4report/overlay_v4.ass             --asset-dir /tmp/assets --start 900 --end 1125             --output /tmp/v9/chunk_900_1125.mp4

      - name: Assemble picture and remux V8 audio
        run: |
          set -euo pipefail
          cat > /tmp/v9/concat.txt <<EOF
          file '/tmp/v9/prefix.mp4'
          file '/tmp/v9/chunk_700_900.mp4'
          file '/tmp/v9/chunk_900_1125.mp4'
          file '/tmp/v9/suffix.mp4'
          EOF

          ffmpeg -y -loglevel error             -f concat -safe 0 -i /tmp/v9/concat.txt             -c copy -movflags +faststart /tmp/v9/video_only.mp4

          ffmpeg -y -loglevel error             -i /tmp/v9/video_only.mp4             -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -map 0:v:0 -map 1:a:0 -c copy -t 1236.533333 -movflags +faststart             TC497/FULL_V9_FAST_OUT/TC497_FULL_V9_REVIEW_960x540.mp4

          ffmpeg -y -loglevel error -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -map 0:a:0 -c copy -f adts /tmp/v9/v8.aac
          ffmpeg -y -loglevel error -i TC497/FULL_V9_FAST_OUT/TC497_FULL_V9_REVIEW_960x540.mp4             -map 0:a:0 -c copy -f adts /tmp/v9/v9.aac
          sha256sum /tmp/v9/v8.aac /tmp/v9/v9.aac | tee /tmp/report/AUDIO_SHA256.txt
          cmp /tmp/v9/v8.aac /tmp/v9/v9.aac

      - name: QC
        run: |
          set -euo pipefail
          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate,duration:format=duration,size,bit_rate             -of json TC497/FULL_V9_FAST_OUT/TC497_FULL_V9_REVIEW_960x540.mp4             > /tmp/report/FFPROBE.json

          for t in 699 701 760 770 776 817 824 899 901 1024 1030 1058 1064 1124 1126 1228 1235; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V9_FAST_OUT/TC497_FULL_V9_REVIEW_960x540.mp4               -frames:v 1 "/tmp/report/screens/frame_${t}.jpg"
          done

          cat > /tmp/report/V9_FAST_BUILD_NOTES.md <<'EOF'
          FULL_V9 review only — NOT final / NOT user-approved.
          Four surgical visual replacements only.
          Picture before 11:40 and after 18:45 is stream-copied from FULL_V8.
          Only V6-compatible original chunk boundaries 700 / 900 / 1125 are used.
          V8 AAC is remuxed bit-for-bit.
          V14 cold open and V8 cinematic ending remain unchanged.
          EOF

          cp TC497/FULL_V9/EDIT_PLAN.md /tmp/report/
          cp TC497/FULL_V9/v9_patch_manifest.json /tmp/report/
          (cd /tmp/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V9_FAST_OUT/FULL_V9_REPORT.zip" .)
          (cd TC497/FULL_V9_FAST_OUT && sha256sum TC497_FULL_V9_REVIEW_960x540.mp4 FULL_V9_REPORT.zip > SHA256SUMS.txt)

      - name: Upload FULL V9 review
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v9-review-fast
          path: |
            TC497/FULL_V9_FAST_OUT/TC497_FULL_V9_REVIEW_960x540.mp4
            TC497/FULL_V9_FAST_OUT/FULL_V9_REPORT.zip
            TC497/FULL_V9_FAST_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
