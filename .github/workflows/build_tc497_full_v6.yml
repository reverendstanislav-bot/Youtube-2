name: Build TC497 FULL V6 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v6.yml'
      - 'TC497/FULL_V6/v6_patch_chunk.py'
      - 'TC497/FULL_V6/v6_patch_manifest.json'

permissions:
  contents: read
  actions: read

jobs:
  render-chunks:
    name: render-v6-chunk-${{ matrix.idx }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - idx: 0
            start: 0
            end: 205
          - idx: 1
            start: 205
            end: 410
          - idx: 2
            start: 410
            end: 700
          - idx: 3
            start: 700
            end: 900
          - idx: 4
            start: 900
            end: 1125
          - idx: 5
            start: 1125
            end: 1236.533333

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: Download FULL V5 review base
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v5-review
          path: /tmp/v5
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35421885255
          github-token: ${{ github.token }}

      - name: Download FULL V4 report source
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare ASS and V6 replacement inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/replacements /tmp/out
          test -s /tmp/v5/TC497_FULL_V5_REVIEW_960x540.mp4
          test -s /tmp/v4/FULL_V4_REPORT.zip
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/overlay_v4.ass

          curl -fL --retry 3 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_5d160867-ad98-4a85-8556-525b046a6888.png' \
            -o /tmp/replacements/electric_human_break.png
          curl -fL --retry 3 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_01ad642b-d0d3-4821-a10c-c14448b21b7f.png' \
            -o /tmp/replacements/electric_wheel_break.png

          test -s /tmp/replacements/electric_human_break.png
          test -s /tmp/replacements/electric_wheel_break.png

      - name: Render V6 chunk
        run: |
          set -euo pipefail
          python3 TC497/FULL_V6/v6_patch_chunk.py \
            --input /tmp/v5/TC497_FULL_V5_REVIEW_960x540.mp4 \
            --manifest TC497/FULL_V6/v6_patch_manifest.json \
            --source-ass /tmp/v4report/overlay_v4.ass \
            --replacement-dir /tmp/replacements \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --output "/tmp/out/chunk_${{ matrix.idx }}.mp4"

      - name: Upload V6 chunk
        uses: actions/upload-artifact@v4
        with:
          name: tc497-v6-chunk-${{ matrix.idx }}
          path: /tmp/out/chunk_${{ matrix.idx }}.mp4
          compression-level: 0
          retention-days: 2

  assemble-v6:
    name: assemble-full-v6-review
    needs: render-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Download FULL V5 review base for untouched audio
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v5-review
          path: /tmp/v5
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35421885255
          github-token: ${{ github.token }}

      - name: Download rendered V6 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: tc497-v6-chunk-*
          path: /tmp/chunks
          merge-multiple: true

      - name: Concatenate chunks and remux untouched V5 audio
        run: |
          set -euo pipefail
          mkdir -p TC497/FULL_V6_OUT /tmp/v6report/screens

          for i in 0 1 2 3 4 5; do
            test -s "/tmp/chunks/chunk_${i}.mp4"
          done

          : > /tmp/concat.txt
          for i in 0 1 2 3 4 5; do
            echo "file '/tmp/chunks/chunk_${i}.mp4'" >> /tmp/concat.txt
          done

          ffmpeg -y -loglevel error \
            -f concat -safe 0 -i /tmp/concat.txt \
            -c copy -movflags +faststart /tmp/v6_video_only.mp4

          ffmpeg -y -loglevel error \
            -i /tmp/v6_video_only.mp4 \
            -i /tmp/v5/TC497_FULL_V5_REVIEW_960x540.mp4 \
            -map 0:v:0 -map 1:a:0 \
            -c copy -movflags +faststart \
            TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4

          # Prove the AAC elementary stream is bit-for-bit inherited from V5.
          ffmpeg -y -loglevel error \
            -i /tmp/v5/TC497_FULL_V5_REVIEW_960x540.mp4 \
            -map 0:a:0 -c copy -f adts /tmp/v5_audio.aac
          ffmpeg -y -loglevel error \
            -i TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4 \
            -map 0:a:0 -c copy -f adts /tmp/v6_audio.aac
          sha256sum /tmp/v5_audio.aac /tmp/v6_audio.aac | tee /tmp/v6report/AUDIO_SHA256.txt
          cmp /tmp/v5_audio.aac /tmp/v6_audio.aac

      - name: V6 objective and visual QC package
        run: |
          set -euo pipefail

          ffprobe -v error \
            -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate,duration:format=duration,size,bit_rate \
            -of json TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4 \
            > /tmp/v6report/FFPROBE.json

          for t in 90 218 233 330 713 733 840 1083 1111 1212 1228; do
            ffmpeg -y -loglevel error -ss "$t" \
              -i TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4 \
              -frames:v 1 "/tmp/v6report/screens/frame_${t}.jpg"
          done

          cat > /tmp/v6report/V6_BUILD_NOTES.md <<'EOF'
          # TC497 FULL_V6 — review build only

          FULL_V6 is NOT a user-approved final master.

          Base:
          - FULL_V5 review artifact from GitHub Actions run 35421885255.

          V6 changes:
          - restores the two Electric Wheel visual breakers that V5 declared but silently skipped;
          - re-burns the original V4 ASS captions/source labels only across all seven replacement intervals;
          - explicitly tags both new Electric Wheel stills as RECONSTRUCTION;
          - leaves every other V5 visual frame conceptually unchanged;
          - preserves the V5 AAC elementary audio stream bit-for-bit.

          Build method:
          - six short 960x540 H.264 review chunks;
          - stream-copy concatenation;
          - V5 AAC remuxed without re-encoding.

          This artifact exists for human visual approval before any 1080p master is considered final.
          EOF

          cp TC497/FULL_V6/v6_patch_chunk.py /tmp/v6report/
          cp TC497/FULL_V6/v6_patch_manifest.json /tmp/v6report/

          (cd /tmp/v6report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V6_OUT/FULL_V6_REPORT.zip" .)
          (cd TC497/FULL_V6_OUT && sha256sum \
            TC497_FULL_V6_REVIEW_960x540.mp4 FULL_V6_REPORT.zip > SHA256SUMS.txt)

          ls -lh TC497/FULL_V6_OUT/

      - name: Upload FULL V6 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v6-review
          path: |
            TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4
            TC497/FULL_V6_OUT/FULL_V6_REPORT.zip
            TC497/FULL_V6_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
