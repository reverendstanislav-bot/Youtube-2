name: Build TC497 FULL V6 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v6.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-v6:
    env:
      V5_FASTCHECK: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip
          pip install numpy

      - name: Download accepted FULL V4 artifact
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare V4 report, VO, ASS and V6 directories
        env:
          VO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/130bfd1b-7ac4-4dbf-9bc4-6a5fe00927ac.mp3
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/v6cfg/music /tmp/v6cfg/replacements /tmp/v6report
          test -s /tmp/v4artifact/TC497_FULL_V4_REVIEW_960x540.mp4
          test -s /tmp/v4artifact/FULL_V4_REPORT.zip
          unzip -q /tmp/v4artifact/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/shots.json
          test -s /tmp/v4report/ORIGINAL_UNDERSCORE.wav
          test -s /tmp/v4report/overlay_v4.ass
          curl -fL --retry 3 "$VO_URL" -o /tmp/v6_vo.mp3
          test -s /tmp/v6_vo.mp3

      - name: Download all seven visual replacements
        run: |
          set -euo pipefail

          # Missing V5 Electric Wheel continuity fixes, generated for V6.
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_5d160867-ad98-4a85-8556-525b046a6888.png'             -o /tmp/v6cfg/replacements/electric_human_break.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_01ad642b-d0d3-4821-a10c-c14448b21b7f.png'             -o /tmp/v6cfg/replacements/electric_wheel_break.png

          # Accepted V5 concept / helicopter / survivor replacements.
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_ef53745c-7d9b-40d7-9375-c3c27c19b958.png'             -o /tmp/v6cfg/replacements/nuclear_concept_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_83c46c89-d5da-4679-b0b5-e7040f256687.png'             -o /tmp/v6cfg/replacements/nuclear_unbuilt_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_d5259b58-486d-4be2-a84e-06ebc8f1db72.png'             -o /tmp/v6cfg/replacements/heavy_lift_logistics_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_f0ef4a51-417a-4aa3-8497-f376988c719b.png'             -o /tmp/v6cfg/replacements/ground_vs_air_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_a47863ca-4a61-4e9e-9baf-812785b182df.png'             -o /tmp/v6cfg/replacements/survivor_detail_clean.png

          test "$(find /tmp/v6cfg/replacements -type f -name '*.png' | wc -l)" -eq 7

      - name: Prepare manifests and original music
        run: |
          set -euo pipefail
          python TC497/FULL_V5/generate_original_music.py --out-dir /tmp/v6cfg/music
          cp TC497/FULL_V5/music_manifest.original.json /tmp/v6cfg/music_manifest.json
          cp TC497/FULL_V5/visual_patches.v5.json /tmp/v6cfg/visual_patches.json

          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/v6cfg/visual_patches.json').read_text())
          patches = manifest.get('patches', [])
          assert len(patches) == 7, f'Expected 7 patches, got {len(patches)}'

          missing = []
          for p in patches:
              path = Path('/tmp/v6cfg') / p['image']
              if not path.is_file() or path.stat().st_size == 0:
                  missing.append(str(path))
          assert not missing, f'Missing patch files: {missing}'

          def ass_sec(x):
              h,m,s = x.split(':')
              return int(h)*3600 + int(m)*60 + float(s)

          events = []
          for line in Path('/tmp/v4report/overlay_v4.ass').read_text(errors='replace').splitlines():
              if not line.startswith('Dialogue:'):
                  continue
              parts = line.split(',', 9)
              if len(parts) >= 10:
                  events.append((ass_sec(parts[1]), ass_sec(parts[2]), parts[3]))

          uncovered = []
          for p in patches:
              a, b = float(p['start']), float(p['end'])
              overlaps = [e for e in events if e[1] > a and e[0] < b]
              if not overlaps:
                  uncovered.append((a, b, p['image']))
          assert not uncovered, f'No ASS events overlap replacement intervals: {uncovered}'
          print('PATCH_AND_ASS_PREFLIGHT_OK', len(patches))
          PY

      - name: Build FULL V6 with all patches and ASS reburn
        run: |
          set -euo pipefail
          mkdir -p TC497/FULL_V6_OUT
          python TC497/FULL_V5/v5_fix_and_music.py             --input-video /tmp/v4artifact/TC497_FULL_V4_REVIEW_960x540.mp4             --shots-json /tmp/v4report/shots.json             --music-manifest /tmp/v6cfg/music_manifest.json             --visual-patches /tmp/v6cfg/visual_patches.json             --source-ass /tmp/v4report/overlay_v4.ass             --vo /tmp/v6_vo.mp3             --sfx-bed /tmp/v4report/ORIGINAL_UNDERSCORE.wav             --output TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4             --report-dir /tmp/v6report

      - name: Final V6 QC
        run: |
          set -euo pipefail

          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate             -of json TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4             > /tmp/v6report/FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4             -af ebur128=peak=true -f null - 2> /tmp/v6report/EBUR128.txt || true

          mkdir -p /tmp/v6report/screens

          # Exact review points: two previously skipped Electric Wheel patches,
          # all five existing V5 patches, and overview anchors.
          for t in 90 218 233 330 713 733 840 1083 1111 1212 1228; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4               -frames:v 1 "/tmp/v6report/screens/frame_${t}.jpg"
          done

          cat > /tmp/v6report/V6_BUILD_NOTES.md <<'EOF'
          # TC497 FULL_V6 — Review pass

          This is a review build, not an approved final master.

          V6 corrects two concrete V5 build defects:
          - all seven declared visual patches are now required and present;
          - V4 ASS captions/source labels are re-burned over every replacement interval.

          Additional V6 change:
          - the two Electric Wheel continuity breakers that V5 skipped are now present.

          Any missing declared patch or missing ASS overlap causes the workflow to fail.
          EOF

          cp TC497/FULL_V5/v5_fix_and_music.py /tmp/v6report/
          cp TC497/FULL_V5/generate_original_music.py /tmp/v6report/
          cp /tmp/v6cfg/music_manifest.json /tmp/v6report/
          cp /tmp/v6cfg/visual_patches.json /tmp/v6report/
          cp /tmp/v4report/overlay_v4.ass /tmp/v6report/

          (cd /tmp/v6report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V6_OUT/FULL_V6_REPORT.zip" .)
          (cd TC497/FULL_V6_OUT && sha256sum             TC497_FULL_V6_REVIEW_960x540.mp4 FULL_V6_REPORT.zip > SHA256SUMS.txt)

          ls -lh TC497/FULL_V6_OUT/

      - name: Upload FULL V6 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v6-review
          path: |
            TC497/FULL_V6_OUT/TC497_FULL_V6_REVIEW_960x540.mp4
            TC497/FULL_V6_OUT/FULL_V6_REPORT.zip
            TC497/FULL_V6_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
