name: Audit Chicago V2 Sequence and Composition

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_chicago_v2_sequence.yml'

permissions:
  contents: write

jobs:
  audit-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil

      - name: Download and reconstruct source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_src
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 master and shot plan
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v2 "$GITHUB_WORKSPACE/CHICAGO/AUDIT/V2_SEQUENCE"
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_v2 \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/work/shots.json" \
            "-ir!*/_V2/work/plan_summary.json" \
            "-ir!*/_EDIT_WORK/edit_scenes.json"

          V2="$(find /tmp/chicago_v2 -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SHOTS="$(find /tmp/chicago_v2 -type f -path '*/_V2/work/shots.json' | head -n1)"
          test -s "$V2"; test -s "$SHOTS"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SHOTS=$SHOTS" >> "$GITHUB_ENV"
          cp "$SHOTS" "$GITHUB_WORKSPACE/CHICAGO/AUDIT/V2_SEQUENCE/shots.json"

      - name: Analyze shot sequence structure
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/audit_v2_sequence.py \
            --shots "$SHOTS" \
            --out-json CHICAGO/AUDIT/V2_SEQUENCE/SEQUENCE_AUDIT.json \
            --out-md CHICAGO/AUDIT/V2_SEQUENCE/SEQUENCE_AUDIT.md

      - name: Extract global 10-second sequence samples
        run: |
          set -euo pipefail
          mkdir -p /tmp/global_frames
          ffmpeg -hide_banner -loglevel error -i "$V2" \
            -vf "fps=1/10,scale=384:216:flags=lanczos" \
            -q:v 3 /tmp/global_frames/f_%04d.jpg

      - name: Build global contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import math
          src=sorted(Path('/tmp/global_frames').glob('f_*.jpg'))
          out=Path('CHICAGO/AUDIT/V2_SEQUENCE')
          font=ImageFont.load_default()
          per=16; cols=4; tw,th=384,216; labelh=22
          for si in range(math.ceil(len(src)/per)):
              batch=src[si*per:(si+1)*per]
              sheet=Image.new('RGB',(cols*tw,4*(th+labelh)),(18,20,22))
              d=ImageDraw.Draw(sheet)
              for j,p in enumerate(batch):
                  idx=si*per+j
                  im=Image.open(p).convert('RGB')
                  x=(j%cols)*tw; y=(j//cols)*(th+labelh)
                  sheet.paste(im,(x,y))
                  t=idx*10.0
                  mm=int(t//60); ss=int(t%60)
                  d.rectangle((x,y+th,x+tw,y+th+labelh),fill=(18,20,22))
                  d.text((x+6,y+th+5),f'{mm:02d}:{ss:02d}',font=font,fill='white')
              sheet.save(out/f'GLOBAL_SHEET_{si+1:02d}.jpg',quality=88)
          PY

      - name: Extract explainer and suspicious-shot frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=json.loads(Path('CHICAGO/AUDIT/V2_SEQUENCE/SEQUENCE_AUDIT.json').read_text())
          out=Path('/tmp/special_frames');out.mkdir(exist_ok=True)
          selected=[]
          # Every explainer shot midpoint
          for name,shots in d['explainers'].items():
              for s in shots:
                  selected.append(('explainer',name,s))
          # Every short shot
          for s in d['shots_under_2s']:
              selected.append(('short','short',s))
          # Same-source motion/variant flips, both sides
          for a,b in d['same_source_motion_or_variant_flip'][:40]:
              selected.append(('flip','flip',d['shots'][a]))
              selected.append(('flip','flip',d['shots'][b]))
          # Deduplicate by shot index
          uniq={}
          for typ,name,s in selected:
              uniq[s['index']] = (typ,name,s)
          manifest=[]
          for n,(idx,(typ,name,s)) in enumerate(sorted(uniq.items()),1):
              t=(s['start']+s['end'])/2
              fn=out/f'{n:03d}_shot{idx:03d}_{t:.2f}s.jpg'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',os.environ['V2'],'-frames:v','1','-vf','scale=480:270:flags=lanczos',str(fn)],check=True)
              manifest.append({'file':fn.name,'type':typ,'name':name,**s})
          Path('CHICAGO/AUDIT/V2_SEQUENCE/SPECIAL_FRAMES.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Build special contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import json,math
          rows=json.loads(Path('CHICAGO/AUDIT/V2_SEQUENCE/SPECIAL_FRAMES.json').read_text())
          srcdir=Path('/tmp/special_frames'); out=Path('CHICAGO/AUDIT/V2_SEQUENCE')
          font=ImageFont.load_default()
          per=12; cols=3; tw,th=480,270; labelh=34
          for si in range(math.ceil(len(rows)/per)):
              batch=rows[si*per:(si+1)*per]
              sheet=Image.new('RGB',(cols*tw,4*(th+labelh)),(18,20,22))
              d=ImageDraw.Draw(sheet)
              for j,r in enumerate(batch):
                  im=Image.open(srcdir/r['file']).convert('RGB')
                  x=(j%cols)*tw; y=(j//cols)*(th+labelh)
                  sheet.paste(im,(x,y))
                  mm=int(r['start']//60); ss=r['start']-mm*60
                  label=f"{r['type']} | sh{r['index']} | {mm:02d}:{ss:04.1f} | {r['scene']} | {r['motion']}"
                  d.rectangle((x,y+th,x+tw,y+th+labelh),fill=(18,20,22))
                  d.text((x+4,y+th+4),label[:78],font=font,fill='white')
              sheet.save(out/f'SPECIAL_SHEET_{si+1:02d}.jpg',quality=90)
          PY

      - name: Detect hard scene changes and freeze-like intervals
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -i "$V2" \
            -filter:v "select='gt(scene,0.35)',showinfo" \
            -f null - 2> CHICAGO/AUDIT/V2_SEQUENCE/SCENE_CHANGE_LOG.txt || true

          ffmpeg -hide_banner -i "$V2" \
            -vf "freezedetect=n=-55dB:d=0.8" \
            -map 0:v:0 -f null - 2> CHICAGO/AUDIT/V2_SEQUENCE/FREEZEDETECT_LOG.txt || true

      - name: Commit audit package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/AUDIT/V2_SEQUENCE
          git commit -m "Run full Chicago V2 sequence and composition audit"
          git push

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v2-sequence-audit
          path: CHICAGO/AUDIT/V2_SEQUENCE
          retention-days: 14
