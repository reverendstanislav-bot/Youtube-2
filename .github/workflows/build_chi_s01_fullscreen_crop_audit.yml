name: CHI-S01 fullscreen crop audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_chi_s01_fullscreen_crop_audit.yml'
      - 'SHORTS_RENDER/build_chi_s01_crop_audit.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3 python3-pil gh
      - name: Build crop audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash SHORTS_RENDER/build_chi_s01_crop_audit.sh
      - name: Upload crop audit
        uses: actions/upload-artifact@v4
        with:
          name: chi-s01-fullscreen-crop-audit
          path: /tmp/chi_s01_crop_audit/audit
          compression-level: 0
          retention-days: 7
