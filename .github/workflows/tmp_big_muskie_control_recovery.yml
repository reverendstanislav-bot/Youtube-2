name: Temporary Big Muskie control recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_big_muskie_control_recovery.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package control files
        run: |
          set -euo pipefail
          mkdir -p out
          cp BIG_MUSKIE/FINAL_ASSET_LOCK/FINAL_116_BEAT_ASSET_LOCK_V1.csv out/
          cp BIG_MUSKIE/REMOTION_V3/prepare_timeline.py out/
          cp BIG_MUSKIE/REMOTION_V3/src/index.jsx out/
          cp BIG_MUSKIE/ASSEMBLY_V1/FINAL_MEDIA_MAPPING_V1.md out/
          cp BIG_MUSKIE/ASSEMBLY_V2/FINAL_MEDIA_MAPPING_V2.md out/
          cp BIG_MUSKIE/REMOTION_V3/R3_CANONICAL_END_CAPTIONS_QC_V2.md out/
          cp BIG_MUSKIE/REMOTION_V3/LEGACY_EXPLAINER_REBUILD_LOCK_V2.md out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: BIG_MUSKIE_CONTROL_RECOVERY
          path: out/
          retention-days: 7
