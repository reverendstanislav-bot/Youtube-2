name: Build TC497 FULL V13 FINAL Textless Outro 1080 Master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v13_textless_outro_1080.yml'

permissions:
  contents: write
  actions: read

jobs:
  build-final-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRANSCRIPT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip
      V4_WORK: /tmp/v13final/v4work
      V4_PUBLIC: /tmp/v13final/v4public
      V4_EXTRA: /tmp/v13final/v4extra
      ASS_OUT: /tmp/v13final/overlay_v4.ass
      MASTER: TC497/FULL_V13_TEXTLESS_FINAL_OUT/TC497_FINAL_UPLOAD_MASTER_FULL_V13_TEXTLESS_1920x1080.mp4
      RELEASE_TAG: tc497-full-v13-textless-final-1080-20260922

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils unzip zip fonts-dejavu-core
          pip install pillow numpy opencv-python-headless

      - name: Download CODEX package
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Download approved V9 audio source
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v9-review-fast
          path: /tmp/v9
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35427554323
          github-token: ${{ github.token }}

      - name: Download approved V13 review reference
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v13-review-optimized
          path: /tmp/approved_v13
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35485738354
          github-token: ${{ github.token }}

      - name: Prepare package transcript and workspaces
        run: |
          set -euo pipefail
          rm -rf /tmp/v13final /tmp/pkg /tmp/v13
          mkdir -p /tmp/v13final/{v4work,v4public,v4extra,v5patch,patch,remotion/src,remotion/public,coldwork,report/screens} /tmp/pkg TC497/FULL_V13_TEXTLESS_FINAL_OUT

          PKG_ZIP="$(find /tmp/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n 1)"
          test -n "$PKG_ZIP"
          unzip -q "$PKG_ZIP" -d /tmp/pkg

          PKG_ROOT="$(find /tmp/pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          GEN_DIR="$(find "$PKG_ROOT" -type d -name FINAL_62 | head -n 1)"
          test -n "$PKG_ROOT"
          test -n "$GEN_DIR"
          echo "PKG_ROOT=$PKG_ROOT" >> "$GITHUB_ENV"
          echo "GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"

          curl -fL --retry 4 --retry-all-errors "$TRANSCRIPT_URL" -o /tmp/v13final/transcript.zip
          unzip -q /tmp/v13final/transcript.zip -d /tmp/v13final/transcript
          WORD="$(find /tmp/v13final/transcript -type f -name TC497_VO_WORD_LEVEL.csv | head -n 1)"
          test -n "$WORD"
          echo "TRANSCRIPT_DIR=$(dirname "$WORD")" >> "$GITHUB_ENV"
          echo "WORD_CSV=$WORD" >> "$GITHUB_ENV"

          test -s /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4
          test -s /tmp/approved_v13/TC497_FULL_V13_REVIEW_960x540.mp4

      - name: Build canonical textless HIA end screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/hia_brand
          mkdir -p /tmp/hia_brand
          cd /tmp/hia_brand
          gh release download chicago-channel-brand-assets-extracted-20260920 --repo reverendstanislav-bot/Youtube-2 --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'
          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip -d extracted
          BASE="$(find /tmp/hia_brand/extracted -type f -name '07_generic_reusable_thumbnail_base.png' | head -n1)"
          test -s "$BASE"
          export BRAND_BASE="$BASE"

          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import os
          from pathlib import Path

          src=Image.open(os.environ['BRAND_BASE']).convert('RGB')
          assert src.size==(1920,1080), src.size
          im=Image.blend(src,Image.new('RGB',src.size,(0,0,0)),0.15)
          d=ImageDraw.Draw(im)
          PAPER=(230,221,200)
          RUST=(165,82,53)

          # Exactly one previous-video target; zero rendered text.
          rx1,ry1,rx2,ry2=185,350,1015,817
          d.rounded_rectangle([rx1,ry1,rx2,ry2],radius=6,fill=(22,25,27),outline=PAPER,width=5)
          d.line([rx1,ry1,rx1+155,ry1],fill=RUST,width=7)

          # Exactly one avatar / Subscribe target; zero rendered text.
          cx,cy,r=1425,590,145
          d.ellipse([cx-r,cy-r,cx+r,cy+r],fill=(18,21,23),outline=PAPER,width=5)
          d.arc([cx-r-9,cy-r-9,cx+r+9,cy+r+9],start=208,end=325,fill=RUST,width=6)

          out=Path('/tmp/v13final/patch/HIA_TEXTLESS_END_1080.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,compress_level=6)
          PY

          test -s /tmp/v13final/patch/HIA_TEXTLESS_END_1080.png

      - name: Download V13 retained picture assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('TC497/FULL_V13/download_assets.py').read_text()
          src=src.replace("Path('/tmp/v13/v4extra')","Path('/tmp/v13final/v4extra')")
          src=src.replace("Path('/tmp/v13/v5patch')","Path('/tmp/v13final/v5patch')")
          src=src.replace("Path('/tmp/v13/patch')","Path('/tmp/v13final/patch')")
          Path('/tmp/v13final/download_assets_final.py').write_text(src)
          PY
          python3 /tmp/v13final/download_assets_final.py

          test -s /tmp/v13final/patch/electric_human_v6.png
          for f in nuclear_concept_clean.png nuclear_unbuilt_clean.png heavy_lift_logistics_clean.png ground_vs_air_clean.png survivor_detail_clean.png; do
            test -s "/tmp/v13final/v5patch/$f"
          done

      - name: Build native 1080 V13 cold-open picture
        run: |
          set -euo pipefail
          export V14_EXTRA=/tmp/v13final/v4extra
          export V14_PUBLIC=/tmp/v13final/remotion/public
          export V14_WORK=/tmp/v13final/coldwork

          cp TC497/V14/assets/INTRO_DETAIL.png "$V14_EXTRA/INTRO_DETAIL.png"
          cp TC497/V14/assets/INTRO_OBSERVERS.png "$V14_EXTRA/INTRO_OBSERVERS.png"
          cp TC497/V14/assets/INTRO_REVEAL.png "$V14_EXTRA/INTRO_REVEAL.png"

          unzip -p TC497/V14/TC497_V14_REMOTION_REPORT.zip captions.json > /tmp/v13final/remotion/public/captions.json
          ffmpeg -y -loglevel error -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4             -vn -ac 2 -ar 48000 -c:a pcm_s16le /tmp/v13final/remotion/public/mix.wav

          python3 - <<'PY'
          from pathlib import Path
          p=Path('TC497/FULL_V13/prep_v13_cold.py').read_text()
          reps={
            'scale=900:506:force_original_aspect_ratio=decrease,pad=960:540:(ow-iw)/2:(oh-ih)/2':'scale=1800:1012:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2',
            'scale=1632:918:force_original_aspect_ratio=increase,crop=1632:918':'scale=3264:1836:force_original_aspect_ratio=increase,crop=3264:1836',
            'crop=960:540:336:189':'crop=1920:1080:672:378',
            'scale=1440:810:force_original_aspect_ratio=increase,crop=1440:810':'scale=2880:1620:force_original_aspect_ratio=increase,crop=2880:1620',
            'crop=960:540:240:135':'crop=1920:1080:480:270',
            'scale=900:506,pad=960:540:30:17':'scale=1800:1012,pad=1920:1080:60:34',
          }
          for a,b in reps.items():
              if a not in p:
                  raise SystemExit(f'missing cold transform token: {a}')
              p=p.replace(a,b)
          Path('/tmp/v13final/prep_v13_cold_1080.py').write_text(p)
          PY

          python3 /tmp/v13final/prep_v13_cold_1080.py
          ! grep -q 'WA-09' /tmp/v13final/coldwork/V14_EDIT_DECISIONS.csv
          grep -q 'WB-L04' /tmp/v13final/coldwork/V14_EDIT_DECISIONS.csv

          python3 - <<'PY'
          from pathlib import Path
          src=Path('TC497/FULL_V13/index_v13.jsx').read_text()
          old="""const Film=()=> <AbsoluteFill style={{background:C.charcoal}}>
            <OffthreadVideo src={staticFile('base.mp4')} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            <Mood/>
            <ReconBug/>
            <ArchiveTag/>
            <Measurement/>
            <WheelBeat/>
            <InfoLabels/>
            <YumaBuild/>
            <Payoff/>
            <Title/>
            <Caption/>
            <Audio src={staticFile('mix.wav')} volume={1}/>
          </AbsoluteFill>;

          registerRoot(()=> <Composition id="TC497V14" component={Film} durationInFrames={2478} fps={30} width={960} height={540}/>);"""
          new="""const UI=()=> <div style={{position:'absolute',left:0,top:0,width:960,height:540,transform:'scale(2)',transformOrigin:'top left'}}>
            <Mood/>
            <ReconBug/>
            <ArchiveTag/>
            <Measurement/>
            <WheelBeat/>
            <InfoLabels/>
            <YumaBuild/>
            <Payoff/>
            <Title/>
            <Caption/>
          </div>;

          const Film=()=> <AbsoluteFill style={{background:C.charcoal}}>
            <OffthreadVideo src={staticFile('base.mp4')} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            <UI/>
            <Audio src={staticFile('mix.wav')} volume={1}/>
          </AbsoluteFill>;

          registerRoot(()=> <Composition id="TC497V14" component={Film} durationInFrames={2478} fps={30} width={1920} height={1080}/>);"""
          if old not in src:
              raise SystemExit('index_v13 Film block did not match')
          src=src.replace(old,new)
          Path('/tmp/v13final/remotion/src/index.jsx').write_text(src)
          PY

          cp TC497/V14/package.json /tmp/v13final/remotion/package.json
          (cd /tmp/v13final/remotion && npm install --no-audit --no-fund)
          (cd /tmp/v13final/remotion && npx remotion render src/index.jsx TC497V14 out.mp4 --codec=h264 --crf=16 --pixel-format=yuv420p)

          ffmpeg -y -loglevel error -i /tmp/v13final/remotion/out.mp4 -t 82.6 -an -c:v copy /tmp/v13final/cold_picture_1080.mp4

          CW="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 /tmp/v13final/cold_picture_1080.mp4)"
          CH="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 /tmp/v13final/cold_picture_1080.mp4)"
          echo "cold_picture_dimensions=$CW x $CH"
          test "$CW" = "1920"
          test "$CH" = "1080"

      - name: Build native 1080 post-cold-open picture with V13 shot map
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('TC497/FULL_V4/full_v4_build.py').read_text()
          src=src.replace('W,H=960,540','W,H=1920,1080')
          src=src.replace("'scale=960:540,format=yuv420p'","'scale=1920:1080,format=yuv420p'")
          src=src.replace("('WA-09','wide',6,'wheel_motor',1)","('ST-ELECTRIC','wide',6,'electric_distribution',1)")
          src=src.replace("('WA-09','detail',4,'wheel_motor',1)","('AR-PATENT','doc_mid',4,'patent_detail',1)",1)
          src=src.replace("('WA-09','detail',4,'wheel_motor',1)","('WB-L04','wide',4,'tc497_articulation',1)",1)
          src=src.replace("BLACKLISTED_LEGACY={","BLACKLISTED_LEGACY={'WA-09',")
          Path('/tmp/v13final/full_v13_1080_build.py').write_text(src)
          PY

          python3 /tmp/v13final/full_v13_1080_build.py
          python3 TC497/FULL_V4/make_overlay_v4_ass.py

          ! grep -q '"code": "WA-09"' /tmp/v13final/v4public/shots.json
          test -s /tmp/v13final/v4public/rest_base.mp4
          test -s /tmp/v13final/overlay_v4.ass
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 /tmp/v13final/v4public/rest_base.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 /tmp/v13final/v4public/rest_base.mp4)" = "1080"

      - name: Assemble clean native 1080 picture base
        run: |
          set -euo pipefail
          printf "file '/tmp/v13final/cold_picture_1080.mp4'\nfile '/tmp/v13final/v4public/rest_base.mp4'\n" > /tmp/v13final/full_concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/v13final/full_concat.txt -c copy /tmp/v13final/full_clean_base_1080.mp4
          test -s /tmp/v13final/full_clean_base_1080.mp4

      - name: Prepare retained V13 correction assets
        run: |
          set -euo pipefail
          cp "$GEN_DIR/WC-Y01.png" /tmp/v13final/patch/WC-Y01.png
          cp "$GEN_DIR/WD-T03.png" /tmp/v13final/patch/WD-T03.png
          cp "$GEN_DIR/WC-D03.png" /tmp/v13final/patch/WC-D03.png
          cp "$GEN_DIR/WC-D05.png" /tmp/v13final/patch/WC-D05.png
          cp "$GEN_DIR/WB-N04.png" /tmp/v13final/patch/WB-N04.png

          cp /tmp/v13final/v5patch/nuclear_concept_clean.png /tmp/v13final/patch/
          cp /tmp/v13final/v5patch/nuclear_unbuilt_clean.png /tmp/v13final/patch/
          cp /tmp/v13final/v5patch/heavy_lift_logistics_clean.png /tmp/v13final/patch/
          cp /tmp/v13final/v5patch/ground_vs_air_clean.png /tmp/v13final/patch/
          cp /tmp/v13final/v5patch/survivor_detail_clean.png /tmp/v13final/patch/

          for f in /tmp/v13final/patch/*.png; do test -s "$f"; done

      - name: Build approved white-base orange-active subtitle layer
        run: |
          set -euo pipefail
          python3 TC497/FULL_V13/make_orange_running_ass.py             --words "$WORD_CSV"             --source-ass /tmp/v13final/overlay_v4.ass             --output /tmp/v13final/v13.ass

          grep -q '&H00FFFFFF&' /tmp/v13final/v13.ass
          grep -q '&H003A8AF2&' /tmp/v13final/v13.ass
          ! grep -q '&H003D6FB9&' /tmp/v13final/v13.ass
          ! grep -q 'CapV10' /tmp/v13final/v13.ass
          ! grep -q 'BorderStyle=3' /tmp/v13final/v13.ass

          python3 - <<'PY'
          from pathlib import Path

          src=Path('/tmp/v13final/v13.ass')
          dst=Path('/tmp/v13final/v13_textless.ass')
          END=1222.30

          def parse_time(v):
              h,m,s=v.split(':')
              return int(h)*3600+int(m)*60+float(s)

          def fmt_time(sec):
              sec=max(0,sec)
              h=int(sec//3600); sec-=h*3600
              m=int(sec//60); sec-=m*60
              return f"{h}:{m:02d}:{sec:05.2f}"

          out=[]
          for line in src.read_text(encoding='utf-8-sig').splitlines():
              if not line.startswith('Dialogue:'):
                  out.append(line)
                  continue
              p=line.split(',',3)
              if len(p)<4:
                  out.append(line)
                  continue
              st=parse_time(p[1]); en=parse_time(p[2])
              if st >= END:
                  continue
              if en > END:
                  p[2]=fmt_time(END)
                  line=','.join(p)
              out.append(line)

          dst.write_text('\n'.join(out)+'\n',encoding='utf-8')
          assert 'Dialogue:' in dst.read_text(encoding='utf-8')
          for line in dst.read_text(encoding='utf-8').splitlines():
              if line.startswith('Dialogue:'):
                  p=line.split(',',3)
                  assert parse_time(p[1]) < END + 0.01, line
                  assert parse_time(p[2]) <= END + 0.01, line
          PY

      - name: Encode native 1080 FULL V13 picture
        run: |
          set -euo pipefail
          B=/tmp/v13final/full_clean_base_1080.mp4
          P=/tmp/v13final/patch

          ffmpeg -y -loglevel error             -i "$B"             -loop 1 -framerate 30 -i "$P/electric_human_v6.png"             -loop 1 -framerate 30 -i "$P/nuclear_concept_clean.png"             -loop 1 -framerate 30 -i "$P/nuclear_unbuilt_clean.png"             -loop 1 -framerate 30 -i "$P/WC-Y01.png"             -loop 1 -framerate 30 -i "$P/WD-T03.png"             -loop 1 -framerate 30 -i "$P/WC-D03.png"             -loop 1 -framerate 30 -i "$P/WC-D05.png"             -loop 1 -framerate 30 -i "$P/heavy_lift_logistics_clean.png"             -loop 1 -framerate 30 -i "$P/ground_vs_air_clean.png"             -loop 1 -framerate 30 -i "$P/survivor_detail_clean.png"             -loop 1 -framerate 30 -i "$P/WB-N04.png"             -loop 1 -framerate 30 -i "$P/HIA_TEXTLESS_END_1080.png"             -filter_complex "               [0:v]tpad=stop_mode=clone:stop_duration=0.08[base];               [1:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=6.108,setpts=PTS-STARTPTS+215.356/TB[p1];               [2:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=7.924,setpts=PTS-STARTPTS+709.241/TB[p2];               [3:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=6.603,setpts=PTS-STARTPTS+730.373/TB[p3];               [4:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=9.084,setpts=PTS-STARTPTS+766.838/TB[p4];               [5:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=7.570,setpts=PTS-STARTPTS+815.287/TB[p5];               [6:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=8.212,setpts=PTS-STARTPTS+1020.122/TB[p6];               [7:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=8.211,setpts=PTS-STARTPTS+1054.611/TB[p7];               [8:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=8.212,setpts=PTS-STARTPTS+1079.245/TB[p8];               [9:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=8.212,setpts=PTS-STARTPTS+1107.164/TB[p9];               [10:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,trim=duration=6.470,setpts=PTS-STARTPTS+1209.007/TB[p10];               [11:v]crop=iw*0.70:ih*0.70:iw*0.15:ih*0.15,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,format=rgba,                 trim=duration=7.60,setpts=PTS-STARTPTS,fade=t=in:st=0:d=0.25:alpha=1,fade=t=out:st=6.90:d=0.70:alpha=1,setpts=PTS+716.90/TB[p11];               [12:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,eq=brightness=0.015:contrast=1.025:saturation=0.92,trim=duration=14.233,setpts=PTS-STARTPTS+1222.300/TB[p12];               [base][p1]overlay=0:0:eof_action=pass:enable='between(t,215.356,221.464)'[v1];               [v1][p2]overlay=0:0:eof_action=pass:enable='between(t,709.241,717.165)'[v2];               [v2][p3]overlay=0:0:eof_action=pass:enable='between(t,730.373,736.976)'[v3];               [v3][p4]overlay=0:0:eof_action=pass:enable='between(t,766.838,775.922)'[v4];               [v4][p5]overlay=0:0:eof_action=pass:enable='between(t,815.287,822.857)'[v5];               [v5][p6]overlay=0:0:eof_action=pass:enable='between(t,1020.122,1028.334)'[v6];               [v6][p7]overlay=0:0:eof_action=pass:enable='between(t,1054.611,1062.822)'[v7];               [v7][p8]overlay=0:0:eof_action=pass:enable='between(t,1079.245,1087.457)'[v8];               [v8][p9]overlay=0:0:eof_action=pass:enable='between(t,1107.164,1115.376)'[v9];               [v9][p10]overlay=0:0:eof_action=pass:enable='between(t,1209.007,1215.477)'[v10];               [v10][p11]overlay=0:0:eof_action=pass[v11];               [v11][p12]overlay=0:0:eof_action=pass:enable='between(t,1222.300,1236.533)'[v12];               [v12]ass=/tmp/v13final/v13_textless.ass,format=yuv420p[vout]"             -map "[vout]" -an -t 1236.533333 -r 30             -c:v libx264 -preset veryfast -crf 16 -profile:v high -level 4.1 -pix_fmt yuv420p -movflags +faststart             /tmp/v13final/v13_final_picture_1080.mp4

      - name: Mux approved V9 audio bit-for-bit
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error             -i /tmp/v13final/v13_final_picture_1080.mp4             -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4             -map 0:v:0 -map 1:a:0 -c copy -t 1236.533333 -movflags +faststart             "$MASTER"

          ffmpeg -y -loglevel error -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4 -map 0:a:0 -c copy -f adts /tmp/v13final/v9.aac
          ffmpeg -y -loglevel error -i "$MASTER" -map 0:a:0 -c copy -f adts /tmp/v13final/final.aac
          sha256sum /tmp/v13final/v9.aac /tmp/v13final/final.aac | tee /tmp/v13final/report/AUDIO_SHA256.txt
          cmp /tmp/v13final/v9.aac /tmp/v13final/final.aac

      - name: Final picture subtitle audio QC
        run: |
          set -euo pipefail

