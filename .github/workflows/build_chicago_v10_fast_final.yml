name: Build Chicago V10 Fast Final Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v10_fast_final.yml'
      - 'CHICAGO/V10/**'

permissions:
  contents: write

jobs:
  build-fast-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full unzip python3-pil python3-opencv python3-numpy jq zip fonts-dejavu-core

      - name: Download V9 review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v10fast /tmp/chicago_src /tmp/chicago_extract /tmp/hia_brand
          mkdir -p /tmp/v10fast/remotion/src /tmp/v10fast/remotion/public /tmp/v10fast/qc /tmp/chicago_src /tmp/chicago_extract /tmp/hia_brand
          cd /tmp/v10fast
          gh release download chicago-v9-first-episode-end-screen-review-20260921             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4'
          mv HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4 v9.mp4
          echo 'c436ccb1894efe750ecd6d23369f2062b6a2354f8f8ec9e84758520602281e50  v9.mp4' | sha256sum -c -

      - name: Download canonical source metadata/audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > source.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  source.rar' | sha256sum -c -

          7z x -y source.rar -o/tmp/chicago_extract             "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"

          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -s "$V2"; test -s "$SRT"; test -s "$WORDS"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"

          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/v10fast/original.aac
          AH="$(sha256sum /tmp/v10fast/original.aac | awk '{print $1}')"
          test "$AH" = 'a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'

      - name: Download clean HIA brand base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/hia_brand
          gh release download chicago-channel-brand-assets-extracted-20260920             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'
          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip -d extracted
          BASE="$(find /tmp/hia_brand/extracted -type f -name '07_generic_reusable_thumbnail_base.png' | head -n1)"
          test -s "$BASE"
          cp "$BASE" /tmp/v10fast/remotion/public/end_screen_clean_base.png

      - name: Prepare V10 tail Remotion data
        run: |
          set -euo pipefail
          cp CHICAGO/V10/src/index.jsx /tmp/v10fast/remotion/src/index.jsx
          cp CHICAGO/V10/package.json /tmp/v10fast/remotion/package.json

          # Base video only needs correct dimensions for the composition.
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=960x540:r=25 -t 1291             -c:v libx264 -preset ultrafast -crf 35 -pix_fmt yuv420p /tmp/v10fast/remotion/public/base.mp4

          # Rebuild the actual running captions from canonical V2 SRT + word timing.
          # Minimal dummy plan because outro has no cards/provenance.
          echo '[]' > /tmp/v10fast/empty_plan.json
          python3 CHICAGO/V10/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan /tmp/v10fast/empty_plan.json             --captions-out /tmp/v10fast/remotion/public/captions.json             --overlays-out /tmp/v10fast/remotion/public/overlays.json             --report /tmp/v10fast/qc/remotion_data_report.json

          cd /tmp/v10fast/remotion
          npm install --no-audit --no-fund

      - name: Render only V10 outro frames
        working-directory: /tmp/v10fast/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          # 21:12.72 = frame 31818. Render only final 450 frames.
          npx remotion render src/index.jsx ChicagoV10 out/v10_tail.mp4             --frames=31818-32267             --codec=h264 --crf=19 --pixel-format=yuv420p --concurrency=4

      - name: Build V9 prefix and join V10 tail
        run: |
          set -euo pipefail
          # Re-encode only picture, no audio. Exact 25fps frame split at frame 31818.
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/v10fast/v9.mp4             -an -vf "trim=end_frame=31818,setpts=PTS-STARTPTS"             -r 25 -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p             /tmp/v10fast/prefix.mp4

          # Normalize tail encoder settings and timestamps.
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/v10fast/remotion/out/v10_tail.mp4             -an -vf "setpts=PTS-STARTPTS"             -r 25 -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p             /tmp/v10fast/tail_norm.mp4

          printf "file '/tmp/v10fast/prefix.mp4'\nfile '/tmp/v10fast/tail_norm.mp4'\n" > /tmp/v10fast/concat.txt
          ffmpeg -y -hide_banner -loglevel error             -f concat -safe 0 -i /tmp/v10fast/concat.txt             -c copy /tmp/v10fast/picture.mp4

          # Force exact total frame count and mux original AAC.
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/v10fast/picture.mp4             -i /tmp/v10fast/original.aac             -map 0:v:0 -map 1:a:0             -frames:v 32268             -c:v copy -c:a copy -movflags +faststart             /tmp/v10fast/HIA_CHICAGO_V10_FINAL_REVIEW_960x540.mp4

      - name: Final technical QC
        run: |
          set -euo pipefail
          OUT=/tmp/v10fast/HIA_CHICAGO_V10_FINAL_REVIEW_960x540.mp4
          Q=/tmp/v10fast/qc

          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> "$Q/decode_errors.txt"
          test ! -s "$Q/decode_errors.txt"

          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$OUT")"
          test "$FRAMES" = "32268"

          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$OUT")"
          test "$FPS" = "25/1"

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts "$Q/final.aac"
          AH="$(sha256sum "$Q/final.aac" | awk '{print $1}')"
          test "$AH" = 'a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'

          ffmpeg -hide_banner -nostats -i "$OUT"             -vf "blackdetect=d=0.08:pix_th=0.10:pic_th=0.98" -an -f null - 2> "$Q/blackdetect.log" || true
          BLACK="$(grep -c 'black_start:' "$Q/blackdetect.log" || true)"
          test "$BLACK" = "0"

          ffmpeg -hide_banner -nostats -i "$OUT"             -af "loudnorm=I=-14:TP=-1:LRA=11:print_format=json" -f null - 2> "$Q/loudnorm.log" || true

          # Correct subtitle checker gate: inspect JSON verdict, not fragile grep regex.
          python3 CHICAGO/tools/analyze_subtitle_alignment.py             --words "$WORDS" --srt "$SRT"             --out-json "$Q/subtitle_alignment.json"             --out-md "$Q/subtitle_alignment.md"
          python3 - <<'PY'
          import json
          p='/tmp/v10fast/qc/subtitle_alignment.json'
          d=json.load(open(p))
          assert len(d)==1 and d[0]['verdict']=='PASS', d
          print('subtitle verdict',d[0]['verdict'])
          print('token match',d[0]['matched_token_ratio'])
          print('median offset',d[0]['start_offset_sec']['median'])
          print('runtime drift',d[0]['estimated_offset_change_over_runtime_sec'])
          PY

          # End-screen stills for final visual inspection.
          ffmpeg -y -loglevel error -ss 1274 -i "$OUT" -frames:v 1 "$Q/end_1274.jpg"
          ffmpeg -y -loglevel error -ss 1282 -i "$OUT" -frames:v 1 "$Q/end_1282.jpg"
          ffmpeg -y -loglevel error -ss 1289 -i "$OUT" -frames:v 1 "$Q/end_1289.jpg"

          sha256sum "$OUT" > "$Q/VIDEO_SHA256.txt"
          {
            echo '# Chicago V10 Final Review QC'
            echo
            echo "- Full decode: PASS"
            echo "- Frames: $FRAMES"
            echo "- FPS: $FPS"
            echo "- Blackdetect events: $BLACK"
            echo "- Original AAC: bit-identical PASS"
            echo "- Subtitle↔VO independent audit: PASS"
            echo "- Outro: canonical HIA asset 07 + one Subscribe circle; no video recommendation slots"
            echo "- AI RECONSTRUCTION: absent"
          } > "$Q/V10_FINAL_QC.md"

      - name: Publish V10 final review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/v10fast
          zip -q -r HIA_CHICAGO_V10_FINAL_QC.zip qc
          TAG=chicago-v10-final-review-20260922
          BODY='Chicago V10 final review candidate. Uses approved V9 edit through 21:12.72 and brand-native first-episode outro built from canonical HIA asset 07. One Subscribe/avatar circle only; no recommendation slots. Full decode, exact frame count, original AAC identity, black-frame check, and independent subtitle-to-VO timing audit all pass.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG"               HIA_CHICAGO_V10_FINAL_REVIEW_960x540.mp4               HIA_CHICAGO_V10_FINAL_QC.zip               qc/VIDEO_SHA256.txt               --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG"               HIA_CHICAGO_V10_FINAL_REVIEW_960x540.mp4               HIA_CHICAGO_V10_FINAL_QC.zip               qc/VIDEO_SHA256.txt               --title 'Chicago V10 Final Review 960x540'               --notes "$BODY"               --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v10-final-review
          path: |
            /tmp/v10fast/HIA_CHICAGO_V10_FINAL_REVIEW_960x540.mp4
            /tmp/v10fast/qc
          retention-days: 14
