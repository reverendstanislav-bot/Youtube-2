name: VIDEO006 Tory 1964 Report Figure Screening
on:
  push:
    paths:
      - '.github/workflows/project_pluto_report_screening.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF renderer
        run: python -m pip install pymupdf pillow
      - name: Retrieve actual Project Pluto PDF source reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pluto_primary_reports
          gh release download project-pluto-authentic-primary-documents-20261021 --pattern 'DOC-0*.pdf' --dir pluto_primary_reports
      - name: Screen actual PDF pages for engineering diagrams/photos
        run: python PROJECT_PLUTO/ARCHIVE/screen_tory_engineering_reports.py
      - name: Save contact sheets and page manifest without huge PDF derivatives in Git
        run: |
          mkdir -p PROJECT_PLUTO/ARCHIVE/TORY_PRIMARY_REPORT_REVIEW
          cp pluto_pdf_screening/REPORT_CONTACT_*.jpg PROJECT_PLUTO/ARCHIVE/TORY_PRIMARY_REPORT_REVIEW/
          cp pluto_pdf_screening/CANDIDATE_INDEX.json PROJECT_PLUTO/ARCHIVE/TORY_PRIMARY_REPORT_REVIEW/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_PLUTO/ARCHIVE/TORY_PRIMARY_REPORT_REVIEW/
          git commit -m "Project Pluto true source primary-report figure screening and page index [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Pluto_Tory_Primary_Engineering_Schematics_Page_QC
          path: pluto_pdf_screening/
          retention-days: 14
          compression-level: 6
