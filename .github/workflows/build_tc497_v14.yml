name: Build TC497 V14 Cold Open

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_v14.yml'

permissions:
  contents: write

jobs:
  build-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils unzip

      - name: Prepare source package and V14 workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tc497pkg /tmp/v14 /tmp/v13report
          mkdir -p /tmp/tc497pkg /tmp/v14/remotion/src /tmp/v14/remotion/public /tmp/v14/work /tmp/v14/extra /tmp/v13report

          curl -fL --retry 3             'https://github.com/reverendstanislav-bot/Youtube-2/releases/download/tc497-codex-ready-v1/Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip'             -o /tmp/tc497_package.zip
          unzip -q /tmp/tc497_package.zip -d /tmp/tc497pkg

          PKG_ROOT="$(find /tmp/tc497pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          GEN_DIR="$(find "$PKG_ROOT" -type d -name FINAL_62 | head -n 1)"
          test -n "$PKG_ROOT"
          test -n "$GEN_DIR"

          echo "PKG_ROOT=$PKG_ROOT" >> "$GITHUB_ENV"
          echo "GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"
          echo "V14_EXTRA=/tmp/v14/extra" >> "$GITHUB_ENV"
          echo "V14_PUBLIC=/tmp/v14/remotion/public" >> "$GITHUB_ENV"
          echo "V14_WORK=/tmp/v14/work" >> "$GITHUB_ENV"

          unzip -q TC497/V13/TC497_V13_REMOTION_REPORT.zip -d /tmp/v13report
          cp /tmp/v13report/captions.json /tmp/v14/remotion/public/captions.json
          cp TC497/V14/index.jsx /tmp/v14/remotion/src/index.jsx
          cp TC497/V14/package.json /tmp/v14/remotion/package.json

      - name: Download new V14 intro stills
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_205048_9a93ab08-0b5f-4cee-a90b-02be280f33d8.png' -o /tmp/v14/extra/INTRO_DETAIL.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_205048_7c76b45f-a479-41aa-bfc9-ff2cbd1c8425.png' -o /tmp/v14/extra/INTRO_OBSERVERS.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_205049_dec611bc-41d8-4d99-be03-d21f5042cdc6.png' -o /tmp/v14/extra/INTRO_REVEAL.png
          file /tmp/v14/extra/INTRO_*.png
          test -s /tmp/v14/extra/INTRO_DETAIL.png
          test -s /tmp/v14/extra/INTRO_OBSERVERS.png
          test -s /tmp/v14/extra/INTRO_REVEAL.png

      - name: Preserve V13 audio mix exactly
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error             -i TC497/V13/TC497_V13_COLD_OPEN_FINAL_POLISH.mp4             -vn -ac 2 -ar 48000 -c:a pcm_s16le             /tmp/v14/remotion/public/mix.wav

      - name: Build V14 static picture track
        run: |
          set -euo pipefail
          python3 TC497/V14/prep_v14.py
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/v14/remotion/public/base.mp4

      - name: Install Remotion
        working-directory: /tmp/v14/remotion
        run: npm install --no-audit --no-fund

      - name: Render V14 through Remotion
        working-directory: /tmp/v14/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.jsx TC497V14 out/raw.mp4             --codec=h264 --crf=16 --pixel-format=yuv420p

      - name: Final FFmpeg mux and QC
        run: |
          set -euo pipefail
          mkdir -p TC497/V14/assets /tmp/v14/report
          ffmpeg -y -loglevel error -i /tmp/v14/remotion/out/raw.mp4             -c copy -movflags +faststart             TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4

          ffprobe -v error -show_entries             stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate             -of json TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4             > /tmp/v14/report/V14_FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4             -af ebur128=peak=true -f null - 2> /tmp/v14/report/V14_EBUR128.txt || true

          ffmpeg -hide_banner -nostats             -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4             -vf "fps=1/3,signalstats,metadata=print:file=/tmp/v14/report/V14_LUMA_SAMPLE.txt"             -an -f null - >/dev/null 2>&1 || true

          cp /tmp/v14/work/V14_EDIT_DECISIONS.csv /tmp/v14/report/
          cp TC497/V14/prep_v14.py /tmp/v14/report/
          cp TC497/V14/index.jsx /tmp/v14/report/
          cp TC497/V14/package.json /tmp/v14/report/
          cp TC497/V14/README.md /tmp/v14/report/V14_CHANGELOG.md
          cp /tmp/v14/remotion/public/captions.json /tmp/v14/report/

          cat > /tmp/v14/report/V14_BUILD_INFO.txt <<'EOF'
          TC497 V14
          Intro detail: 9a93ab08-0b5f-4cee-a90b-02be280f33d8
          Intro observers: 7c76b45f-a479-41aa-bfc9-ff2cbd1c8425
          Intro reveal: dec611bc-41d8-4d99-be03-d21f5042cdc6
          HIA style master: 97d7c09a-ae84-48b7-a663-ba72d98f025f
          Audio: exact extracted V13 final mix; no timing changes.
          Pipeline: FFmpeg source prep -> Remotion edit/composite -> FFmpeg final remux/QC.
          No AI video generation.
          EOF

          (cd /tmp/v14/report && zip -q -r "$GITHUB_WORKSPACE/TC497/V14/TC497_V14_REMOTION_REPORT.zip" .)

          cp /tmp/v14/extra/INTRO_DETAIL.png TC497/V14/assets/
          cp /tmp/v14/extra/INTRO_OBSERVERS.png TC497/V14/assets/
          cp /tmp/v14/extra/INTRO_REVEAL.png TC497/V14/assets/

          (cd TC497/V14 && sha256sum             TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4             TC497_V14_REMOTION_REPORT.zip             assets/INTRO_DETAIL.png             assets/INTRO_OBSERVERS.png             assets/INTRO_REVEAL.png             > SHA256SUMS.txt)

          ls -lh TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4 TC497/V14/TC497_V14_REMOTION_REPORT.zip

      - name: Publish V14 artifacts to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TC497/V14
          if git diff --cached --quiet; then
            echo "No V14 changes to commit"
          else
            git commit -m "Publish TC497 V14 targeted cold open"
            git push
          fi

      - name: Upload V14 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc497-v14-review
          path: |
            TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4
            TC497/V14/TC497_V14_REMOTION_REPORT.zip
            TC497/V14/SHA256SUMS.txt
            TC497/V14/README.md
          compression-level: 0
          retention-days: 7
