name: Audit Chicago Source Archive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_chicago_source.yml'

permissions:
  contents: write

jobs:
  audit-chicago-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq
          if ! command -v 7z >/dev/null; then
            echo "7z missing" >&2
            exit 1
          fi

      - name: Download source archive parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_src
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*' \
            --pattern 'CHICAGO_SOURCE_ARCHIVE_MANIFEST.json' \
            --pattern 'SHA256SUMS.txt'
          ls -lh

      - name: Verify parts and reassemble exact RAR
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          printf '%s  %s\n%s  %s\n%s  %s\n' \
  'ab58661d982a8789df49f6d431e1e0e9678af7de02d60e8db468988603cc5a79' 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00' \
  'a4525cd68439b0ff143326eb44e168fa516361ae132ebe268f9d423c29ea3297' 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01' \
  '620c8e160026a8917ea9a8779b620301a514a283a1aad91926c8012ac1ba9899' 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02' | sha256sum -c -
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          test "$(stat -c%s Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar)" = "4741988746"
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Test RAR integrity and build inventory
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          mkdir -p "$GITHUB_WORKSPACE/CHICAGO/AUDIT" /tmp/chicago_text

          7z t Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            > "$GITHUB_WORKSPACE/CHICAGO/AUDIT/RAR_TEST.txt" 2>&1

          7z l -slt Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            > "$GITHUB_WORKSPACE/CHICAGO/AUDIT/RAR_LIST_SLT.txt"

          python3 "$GITHUB_WORKSPACE/CHICAGO/tools/audit_source_inventory.py" \
            --slt "$GITHUB_WORKSPACE/CHICAGO/AUDIT/RAR_LIST_SLT.txt" \
            --out "$GITHUB_WORKSPACE/CHICAGO/AUDIT/SOURCE_INVENTORY.json" \
            --summary "$GITHUB_WORKSPACE/CHICAGO/AUDIT/SOURCE_AUDIT.md"

      - name: Extract project text / subtitle / manifest files only
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_text \
            -ir!'*.md' -ir!'*.txt' -ir!'*.json' -ir!'*.csv' \
            -ir!'*.srt' -ir!'*.ass' -ir!'*.vtt' -ir!'*.sbv' \
            -ir!'*.py' -ir!'*.js' -ir!'*.jsx' -ir!'*.ts' -ir!'*.tsx' \
            -ir!'*.ps1' -ir!'*.sh' -ir!'*.yaml' -ir!'*.yml' \
            >/tmp/chicago_text_extract.log 2>&1 || true

          python3 "$GITHUB_WORKSPACE/CHICAGO/tools/audit_source_text.py" \
            --root /tmp/chicago_text \
            --report "$GITHUB_WORKSPACE/CHICAGO/AUDIT/TEXT_SOURCE_AUDIT.md" \
            --index "$GITHUB_WORKSPACE/CHICAGO/AUDIT/TEXT_FILES_INDEX.json"

      - name: Add audit completion record
        run: |
          set -euo pipefail
          {
            echo
            echo "## Automated source-archive audit"
            echo
            echo "- archive SHA-256 verified: PASS"
            echo "- RAR integrity test: PASS"
            echo "- full file inventory: \`CHICAGO/AUDIT/SOURCE_INVENTORY.json\`"
            echo "- human-readable audit: \`CHICAGO/AUDIT/SOURCE_AUDIT.md\`"
            echo "- text/subtitle/build audit: \`CHICAGO/AUDIT/TEXT_SOURCE_AUDIT.md\`"
          } >> CHICAGO/CURRENT_STATUS_HANDOFF.md

      - name: Commit audit reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/AUDIT CHICAGO/CURRENT_STATUS_HANDOFF.md
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit canonical Chicago source archive"
            git push
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-source-audit
          path: CHICAGO/AUDIT
          retention-days: 14

# audit tooling ready
