name: Chicago V9 Exhaustive Prepublication QC

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qc_chicago_v9_exhaustive.yml'
      - 'CHICAGO/tools/final_prepublication_qc.py'

permissions:
  contents: write

jobs:
  exhaustive-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install QC tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-opencv python3-numpy python3-pil jq zip

      - name: Download V9 review and QC package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_final_qc /tmp/chicago_src /tmp/chicago_extract
          mkdir -p /tmp/chicago_final_qc /tmp/chicago_src /tmp/chicago_extract
          cd /tmp/chicago_final_qc
          gh release download chicago-v9-first-episode-end-screen-review-20260921             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4'             --pattern 'HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_QC.zip'

          unzip -q HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_QC.zip
          VIDEO=/tmp/chicago_final_qc/HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4
          SHOTS=/tmp/chicago_final_qc/qc/V9_SHOTS.json
          test -s "$VIDEO"
          test -s "$SHOTS"
          echo "VIDEO=$VIDEO" >> "$GITHUB_ENV"
          echo "SHOTS=$SHOTS" >> "$GITHUB_ENV"

          echo 'c436ccb1894efe750ecd6d23369f2062b6a2354f8f8ec9e84758520602281e50  HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4' | sha256sum -c -

      - name: Download and reconstruct canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract canonical script, timing, facts and licenses
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_extract             "-ir!*/02_SCRIPT/voiceover_en.txt"             "-ir!*/03_TIMELINE/scene_map.csv"             "-ir!*/03_TIMELINE/timeline.csv"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"             "-ir!*/06_LICENSES_FACTS/fact_map.csv"             "-ir!*/06_LICENSES_FACTS/license_manifest.csv"             "-ir!*/06_LICENSES_FACTS/music_attribution.txt"

          SCRIPT="$(find /tmp/chicago_extract -type f -path '*/02_SCRIPT/voiceover_en.txt' | head -n1)"
          SCENE_MAP="$(find /tmp/chicago_extract -type f -path '*/03_TIMELINE/scene_map.csv' | head -n1)"
          TIMELINE="$(find /tmp/chicago_extract -type f -path '*/03_TIMELINE/timeline.csv' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          FACT_MAP="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/fact_map.csv' | head -n1)"
          LICENSES="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/license_manifest.csv' | head -n1)"
          MUSIC_ATTR="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/music_attribution.txt' | head -n1)"

          for v in "$SCRIPT" "$SCENE_MAP" "$TIMELINE" "$SRT" "$WORDS" "$FACT_MAP" "$LICENSES" "$MUSIC_ATTR"; do
            test -s "$v"
          done

          {
            echo "SCRIPT=$SCRIPT"
            echo "SCENE_MAP=$SCENE_MAP"
            echo "TIMELINE=$TIMELINE"
            echo "SRT=$SRT"
            echo "WORDS=$WORDS"
            echo "FACT_MAP=$FACT_MAP"
            echo "LICENSES=$LICENSES"
            echo "MUSIC_ATTR=$MUSIC_ATTR"
          } >> "$GITHUB_ENV"

      - name: Rebuild V9 captions and overlays deterministically
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_final_qc/current
          python3 CHICAGO/V9/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan "$SHOTS"             --captions-out /tmp/chicago_final_qc/current/captions.json             --overlays-out /tmp/chicago_final_qc/current/overlays.json             --report /tmp/chicago_final_qc/current/remotion_data_report.json

          ! grep -q 'AI RECONSTRUCTION' /tmp/chicago_final_qc/current/overlays.json

      - name: Verify audio bitstream is unchanged
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_final_qc/exhaustive
          ffmpeg -y -loglevel error -i "$VIDEO" -map 0:a:0 -c copy -f adts /tmp/chicago_final_qc/exhaustive/v9_audio.aac
          AH="$(sha256sum /tmp/chicago_final_qc/exhaustive/v9_audio.aac | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          echo "$AH  v9_audio.aac" > /tmp/chicago_final_qc/exhaustive/AUDIO_BITSTREAM_SHA256.txt
          test "$AH" = "$EXPECTED"

      - name: Run independent FFmpeg visual/audio detectors
        run: |
          set -euo pipefail
          Q=/tmp/chicago_final_qc/exhaustive

          ffmpeg -hide_banner -nostats -i "$VIDEO"             -vf "blackdetect=d=0.08:pix_th=0.10:pic_th=0.98"             -an -f null - 2> "$Q/BLACKDETECT.log" || true

          ffmpeg -hide_banner -nostats -i "$VIDEO"             -vf "freezedetect=n=-55dB:d=3"             -an -f null - 2> "$Q/FREEZEDETECT.log" || true

          ffmpeg -hide_banner -nostats -i "$VIDEO"             -af "silencedetect=n=-60dB:d=0.5"             -vn -f null - 2> "$Q/SILENCEDETECT.log" || true

          ffmpeg -hide_banner -nostats -i "$VIDEO"             -af "astats=metadata=1:reset=1"             -vn -f null - 2> "$Q/ASTATS.log" || true

          ffmpeg -hide_banner -nostats -i "$VIDEO"             -vf "select='gt(scene,0.40)',metadata=print"             -an -vsync vfr -f null - 2> "$Q/SCENE_DETECT.log" || true

      - name: Run exhaustive frame, audio, timing, script and layout QC
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/final_prepublication_qc.py             --video "$VIDEO"             --shots "$SHOTS"             --captions /tmp/chicago_final_qc/current/captions.json             --overlays /tmp/chicago_final_qc/current/overlays.json             --scene-map "$SCENE_MAP"             --script "$SCRIPT"             --voice-words "$WORDS"             --srt "$SRT"             --fact-map "$FACT_MAP"             --timeline "$TIMELINE"             --outdir /tmp/chicago_final_qc/exhaustive             | tee /tmp/chicago_final_qc/exhaustive/AUTOMATIC_GATE.json

      - name: Audit fact and license coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, re, os
          from pathlib import Path
          out=Path('/tmp/chicago_final_qc/exhaustive')

          def rows(path):
              with open(path,encoding='utf-8-sig',errors='replace',newline='') as f:
                  return list(csv.DictReader(f,delimiter=';'))

          facts=rows(os.environ['FACT_MAP'])
          licenses=rows(os.environ['LICENSES'])
          shots=json.loads(Path(os.environ['SHOTS']).read_text(encoding='utf-8-sig'))

          fact_status={}
          fact_conf={}
          unlocked=[]
          for r in facts:
              status=(r.get('status') or r.get('Status') or '').strip()
              conf=(r.get('confidence') or r.get('Confidence') or '').strip()
              fact_status[status]=fact_status.get(status,0)+1
              fact_conf[conf]=fact_conf.get(conf,0)+1
              if status and status.upper() not in ('LOCKED','PASS','VERIFIED'):
                  unlocked.append(r)

          lic_by_id={}
          missing_lic=[]
          for r in licenses:
              rid=(r.get('id') or '').strip()
              if rid: lic_by_id[rid]=r
              required=['source_page','license']
              if any(not (r.get(k) or '').strip() for k in required):
                  missing_lic.append(r)

          referenced=set()
          for s in shots:
              blob=' '.join(str(s.get(k,'')) for k in ('source','asset'))
              referenced.update(re.findall(r'\b(A\d{2})\b',blob))

          missing_ref=sorted(x for x in referenced if x not in lic_by_id)
          risk={}
          for x in referenced:
              if x in lic_by_id:
                  rr=(lic_by_id[x].get('risk') or '').strip()
                  risk[rr]=risk.get(rr,0)+1

          report={
            'fact_rows':len(facts),
            'fact_status_counts':fact_status,
            'fact_confidence_counts':fact_conf,
            'nonlocked_fact_rows':len(unlocked),
            'license_rows':len(licenses),
            'license_rows_missing_source_or_license':len(missing_lic),
            'referenced_archive_ids':sorted(referenced),
            'referenced_archive_ids_missing_from_license_manifest':missing_ref,
            'referenced_license_risk_counts':risk,
            'music_attribution_bytes':Path(os.environ['MUSIC_ATTR']).stat().st_size
          }
          (out/'FACT_LICENSE_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Build every-shot visual contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import cv2, json, math, os
          from pathlib import Path

          video=os.environ['VIDEO']
          shots=json.loads(Path(os.environ['SHOTS']).read_text(encoding='utf-8-sig'))
          out=Path('/tmp/chicago_final_qc/exhaustive/shot_contact_sheets')
          out.mkdir(parents=True,exist_ok=True)

          cap=cv2.VideoCapture(video)
          thumbs=[]
          for i,s in enumerate(shots):
              mid=(int(s['a'])+int(s['b']))//2
              cap.set(cv2.CAP_PROP_POS_FRAMES,mid)
              ok,fr=cap.read()
              if not ok:
                  continue
              fr=cv2.resize(fr,(320,180),interpolation=cv2.INTER_AREA)
              t=mid/25.0
              mm=int(t//60); ss=t-mm*60
              label=f"{i:03d} {mm:02d}:{ss:05.2f} {s.get('scene','')}"
              cv2.rectangle(fr,(0,0),(320,26),(0,0,0),-1)
              cv2.putText(fr,label,(6,18),cv2.FONT_HERSHEY_SIMPLEX,.42,(255,255,255),1,cv2.LINE_AA)
              thumbs.append(fr)
          cap.release()

          per=20; cols=5; rows=4
          for p in range((len(thumbs)+per-1)//per):
              part=thumbs[p*per:(p+1)*per]
              sheet=cv2.resize(part[0],(320,180))*0
              sheet=cv2.vconcat([
                  cv2.hconcat(part[r*cols:min((r+1)*cols,len(part))] +
                              [sheet]*(cols-len(part[r*cols:min((r+1)*cols,len(part))])))
                  for r in range(rows)
              ])
              cv2.imwrite(str(out/f'SHOTS_{p+1:02d}.jpg'),sheet,[cv2.IMWRITE_JPEG_QUALITY,85])
          print('shot thumbnails',len(thumbs),'pages',(len(thumbs)+per-1)//per)
          PY

      - name: Build transition-centered contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import cv2, json, os
          from pathlib import Path

          video=os.environ['VIDEO']
          shots=json.loads(Path(os.environ['SHOTS']).read_text(encoding='utf-8-sig'))
          out=Path('/tmp/chicago_final_qc/exhaustive/transition_contact_sheets')
          out.mkdir(parents=True,exist_ok=True)
          cap=cv2.VideoCapture(video)
          thumbs=[]

          for i in range(1,len(shots)):
              b=int(shots[i]['a'])
              frames=[]
              for off in (-2,-1,0,1,2):
                  idx=max(0,b+off)
                  cap.set(cv2.CAP_PROP_POS_FRAMES,idx)
                  ok,fr=cap.read()
                  if not ok: continue
                  fr=cv2.resize(fr,(192,108),interpolation=cv2.INTER_AREA)
                  cv2.putText(fr,f"{off:+d}",(7,18),cv2.FONT_HERSHEY_SIMPLEX,.45,(255,255,255),1,cv2.LINE_AA)
                  frames.append(fr)
              if len(frames)==5:
                  strip=cv2.hconcat(frames)
                  t=b/25
                  mm=int(t//60); ss=t-mm*60
                  cv2.rectangle(strip,(0,0),(250,25),(0,0,0),-1)
                  cv2.putText(strip,f"{i:03d} {mm:02d}:{ss:05.2f}",(6,18),cv2.FONT_HERSHEY_SIMPLEX,.45,(255,255,255),1,cv2.LINE_AA)
                  thumbs.append(strip)
          cap.release()

          per=6
          for p in range((len(thumbs)+per-1)//per):
              part=thumbs[p*per:(p+1)*per]
              blank=part[0]*0
              part=part+[blank]*(per-len(part))
              sheet=cv2.vconcat(part)
              cv2.imwrite(str(out/f'TRANSITIONS_{p+1:02d}.jpg'),sheet,[cv2.IMWRITE_JPEG_QUALITY,84])
          print('transition strips',len(thumbs),'pages',(len(thumbs)+per-1)//per)
          PY

      - name: Add independent detector counts to summary
        run: |
          set -euo pipefail
          Q=/tmp/chicago_final_qc/exhaustive
          {
            echo
            echo '## Independent FFmpeg detector cross-check'
            echo
            echo "- blackdetect events: **$(grep -c 'black_start:' "$Q/BLACKDETECT.log" || true)**"
            echo "- freezedetect starts: **$(grep -c 'freeze_start:' "$Q/FREEZEDETECT.log" || true)**"
            echo "- silencedetect starts: **$(grep -c 'silence_start:' "$Q/SILENCEDETECT.log" || true)**"
            echo "- scene detector metadata events: **$(grep -c 'lavfi.scene_score' "$Q/SCENE_DETECT.log" || true)**"
            echo
            echo 'Machine detectors are cross-checks; still-photo freeze events are not automatically defects.'
          } >> "$Q/EXHAUSTIVE_QC.md"

      - name: Package exhaustive QC
        run: |
          set -euo pipefail
          cd /tmp/chicago_final_qc
          zip -q -r HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip exhaustive current
          sha256sum HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip > EXHAUSTIVE_QC_SHA256.txt

      - name: Publish exhaustive QC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chicago_final_qc
          TAG=chicago-v9-exhaustive-qc-20260921
          BODY='Exhaustive pre-publication QC for Chicago V9 review. Includes every-frame 25fps analysis, continuous/sample-level audio analysis, full decode/PTS checks, transition/freeze/flash/black checks, script-SRT-VO-scene-map cross-check, overlay geometry, fact/license audit, and contact sheets for all 207 shots and all shot boundaries. This is QC only; no generation.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG"               HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip               EXHAUSTIVE_QC_SHA256.txt               --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG"               HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip               EXHAUSTIVE_QC_SHA256.txt               --title 'Chicago V9 Exhaustive Prepublication QC'               --notes "$BODY"               --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record compact exhaustive QC in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V9/EXHAUSTIVE_QC
          cp /tmp/chicago_final_qc/exhaustive/EXHAUSTIVE_QC.md CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/chicago_final_qc/exhaustive/AUTOMATIC_GATE.json CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/chicago_final_qc/exhaustive/FACT_LICENSE_AUDIT.json CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/chicago_final_qc/exhaustive/AUDIO_BITSTREAM_SHA256.txt CHICAGO/V9/EXHAUSTIVE_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V9/EXHAUSTIVE_QC
          git commit -m "Record Chicago V9 exhaustive prepublication QC"
          git push

      - name: Upload QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v9-exhaustive-prepublication-qc
          path: |
            /tmp/chicago_final_qc/exhaustive
            /tmp/chicago_final_qc/current
          retention-days: 14
