name: Build V10 Canon Proofs — Chicago S01 + TC497 S02

on:
  push:
    paths:
      - '.github/workflows/build_hia_v10_two_proofs.yml'
      - 'SHORTS_RENDER/build_clean_asset_proof.py'
      - 'CHICAGO/SHORTS/CHI-S01_V10_PROOF.json'
      - 'TC497/SHORTS/TC497-S02_V10_PROOF.json'
      - 'CHICAGO/SHORTS/shorts_extraction_map.json'
      - 'TC497/SHORTS/shorts_extraction_map.json'
      - 'TC497/FULL_V13/asset_urls.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hia-v10-two-proofs
  cancel-in-progress: true

jobs:
  chicago_s01:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg p7zip-full python3 python3-pil fonts-dejavu-core jq
          python3 -m py_compile SHORTS_RENDER/build_clean_asset_proof.py
          mkdir -p /tmp/chi/{assets,qc,out}

      - name: Download and reconstruct Chicago source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chi
          : > source.rar
          for part in 00 01 02; do
            name="Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part${part}"
            gh release download chicago-source-archive-v1               --repo reverendstanislav-bot/Youtube-2               --pattern "$name"
            cat "$name" >> source.rar
            rm -f "$name"
          done
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  source.rar' | sha256sum -c -

      - name: Extract only clean assets needed by CHI-S01
        run: |
          set -euo pipefail
          cd /tmp/chi
          7z x -y source.rar -oextract             '-ir!*S001_P001.png'             '-ir!*S002_P002.png'             '-ir!*S004_P003.png'             '-ir!*S006_P004.png'             '-ir!*A01_IllinoisTunnelIntersectionCloser.jpg'             '-ir!*A02_IllinoisTunnelMap1910.png'
          for n in S001_P001.png S002_P002.png S004_P003.png S006_P004.png A01_IllinoisTunnelIntersectionCloser.jpg A02_IllinoisTunnelMap1910.png; do
            src="$(find extract -type f -name "$n" | head -n1)"
            test -s "$src" || { echo "MISSING $n" >&2; exit 1; }
            cp "$src" "assets/$n"
          done
          rm -rf source.rar extract
          file assets/*

      - name: Download Chicago R14 audio source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chi
          gh release download chicago-r14-editorial-recut-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4 audio_source.mp4

      - name: Render CHI-S01 V10 proof
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_clean_asset_proof.py             --plan CHICAGO/SHORTS/CHI-S01_V10_PROOF.json             --map CHICAGO/SHORTS/shorts_extraction_map.json             --asset-dir /tmp/chi/assets             --audio-source /tmp/chi/audio_source.mp4             --out /tmp/chi/out/CHI-S01_V10_PROOF.mp4             --qc /tmp/chi/qc

      - name: CHI-S01 technical and visual QC pack
        run: |
          set -euo pipefail
          P=/tmp/chi/out/CHI-S01_V10_PROOF.mp4
          ffmpeg -v error -xerror -i "$P" -f null - 2>/tmp/chi/qc/decode.txt
          test ! -s /tmp/chi/qc/decode.txt
          python3 - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          p=Path('/tmp/chi/out/CHI-S01_V10_PROOF.mp4'); q=Path('/tmp/chi/qc')
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          v=next(x for x in info['streams'] if x['codec_type']=='video')
          a=next(x for x in info['streams'] if x['codec_type']=='audio')
          dur=float(info['format']['duration'])
          assert v['width']==1080 and v['height']==1920 and v['r_frame_rate']=='25/1'
          assert a['sample_rate']=='48000' and int(a['channels'])==2
          assert abs(dur-34.88)<0.35
          times=[dur*x for x in [.02,.10,.20,.30,.40,.50,.60,.70,.80,.90,.98]]
          font=ImageFont.load_default(); frames=[]
          for i,t in enumerate(times):
            jpg=q/f'frame_{i+1:02d}.jpg'
            subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
            frames.append((t,Image.open(jpg).convert('RGB').copy()))
          canvas=Image.new('RGB',(1080*4,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas)
          for i,(t,im) in enumerate(frames):
            x=(i%4)*1080; y=(i//4)*1920; canvas.paste(im,(x,y))
            d.rectangle((x,y,x+260,y+42),fill=(10,10,10)); d.text((x+8,y+12),f'{t:.1f}s',fill=(245,245,245),font=font)
          canvas.thumbnail((2160,2880)); canvas.save(q/'CONTACT.jpg',quality=92)
          report={'id':'CHI-S01','status':'TECH_PASS','duration':dur,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (q/'QC.json').write_text(json.dumps(report,indent=2))
          PY
          ! grep -R -n '100,100)}' /tmp/chi/qc

      - uses: actions/upload-artifact@v4
        with:
          name: chi-s01-v10-proof
          path: |
            /tmp/chi/out/CHI-S01_V10_PROOF.mp4
            /tmp/chi/qc
          compression-level: 0
          retention-days: 7

  tc497_s02:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip poppler-utils python3 python3-pil fonts-dejavu-core jq
          python3 -m py_compile SHORTS_RENDER/build_clean_asset_proof.py
          mkdir -p /tmp/tc/{assets,qc,out,pkg}

      - name: Download generated clean assets
        run: |
          set -euo pipefail
          M=TC497/FULL_V13/asset_urls.json
          for n in V3_ASSEMBLY.png V2_TRACTION.png V3_COUPLING.png V2_DISTRIBUTION.png V2_POWERTRAIN.png V4_WHEEL_ALT.png V3_WHEEL_MOTION.png V2_ELECTRIC_HERO.png V2_PREDECESSOR_EARLY.png V3_PREDECESSOR.png; do
            url="$(jq -r --arg n "$n" '.v4_extra[$n] // empty' "$M")"
            test -n "$url" || { echo "NO URL $n" >&2; exit 1; }
            curl -fL --retry 4 --retry-all-errors "$url" -o "/tmp/tc/assets/$n"
          done
          url="$(jq -r '.v6_patch["electric_wheel_v6.png"]' "$M")"
          curl -fL --retry 4 --retry-all-errors "$url" -o /tmp/tc/assets/electric_wheel_v6.png
          file /tmp/tc/assets/*

      - name: Download verified TC497 patent document
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/tc/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Extract patent page
        run: |
          set -euo pipefail
          ZIP="$(find /tmp/tc/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n1)"
          test -s "$ZIP"
          unzip -q "$ZIP" -d /tmp/tc/pkg
          PAT="$(find /tmp/tc/pkg -type f -name 'AR-PATENT__*' | head -n1)"
          test -s "$PAT" || { echo "AR-PATENT missing" >&2; exit 1; }
          case "${PAT##*.}" in
            pdf|PDF)
              pdftoppm -f 1 -l 1 -singlefile -png -r 180 "$PAT" /tmp/tc/assets/AR_PATENT
              ;;
            png|PNG|jpg|JPG|jpeg|JPEG)
              cp "$PAT" /tmp/tc/assets/AR_PATENT.png
              ;;
            *)
              echo "Unsupported patent asset: $PAT" >&2; exit 1;;
          esac
          test -s /tmp/tc/assets/AR_PATENT.png
          rm -rf /tmp/tc/pkg /tmp/tc/pkg_artifact

      - name: Download TC497 R14 audio source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/tc
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 audio_source.mp4

      - name: Render TC497-S02 V10 proof
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_clean_asset_proof.py             --plan TC497/SHORTS/TC497-S02_V10_PROOF.json             --map TC497/SHORTS/shorts_extraction_map.json             --asset-dir /tmp/tc/assets             --audio-source /tmp/tc/audio_source.mp4             --out /tmp/tc/out/TC497-S02_V10_PROOF.mp4             --qc /tmp/tc/qc

      - name: TC497-S02 technical and visual QC pack
        run: |
          set -euo pipefail
          P=/tmp/tc/out/TC497-S02_V10_PROOF.mp4
          ffmpeg -v error -xerror -i "$P" -f null - 2>/tmp/tc/qc/decode.txt
          test ! -s /tmp/tc/qc/decode.txt
          python3 - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          p=Path('/tmp/tc/out/TC497-S02_V10_PROOF.mp4'); q=Path('/tmp/tc/qc')
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          v=next(x for x in info['streams'] if x['codec_type']=='video')
          a=next(x for x in info['streams'] if x['codec_type']=='audio')
          dur=float(info['format']['duration'])
          assert v['width']==1080 and v['height']==1920 and v['r_frame_rate']=='30/1'
          assert a['sample_rate']=='48000' and int(a['channels'])==2
          assert abs(dur-50.8)<0.35
          times=[dur*x for x in [.02,.10,.20,.30,.40,.50,.60,.70,.80,.90,.98]]
          font=ImageFont.load_default(); frames=[]
          for i,t in enumerate(times):
            jpg=q/f'frame_{i+1:02d}.jpg'
            subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
            frames.append((t,Image.open(jpg).convert('RGB').copy()))
          canvas=Image.new('RGB',(1080*4,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas)
          for i,(t,im) in enumerate(frames):
            x=(i%4)*1080; y=(i//4)*1920; canvas.paste(im,(x,y))
            d.rectangle((x,y,x+260,y+42),fill=(10,10,10)); d.text((x+8,y+12),f'{t:.1f}s',fill=(245,245,245),font=font)
          canvas.thumbnail((2160,2880)); canvas.save(q/'CONTACT.jpg',quality=92)
          report={'id':'TC497-S02','status':'TECH_PASS','duration':dur,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (q/'QC.json').write_text(json.dumps(report,indent=2))
          PY
          ! grep -R -n '100,100)}' /tmp/tc/qc

      - uses: actions/upload-artifact@v4
        with:
          name: tc497-s02-v10-proof
          path: |
            /tmp/tc/out/TC497-S02_V10_PROOF.mp4
            /tmp/tc/qc
          compression-level: 0
          retention-days: 7

  package:
    needs: [chicago_s01,tc497_s02]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chi-s01-v10-proof
          path: /tmp/all/CHICAGO
      - uses: actions/download-artifact@v4
        with:
          name: tc497-s02-v10-proof
          path: /tmp/all/TC497
      - name: Package two-proof gate
        run: |
          set -euo pipefail
          cd /tmp/all
          zip -q -r -0 HIA_V10_GATE_PROOFS_CHI-S01_TC497-S02.zip CHICAGO TC497
          sha256sum HIA_V10_GATE_PROOFS_CHI-S01_TC497-S02.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hia-v10-gate-proofs
          path: |
            /tmp/all/HIA_V10_GATE_PROOFS_CHI-S01_TC497-S02.zip
            /tmp/all/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
