name: Build Chicago V3 Sequence Fix Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v3_sequence_fix_review.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil fonts-dejavu-core jq zip

      - name: Download and reconstruct canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_src
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract clean V2 work assets, V2 master and caption timing
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_extract /tmp/chicago_v3
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_extract \
            "-ir!*/_V2/work/assets/*" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.srt" \
            "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -d "$ASSETS"; test -s "$V2"; test -s "$SRT"; test -s "$WORDS"
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"
          echo "Clean V2 work assets: $(find "$ASSETS" -type f | wc -l)"

      - name: Rebuild V3 picture from clean assets
        run: |
          set -euo pipefail
          python3 CHICAGO/V3/build_v3_picture.py \
            --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json \
            --assets-root "$ASSETS" \
            --work /tmp/chicago_v3/picture \
            --output-video /tmp/chicago_v3/HIA_CHICAGO_V3_PICTURE_960x540.mp4 \
            --plan-out /tmp/chicago_v3/V3_SHOTS.json

      - name: Generate scene-aware visible captions
        run: |
          set -euo pipefail
          python3 CHICAGO/V3/make_v3_running_ass.py \
            --srt "$SRT" \
            --words "$WORDS" \
            --output /tmp/chicago_v3/HIA_CHICAGO_V3_RUNNING.ass \
            | tee /tmp/chicago_v3/ASS_BUILD_REPORT.txt
          grep -q 'Style: Run,DejaVu Sans,29,&H00FFFFFF&,&H003A8AF2&' /tmp/chicago_v3/HIA_CHICAGO_V3_RUNNING.ass
          grep -q 'Style: RunEnd' /tmp/chicago_v3/HIA_CHICAGO_V3_RUNNING.ass

      - name: Burn one caption layer and copy original AAC
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_v3/HIA_CHICAGO_V3_SEQUENCE_FIX_REVIEW_960x540.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/chicago_v3/HIA_CHICAGO_V3_PICTURE_960x540.mp4 \
            -i "$V2" \
            -filter_complex "[0:v]ass=/tmp/chicago_v3/HIA_CHICAGO_V3_RUNNING.ass:fontsdir=/usr/share/fonts/truetype/dejavu[v]" \
            -map "[v]" -map 1:a:0 \
            -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -r 25 -g 50 \
            -c:a copy -movflags +faststart \
            "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Run technical and sequence QC
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v3/qc
          ffprobe -v error -show_streams -show_format -of json "$OUT" > /tmp/chicago_v3/qc/FFPROBE.json
          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> /tmp/chicago_v3/qc/DECODE_ERRORS.txt
          test ! -s /tmp/chicago_v3/qc/DECODE_ERRORS.txt

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.15, d
          PY

          ffmpeg -y -v error -i "$OUT" -map 0:a:0 -c copy -f adts /tmp/chicago_v3/qc/audio.aac
          AH="$(sha256sum /tmp/chicago_v3/qc/audio.aac | awk '{print $1}')"
          test "$AH" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$AH  audio.aac" > /tmp/chicago_v3/qc/AUDIO_SHA256.txt

          sha256sum "$OUT" > /tmp/chicago_v3/qc/VIDEO_SHA256.txt

          python3 CHICAGO/tools/audit_v2_sequence.py \
            --shots /tmp/chicago_v3/V3_SHOTS.json \
            --out-json /tmp/chicago_v3/qc/V3_SEQUENCE_AUDIT.json \
            --out-md /tmp/chicago_v3/qc/V3_SEQUENCE_AUDIT.md

      - name: Build visual review sheets
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v3/frames
          ffmpeg -hide_banner -loglevel error -i "$OUT" \
            -vf "fps=1/10,scale=384:216:flags=lanczos" \
            -q:v 3 /tmp/chicago_v3/frames/f_%04d.jpg

          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import math
          src=sorted(Path('/tmp/chicago_v3/frames').glob('f_*.jpg'))
          out=Path('/tmp/chicago_v3/qc')
          font=ImageFont.load_default()
          per=16; cols=4; tw,th=384,216; lh=22
          for si in range(math.ceil(len(src)/per)):
              batch=src[si*per:(si+1)*per]
              sheet=Image.new('RGB',(cols*tw,4*(th+lh)),(18,20,22)); d=ImageDraw.Draw(sheet)
              for j,p in enumerate(batch):
                  idx=si*per+j; im=Image.open(p).convert('RGB')
                  x=(j%cols)*tw; y=(j//cols)*(th+lh)
                  sheet.paste(im,(x,y))
                  t=idx*10; mm=int(t//60); ss=int(t%60)
                  d.rectangle((x,y+th,x+tw,y+th+lh),fill=(18,20,22))
                  d.text((x+5,y+th+5),f'{mm:02d}:{ss:02d}',font=font,fill='white')
              sheet.save(out/f'GLOBAL_SHEET_{si+1:02d}.jpg',quality=88)
          PY

          # Explicit checkpoints for every corrected block.
          for t in 75 86 101 114 129 144 352 369 385 401 426 492 505 511 553 565 573 582 941 951 962 1080 1090 1103 1148 1162 1170 1183 1189 1200 1210 1216 1273 1284; do
            ffmpeg -y -loglevel error -ss "$t" -i "$OUT" -frames:v 1 "/tmp/chicago_v3/qc/check_${t}s.jpg"
          done

      - name: Freeze / scene diagnostics
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -i "$OUT" -vf "freezedetect=n=-55dB:d=0.8" -map 0:v:0 -f null - \
            2> /tmp/chicago_v3/qc/FREEZEDETECT_LOG.txt || true
          ffmpeg -hide_banner -i "$OUT" -filter:v "select='gt(scene,0.35)',showinfo" -f null - \
            2> /tmp/chicago_v3/qc/SCENE_CHANGE_LOG.txt || true

      - name: Build QC summary and enforce planned fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          q=Path('/tmp/chicago_v3/qc')
          d=json.loads((q/'V3_SEQUENCE_AUDIT.json').read_text())
          assert d['shot_count'] < 217, d['shot_count']
          assert len(d['shots_under_1_5s']) < 4, len(d['shots_under_1_5s'])
          # no legacy V2 giant explainer cards exist in this rebuild; all explainers use new compact upper-left overlay.
          explain=sum((s['end']-s['start']) for a in d['explainers'].values() for s in a)
          lines=[
            '# Chicago V3 sequence-fix review QC','',
            '- Rebuilt from clean V2 work-assets: YES',
            '- Old bottom three-card explainer overlays: REMOVED',
            '- New compact upper-left explainer rail: ENABLED',
            '- Normal captions: bottom-safe zone',
            '- End-screen captions from 21:10: top-safe zone',
            f"- Shots: {d['shot_count']} (V2 had 217)",
            f"- Shots <1.5s: {len(d['shots_under_1_5s'])} (V2 had 4)",
            f"- A→B→A returns: {len(d['aba_returns'])} (V2 had 5)",
            f"- Source returns within 6 shots: {len(d['quick_source_returns_within_6_shots'])} (V2 had 23)",
            f"- Explainer runtime: {explain:.2f}s, now using compact overlays above subtitle zone.",
            '- Audio bitstream: identical to approved V1/V2 source AAC.',
            '- Full decode: PASS.',
            '',
            'Targeted corrected blocks:',
            '- 01:10–02:34 State Street: one-way source progression, no A/B/A photo bouncing.',
            '- 05:49–07:17 map block: overview → real detail → archive evidence → overview crop → later map.',
            '- 08:29.92–08:32.12 coal: 1.04s + 1.16s flash pair merged into one 2.20s visual.',
            '- all gauge/transfer/coal/basement/water/survivor explainers: bottom cards removed.',
            '- 19:05–20:18 late reconstruction run: redundant/flash cuts consolidated.',
          ]
          (q/'V3_QC_SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Publish review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-v3-sequence-fix-review-20260920
          cp /tmp/chicago_v3/HIA_CHICAGO_V3_RUNNING.ass /tmp/chicago_v3/qc/
          cp /tmp/chicago_v3/ASS_BUILD_REPORT.txt /tmp/chicago_v3/qc/
          cp /tmp/chicago_v3/V3_SHOTS.json /tmp/chicago_v3/qc/
          cd /tmp/chicago_v3
          zip -r HIA_CHICAGO_V3_SEQUENCE_FIX_QC.zip qc >/dev/null
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt
          BODY='Review only. Rebuilt from clean V2 work-assets. Sequence cleanup, compact caption-safe explainers, scene-aware visible captions. Original AAC preserved bit-for-bit. Not a publication master until user approval.'
          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUT" HIA_CHICAGO_V3_SEQUENCE_FIX_QC.zip SHA256SUMS.txt \
              --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG" \
              "$OUT" HIA_CHICAGO_V3_SEQUENCE_FIX_QC.zip SHA256SUMS.txt \
              --title 'Chicago V3 Sequence Fix Review 960x540' \
              --notes "$BODY" \
              --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record build in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V3/REVIEW_QC
          cp /tmp/chicago_v3/qc/V3_QC_SUMMARY.md CHICAGO/V3/REVIEW_QC/
          cp /tmp/chicago_v3/qc/V3_SEQUENCE_AUDIT.md CHICAGO/V3/REVIEW_QC/
          cp /tmp/chicago_v3/qc/VIDEO_SHA256.txt CHICAGO/V3/REVIEW_QC/
          cp /tmp/chicago_v3/qc/AUDIO_SHA256.txt CHICAGO/V3/REVIEW_QC/
          cp /tmp/chicago_v3/ASS_BUILD_REPORT.txt CHICAGO/V3/REVIEW_QC/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V3/REVIEW_QC
          git commit -m "Record Chicago V3 sequence-fix review QC"
          git push

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v3-sequence-fix-review
          path: |
            /tmp/chicago_v3/HIA_CHICAGO_V3_SEQUENCE_FIX_REVIEW_960x540.mp4
            /tmp/chicago_v3/qc
          retention-days: 14

# rerun after Windows path normalization
