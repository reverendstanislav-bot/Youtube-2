name: Lake Peigneur V4 Remotion Review
on:
  push:
    paths:
      - ".github/workflows/lake_peigneur_v4_render.yml"
      - "LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/IMPLEMENTATION/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: hia-lake-peigneur-source-recovery-20261010
      REVIEW_TAG: hia-lake-peigneur-v4-remotion-review-20261011
      PATCH_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/1bbbe958-3f59-47b2-8a3b-436292440ff6.zip
      PATCH_SHA: 58a62008e3e901cdaaeda815793e22578f7ef1d9f21c99b1d7633f548bdb6418
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg for preview and final QC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download original assets and approved V3 source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp/parts temp/recovered temp/v3patch review output
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'HIA_LAKE_SOURCE_PART_*.zip' --dir temp/parts
          test "$(find temp/parts -name '*.zip' | wc -l)" -eq 3
          for z in temp/parts/*.zip; do unzip -q -o "$z" -d temp/recovered; done
          P="$GITHUB_WORKSPACE/temp/recovered/HIA_LAKE_PEIGNEUR_FULL_SOURCE_RECOVERY/01_EDIT_PROJECT/project_files/Youtube-2/LAKE_PEIGNEUR/REMOTION_V1"
          S="$GITHUB_WORKSPACE/temp/recovered/HIA_LAKE_PEIGNEUR_FULL_SOURCE_RECOVERY/02_FINAL_VISUALS"
          test -f "$P/src/index.jsx"
          test -f "$P/public/timeline.json"
          mkdir -p "$P/public/assets"
          find "$S/GFX" "$S/RECONSTRUCTION" -name '*.png' -type f -exec cp -n {} "$P/public/assets/" \;
          curl -fLsS --retry 3 "$PATCH_URL" -o temp/v3patch.zip
          echo "$PATCH_SHA  temp/v3patch.zip" | sha256sum -c -
          unzip -q temp/v3patch.zip -d temp/v3patch
          cp temp/v3patch/index.jsx "$P/src/index.jsx"
          cp temp/v3patch/timeline.json "$P/public/timeline.json"
          cp temp/v3patch/approved_first_end_1080.png "$P/public/approved_first_end_1080.png"
          test -f "$P/public/LAKE_PEIGNEUR_ARTHUR_MASTER_LOCKED.mp3"
          echo "LP_PROJECT=$P" >> "$GITHUB_ENV"
      - name: Install V4 and validate locked content
        shell: bash
        run: |
          set -euo pipefail
          python3 LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/IMPLEMENTATION/apply_v4_to_v3.py --project "$LP_PROJECT" --dry-run
          python3 LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/IMPLEMENTATION/apply_v4_to_v3.py --project "$LP_PROJECT"
          cd "$LP_PROJECT"
          npm install --ignore-scripts --no-audit --no-fund --prefer-offline
          npx remotion compositions src/index.jsx
      - name: Render and technically review four control clips
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cd "$LP_PROJECT"
          for spec in '0-1599:opening' '8375-11499:collapse' '13500-15374:canal' '22125-24710:finale'; do
            range="$(echo "$spec" | cut -d: -f1)"
            label="$(echo "$spec" | cut -d: -f2)"
            npx remotion render src/index.jsx LakePeigneurV1 "$GITHUB_WORKSPACE/review/$label.mp4" --frames="$range" --codec=h264 --crf=18 --pixel-format=yuv420p --concurrency=3 --log=error
            ffmpeg -v error -xerror -i "$GITHUB_WORKSPACE/review/$label.mp4" -f null -
            ffmpeg -hide_banner -loglevel error -i "$GITHUB_WORKSPACE/review/$label.mp4" -vf 'fps=1/8,scale=320:-1,tile=4x4' -frames:v 1 -y "$GITHUB_WORKSPACE/review/$label.jpg"
          done
          cd "$GITHUB_WORKSPACE"
          zip -q -0 -j output/V4_PREVIEWS.zip review/*
      - name: Render original-image full master and QC
        shell: bash
        timeout-minutes: 105
        run: |
          set -euo pipefail
          cd "$LP_PROJECT"
          npx remotion render src/index.jsx LakePeigneurV1 "$GITHUB_WORKSPACE/output/V4_PICTURE.mp4" --codec=h264 --crf=15 --pixel-format=yuv420p --concurrency=3 --muted --log=error
          ffmpeg -hide_banner -loglevel error -y -i "$GITHUB_WORKSPACE/output/V4_PICTURE.mp4" -i "$LP_PROJECT/public/LAKE_PEIGNEUR_ARTHUR_MASTER_LOCKED.mp3" -filter_complex '[1:a]aresample=48000,pan=stereo|c0=c0|c1=c0,adelay=43|43,apad=whole_dur=988.44,atrim=duration=988.44[a]' -map 0:v -map '[a]' -c:v copy -bsf:v 'h264_metadata=video_full_range_flag=0:colour_primaries=1:transfer_characteristics=1:matrix_coefficients=1' -c:a aac -b:a 192k -ar 48000 -ac 2 -t 988.44 -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 -movflags +faststart "$GITHUB_WORKSPACE/output/HIA_LAKE_PEIGNEUR_V4_ACCENTS_REVIEW_MASTER_1080P25.mp4"
          ffmpeg -v error -xerror -i "$GITHUB_WORKSPACE/output/HIA_LAKE_PEIGNEUR_V4_ACCENTS_REVIEW_MASTER_1080P25.mp4" -f null -
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import subprocess,json,hashlib,pathlib
          p=pathlib.Path("output/HIA_LAKE_PEIGNEUR_V4_ACCENTS_REVIEW_MASTER_1080P25.mp4")
          d=json.loads(subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,width,height,r_frame_rate,nb_frames,color_primaries,color_space,color_range:format=duration,size","-of","json",str(p)],capture_output=True,text=True,check=True).stdout)
          v=next(x for x in d["streams"] if x["codec_type"]=="video")
          assert (v["width"],v["height"],v["r_frame_rate"])==(1920,1080,"25/1")
          assert int(v["nb_frames"])==24711
          assert v["color_primaries"]=="bt709" and v["color_range"]=="tv"
          assert abs(float(d["format"]["duration"])-988.44)<0.15
          assert not any(x["codec_type"]=="subtitle" for x in d["streams"])
          with open("output/V4_SHA256SUMS.txt","w") as f:
            f.write(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")
          print("FULL VIDEO/AUDIO DECODE PASS — technical review only")
          PY
      - name: Publish technical review release — NOT PUBLIC READY
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$REVIEW_TAG" --repo "$GITHUB_REPOSITORY" --title "HIA Lake Peigneur V4 Remotion Technical Review" --notes "PREVIEW AND MASTER ONLY. Human QC, rights, title/thumbnail and YouTube Unlisted still open." || gh release view "$REVIEW_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$REVIEW_TAG" output/V4_PREVIEWS.zip output/V4_SHA256SUMS.txt output/HIA_LAKE_PEIGNEUR_V4_ACCENTS_REVIEW_MASTER_1080P25.mp4 --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIA_LAKE_V4_PREVIEWS_AND_LOGS
          path: |
            review/*
            output/V4_PREVIEWS.zip
            output/V4_SHA256SUMS.txt
          retention-days: 14
