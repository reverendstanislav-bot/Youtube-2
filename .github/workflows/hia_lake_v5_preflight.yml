name: Lake Peigneur V5 Locked-Source Repair Preflight
on:
  push:
    paths:
      - '.github/workflows/hia_lake_v5_preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: hia-lake-peigneur-source-recovery-20261010
      PATCH_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/1bbbe958-3f59-47b2-8a3b-436292440ff6.zip
      PATCH_SHA: 58a62008e3e901cdaaeda815793e22578f7ef1d9f21c99b1d7633f548bdb6418
    steps:
      - uses: actions/checkout@v4
      - name: Install source-only proofing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil poppler-utils
      - name: Recover original source, original endscreen, locked Arthur VO and archival USGS materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp/parts temp/recovered temp/v3patch temp/archive_download temp/archive output
          gh release download "$SOURCE_TAG" -R "$GITHUB_REPOSITORY" --pattern 'HIA_LAKE_SOURCE_PART_*.zip' --dir temp/parts
          test "$(find temp/parts -name '*.zip' | wc -l)" -eq 3
          for z in temp/parts/*.zip; do unzip -q -o "$z" -d temp/recovered; done
          P="$GITHUB_WORKSPACE/temp/recovered/HIA_LAKE_PEIGNEUR_FULL_SOURCE_RECOVERY/01_EDIT_PROJECT/project_files/Youtube-2/LAKE_PEIGNEUR/REMOTION_V1"
          S="$GITHUB_WORKSPACE/temp/recovered/HIA_LAKE_PEIGNEUR_FULL_SOURCE_RECOVERY/02_FINAL_VISUALS"
          test -f "$P/src/index.jsx"
          mkdir -p "$P/public/assets"
          find "$S/GFX" "$S/RECONSTRUCTION" -name '*.png' -type f -exec cp -n {} "$P/public/assets/" \;
          curl -fLsS --retry 3 "$PATCH_URL" -o temp/v3patch.zip
          echo "$PATCH_SHA  temp/v3patch.zip" | sha256sum -c -
          unzip -q temp/v3patch.zip -d temp/v3patch
          cp temp/v3patch/timeline.json "$P/public/timeline.json"
          cp temp/v3patch/index.jsx "$P/src/index.jsx"
          cp temp/v3patch/approved_first_end_1080.png "$P/public/approved_first_end_1080.png"
          gh run download 36176288181 -R "$GITHUB_REPOSITORY" -n LAKE_PEIGNEUR_ARCHIVE_SOURCE_PACK_V1 -D temp/archive_download
          while IFS= read -r -d '' z; do unzip -q -o "$z" -d temp/archive; done < <(find temp/archive_download -type f -name '*.zip' -print0)
          echo "LP_PROJECT=$P" >> "$GITHUB_ENV"
      - name: Apply exact original V4 before non-destructive V5 scene repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/IMPLEMENTATION/apply_v4_to_v3.py --project "$LP_PROJECT" --dry-run
          python3 LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/IMPLEMENTATION/apply_v4_to_v3.py --project "$LP_PROJECT"
          python3 LAKE_PEIGNEUR/PUBLISHING/ACCENT_V4/REPAIR_V5/apply_v5_replacements.py --project "$LP_PROJECT" --archive "$GITHUB_WORKSPACE/temp/archive" --output "$GITHUB_WORKSPACE/output"
          test -f output/V5_REPLACEMENTS_AND_PROVENANCE.json
          python3 - <<'PY'
          import json
          m=json.load(open('output/V5_REPLACEMENTS_AND_PROVENANCE.json'))
          assert m['unique_old_ids']==9 and m['replaced_exposures']==10 and m['active_accents']==36 and m['source_reuse_max']<=2
          assert len(m['new_federal_sources'])==2,m['new_federal_sources']
          print('ACTUAL SOURCE REPAIR PREFLIGHT PASS — no video generated',m['replaced_exposures'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIA_LAKE_V5_TEN_SHOT_BEFORE_AFTER_PREFLIGHT
          path: |
            output/V5_REPLACEMENTS_AND_PROVENANCE.json
            output/V5_BEFORE_AFTER_*.jpg
          retention-days: 14
