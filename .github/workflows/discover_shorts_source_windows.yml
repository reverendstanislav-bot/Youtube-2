name: Discover Shorts Source Windows

on:
  push:
    paths:
      - '.github/workflows/discover_shorts_source_windows.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: discover-shorts-source-windows
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip

      - name: Download Chicago source transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/shorts_chicago /tmp/shorts_tc
          mkdir -p /tmp/shorts_chicago /tmp/shorts_tc
          cd /tmp/shorts_chicago
          gh release download chicago-source-archive-v1 --repo reverendstanislav-bot/Youtube-2 --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 > source.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  source.rar' | sha256sum -c -
          7z x -y source.rar -oextract "-ir!*/_QC/voice_words.json"
          find /tmp/shorts_chicago/extract -type f -name voice_words.json -print -quit > /tmp/chicago_words_path.txt
          test -s "$(cat /tmp/chicago_words_path.txt)"

      - name: Download TC497 word transcript
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip' -o /tmp/shorts_tc/transcript.zip
          unzip -q /tmp/shorts_tc/transcript.zip -d /tmp/shorts_tc/extract
          find /tmp/shorts_tc/extract -type f -name TC497_VO_WORD_LEVEL.csv -print -quit > /tmp/tc_words_path.txt
          test -s "$(cat /tmp/tc_words_path.txt)"

      - name: Build source windows and sentence-aligned candidates
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/SHORTS_WORK TC497/SHORTS_WORK
          CHI_WORDS="$(cat /tmp/chicago_words_path.txt)" TC_WORDS="$(cat /tmp/tc_words_path.txt)" python3 - <<'PY'
          import os, json, csv, re
          from pathlib import Path

          def load_chicago(path):
              raw=json.loads(Path(path).read_text(encoding='utf-8-sig'))
              return [
                  {'w':str(x.get('word','')).strip(),'s':float(x['start']),'e':float(x['end'])}
                  for x in raw if str(x.get('word','')).strip()
              ]

          def load_tc(path):
              out=[]
              with open(path,encoding='utf-8-sig',newline='') as f:
                  for r in csv.DictReader(f):
                      out.append({'w':r['word'],'s':float(r['start_sec']),'e':float(r['end_sec'])})
              return out

          def norm(s):
              return re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()

          def anchor_word_index(words,anchor):
              toks=[]; refs=[]
              for i,x in enumerate(words):
                  for t in norm(x['w']).split():
                      toks.append(t); refs.append(i)
              a=norm(anchor).split()
              for i in range(max(0,len(toks)-len(a)+1)):
                  if toks[i:i+len(a)]==a:
                      return refs[i]
              if a:
                  for i,t in enumerate(toks):
                      if a[0] in t:
                          return refs[i]
              return None

          def fixed_window(words,anchor,pre=9,post=34):
              idx=anchor_word_index(words,anchor)
              if idx is None:
                  return {'anchor':anchor,'found':False}
              center=words[idx]['s']
              seg=[x for x in words if x['e']>=max(0,center-pre) and x['s']<=center+post]
              return {
                  'anchor':anchor,'found':True,'anchor_time':round(center,3),
                  'start':round(seg[0]['s'],3),'end':round(seg[-1]['e'],3),
                  'duration':round(seg[-1]['e']-seg[0]['s'],3),
                  'text':' '.join(x['w'] for x in seg)
              }

          def is_sentence_end(token):
              return token.rstrip('”"\'').endswith(('.', '!', '?'))

          def sentence_spans(words):
              spans=[]; start=0
              for i,w in enumerate(words):
                  if is_sentence_end(w['w']):
                      spans.append((start,i)); start=i+1
              if start<len(words):
                  spans.append((start,len(words)-1))
              return spans

          def sentence_candidate(words,anchor,target_min=30,target_max=55):
              idx=anchor_word_index(words,anchor)
              if idx is None:
                  return {'anchor':anchor,'found':False}
              spans=sentence_spans(words)
              si=next((k for k,(a,b) in enumerate(spans) if a<=idx<=b),None)
              if si is None:
                  return {'anchor':anchor,'found':False}
              lo=hi=si

              def duration(nlo=lo,nhi=hi):
                  return words[spans[nhi][1]]['e']-words[spans[nlo][0]]['s']

              # Add complete neighboring sentences, preferring forward context first.
              prefer_forward=True
              while duration()<target_min:
                  options=[]
                  if hi+1<len(spans):
                      d=words[spans[hi+1][1]]['e']-words[spans[lo][0]]['s']
                      if d<=target_max: options.append(('f',d))
                  if lo>0:
                      d=words[spans[hi][1]]['e']-words[spans[lo-1][0]]['s']
                      if d<=target_max: options.append(('b',d))
                  if not options:
                      break
                  if len(options)==1:
                      side=options[0][0]
                  else:
                      side='f' if prefer_forward else 'b'
                      if side not in [x[0] for x in options]:
                          side=options[0][0]
                  if side=='f': hi+=1
                  else: lo-=1
                  prefer_forward=not prefer_forward

              a,b=spans[lo]
              b=spans[hi][1]
              seg=words[a:b+1]
              return {
                  'anchor':anchor,'found':True,'anchor_time':round(words[idx]['s'],3),
                  'start':round(seg[0]['s'],3),'end':round(seg[-1]['e'],3),
                  'duration':round(seg[-1]['e']-seg[0]['s'],3),
                  'text':' '.join(x['w'] for x in seg),
                  'words':[{'w':x['w'],'s':round(x['s'],3),'e':round(x['e'],3)} for x in seg]
              }

          chi=load_chicago(os.environ['CHI_WORDS'])
          tc=load_tc(os.environ['TC_WORDS'])

          chi_discovery=['60 miles','telephone','coal','1992','flood','july 1959','freight elevators','river']
          tc_discovery=['572 feet','54 driven wheels','electric','nuclear','yuma','400 mile','150 tons','helicopter','sky']
          chi_final=['60 miles','telephone','july 1959','1992','flood']
          tc_final=['572 feet','electric','400 mile','nuclear','helicopter']

          Path('CHICAGO/SHORTS_WORK/DISCOVERY.json').write_text(json.dumps({
              'runtime':round(chi[-1]['e'],3),'word_count':len(chi),
              'windows':[fixed_window(chi,a) for a in chi_discovery]
          },indent=2,ensure_ascii=False),encoding='utf-8')
          Path('TC497/SHORTS_WORK/DISCOVERY.json').write_text(json.dumps({
              'runtime':round(tc[-1]['e'],3),'word_count':len(tc),
              'windows':[fixed_window(tc,a) for a in tc_discovery]
          },indent=2,ensure_ascii=False),encoding='utf-8')
          Path('CHICAGO/SHORTS_WORK/CANDIDATES.json').write_text(json.dumps({
              'runtime':round(chi[-1]['e'],3),
              'candidates':[sentence_candidate(chi,a) for a in chi_final]
          },indent=2,ensure_ascii=False),encoding='utf-8')
          Path('TC497/SHORTS_WORK/CANDIDATES.json').write_text(json.dumps({
              'runtime':round(tc[-1]['e'],3),
              'candidates':[sentence_candidate(tc,a) for a in tc_final]
          },indent=2,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Validate candidates
        run: |
          set -euo pipefail
          for f in CHICAGO/SHORTS_WORK/CANDIDATES.json TC497/SHORTS_WORK/CANDIDATES.json; do
            test "$(jq '[.candidates[] | select(.found==true)] | length' "$f")" = "5"
            jq -e 'all(.candidates[]; .duration >= 20 and .duration <= 60 and (.words|length)>0)' "$f"
          done

      - name: Commit discovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/SHORTS_WORK/DISCOVERY.json CHICAGO/SHORTS_WORK/CANDIDATES.json TC497/SHORTS_WORK/DISCOVERY.json TC497/SHORTS_WORK/CANDIDATES.json
          git commit -m "Extract sentence-aligned Chicago and TC497 Shorts candidates"
          git pull --rebase origin main
          git push origin main
