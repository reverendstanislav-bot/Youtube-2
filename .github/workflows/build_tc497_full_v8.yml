name: Build TC497 FULL V8 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v8.yml'
      - 'TC497/FULL_V8/**'

permissions:
  contents: read
  actions: read

jobs:
  build-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download FULL V6 review
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v6-review
          path: /tmp/v6
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425090519
          github-token: ${{ github.token }}

      - name: Download FULL V4 report
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/v8 /tmp/report/screens TC497/FULL_V8_OUT
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/overlay_v4.ass
          test -s /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4

          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_48dcb295-57ea-4d53-901d-7ce9c3492c42.png'             -o /tmp/v8/V4_EMPTY_END.png
          test -s /tmp/v8/V4_EMPTY_END.png

          python3 TC497/FULL_V7/generate_outro_music.py             --output /tmp/v8/outro_resolve_original.wav
          test -s /tmp/v8/outro_resolve_original.wav

      - name: Render FULL V8 review
        run: |
          set -euo pipefail
          python3 TC497/FULL_V8/v8_fast_render.py             --input /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4             --clean-end /tmp/v8/V4_EMPTY_END.png             --source-ass /tmp/v4report/overlay_v4.ass             --music /tmp/v8/outro_resolve_original.wav             --work-dir /tmp/v8/work             --output TC497/FULL_V8_OUT/TC497_FULL_V8_REVIEW_960x540.mp4

      - name: QC package
        run: |
          set -euo pipefail
          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,duration:format=duration,size,bit_rate             -of json TC497/FULL_V8_OUT/TC497_FULL_V8_REVIEW_960x540.mp4             > /tmp/report/FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/FULL_V8_OUT/TC497_FULL_V8_REVIEW_960x540.mp4             -af ebur128=peak=true -f null - > /dev/null 2> /tmp/report/EBUR128.txt

          for t in 1215 1222 1223 1225 1226 1228 1232 1235; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V8_OUT/TC497_FULL_V8_REVIEW_960x540.mp4               -frames:v 1 "/tmp/report/screens/frame_${t}.jpg"
          done

          cp /tmp/v8/work/v8_tail.ass /tmp/report/
          cp TC497/FULL_V8/ENDING_DECISION.md /tmp/report/
          cp TC497/FULL_V8/v8_fast_render.py /tmp/report/
          cp TC497/FULL_V7/generate_outro_music.py /tmp/report/

          cat > /tmp/report/V8_BUILD_NOTES.md <<'EOF'
          # TC497 FULL_V8 — review build only

          FULL_V8 is NOT user-approved and is NOT a final upload master.

          Base:
          - FULL_V6 review picture/edit.

          Ending changes:
          - removes the old centered channel slogan;
          - keeps the final documentary sentence and its caption;
          - removes the generic spoken/subtitled subscribe CTA after ~20:25.45;
          - leaves the remaining ~11 seconds as clean desert end-screen space;
          - uses restrained left-aligned HIA / TC-497 / Overland Train typography;
          - preserves a clean right-side area for YouTube end-screen elements;
          - carries the end with original copyright-independent resolving music;
          - target loudness remains close to the approved V6 mix with ~-2 dBFS true-peak ceiling.

          No 1080p build is promoted by this workflow.
          EOF

          (cd /tmp/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V8_OUT/FULL_V8_REPORT.zip" .)
          (cd TC497/FULL_V8_OUT && sha256sum TC497_FULL_V8_REVIEW_960x540.mp4 FULL_V8_REPORT.zip > SHA256SUMS.txt)

      - name: Upload FULL V8 review
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v8-review
          path: |
            TC497/FULL_V8_OUT/TC497_FULL_V8_REVIEW_960x540.mp4
            TC497/FULL_V8_OUT/FULL_V8_REPORT.zip
            TC497/FULL_V8_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
