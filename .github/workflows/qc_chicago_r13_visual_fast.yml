name: Visual QC Chicago R13 Fast

on:
  push:
    paths:
      - '.github/workflows/qc_chicago_r13_visual_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil zip gh
          mkdir -p /tmp/vqc/{shots,regular,opening,out}

      - name: Download R13 review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/vqc
          gh release download chicago-r13-remotion-provenance-reedit-review-20260923 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'HIA_CHICAGO_R13_REMOTION_PROVENANCE_REEDIT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R13_REMOTION_PROVENANCE_REEDIT_REVIEW_1920x1080.mp4 chicago.mp4

      - name: Extract all shot-start samples in one decode pass
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          shots=json.loads(Path('CHICAGO/AUDIT/V2_SEQUENCE/shots.json').read_text(encoding='utf-8-sig'))
          frames=[]
          manifest=[]
          for i,s in enumerate(shots):
              f=min(s['a']+10,max(s['a']+1,s['b']-1))
              frames.append(f)
              manifest.append({
                  'i':i,'frame':f,'t':round(f/25,3),'scene':s.get('scene',''),
                  'kind':s.get('kind',''),'variant':s.get('variant',''),
                  'section':s.get('section',''),
                  'start':round(s['a']/25,3),'end':round(s['b']/25,3)
              })
          expr='+'.join(f'eq(n\\,{f})' for f in frames)
          cmd=['ffmpeg','-y','-loglevel','error','-i','/tmp/vqc/chicago.mp4',
               '-vf',f"select='{expr}'",'-vsync','0','-q:v','2','/tmp/vqc/shots/shot_%03d.jpg']
          subprocess.run(cmd,check=True)
          Path('/tmp/vqc/out/SHOT_MANIFEST.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY

      - name: Extract regular and opening samples
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i /tmp/vqc/chicago.mp4 -vf "fps=1/10,scale=960:540" -q:v 2 /tmp/vqc/regular/r_%03d.jpg
          ffmpeg -y -loglevel error -t 120 -i /tmp/vqc/chicago.mp4 -vf "fps=1/2,scale=960:540" -q:v 2 /tmp/vqc/opening/o_%03d.jpg
          for t in 1266.0 1267.5 1268.1 1269.0 1275.0 1285.0 1290.0; do
            ffmpeg -y -loglevel error -ss "$t" -i /tmp/vqc/chicago.mp4 -frames:v 1 -q:v 2 "/tmp/vqc/out/outro_${t}.jpg"
          done

      - name: Build contact sheets and duplicate/pacing audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont,ImageChops
          from pathlib import Path
          import json,statistics,math

          base=Path('/tmp/vqc'); out=base/'out'
          man=json.loads((out/'SHOT_MANIFEST.json').read_text())
          shotfiles=sorted((base/'shots').glob('shot_*.jpg'))
          assert len(shotfiles)==len(man),(len(shotfiles),len(man))
          font=ImageFont.load_default()

          def dhash(im,hash_size=12):
              im=im.convert('L').resize((hash_size+1,hash_size))
              px=list(im.getdata()); bits=0
              for y in range(hash_size):
                  for x in range(hash_size):
                      bits=(bits<<1)|(px[y*(hash_size+1)+x] > px[y*(hash_size+1)+x+1])
              return bits
          def ham(a,b): return (a^b).bit_count()

          hashes=[dhash(Image.open(p)) for p in shotfiles]
          near=[]
          for i in range(len(hashes)-1):
              d=ham(hashes[i],hashes[i+1])
              if d<=10:
                  near.append({'a':i,'b':i+1,'distance':d,
                               'a_scene':man[i]['scene'],'b_scene':man[i+1]['scene'],
                               'a_kind':man[i]['kind'],'b_kind':man[i+1]['kind']})
          (out/'NEAR_DUPLICATE_CONSECUTIVE.json').write_text(json.dumps(near,indent=2),encoding='utf-8')

          durations=[m['end']-m['start'] for m in man]
          pacing={
            'count':len(man),'min':round(min(durations),3),'median':round(statistics.median(durations),3),
            'mean':round(statistics.mean(durations),3),'max':round(max(durations),3),
            'ge_8s':[m for m,d in zip(man,durations) if d>=8],
            'ge_12s':[m for m,d in zip(man,durations) if d>=12],
            'lt_1_2s':[m for m,d in zip(man,durations) if d<1.2],
            'near_duplicate_consecutive_count':len(near)
          }
          (out/'PACING_AUDIT.json').write_text(json.dumps(pacing,indent=2),encoding='utf-8')

          def draw_sheet(files, labels, prefix, cols=4, rows=4, thumb=(640,360)):
              per=cols*rows
              for pg in range(math.ceil(len(files)/per)):
                  batch=files[pg*per:(pg+1)*per]
                  cw,ch=thumb[0],thumb[1]+36
                  can=Image.new('RGB',(cw*cols,ch*rows),(20,20,20)); d=ImageDraw.Draw(can)
                  for j,p in enumerate(batch):
                      im=Image.open(p).convert('RGB')
                      im.thumbnail(thumb)
                      x=(j%cols)*cw; y=(j//cols)*ch
                      can.paste(im,(x,y))
                      d.rectangle((x,y+thumb[1],x+cw,y+ch),fill=(8,8,8))
                      d.text((x+5,y+thumb[1]+5),labels[pg*per+j],fill=(245,245,245),font=font)
                  can.save(out/f'{prefix}_{pg+1:02d}.jpg',quality=90)

          labels=[f"{m['i']:03d} {m['t']:7.2f}s {m['scene']} {m['kind']} | {m['section'][:34]}" for m in man]
          draw_sheet(shotfiles,labels,'SHOT_SHEET',4,4,(640,360))

          # provenance crop sheets from full-resolution shot samples
          prov_files=[]; prov_labels=[]
          for i,(p,m) in enumerate(zip(shotfiles,man)):
              if m['kind'] not in {'archive','map','reconstruction','document','concept'}: continue
              im=Image.open(p).convert('RGB')
              crop=im.crop((1250,0,1920,180)).resize((1340,360))
              cp=base/'shots'/f'prov_{i:03d}.jpg'
              crop.save(cp,quality=94)
              prov_files.append(cp); prov_labels.append(f"{i:03d} {m['t']:7.2f}s {m['scene']} {m['kind']}")
          draw_sheet(prov_files,prov_labels,'PROV_SHEET',2,4,(1340,360))

          regs=sorted((base/'regular').glob('r_*.jpg'))
          rlabels=[f'{i*10:04d}s' for i in range(len(regs))]
          draw_sheet(regs,rlabels,'REGULAR_SHEET',4,4,(640,360))

          op=sorted((base/'opening').glob('o_*.jpg'))
          olabels=[f'{i*2:04d}s' for i in range(len(op))]
          draw_sheet(op,olabels,'OPENING_2SEC_SHEET',4,4,(640,360))
          PY

      - name: Package
        run: |
          set -euo pipefail
          cd /tmp/vqc
          zip -q -r CHICAGO_R13_VISUAL_QC.zip out
          ls -lh CHICAGO_R13_VISUAL_QC.zip

      - name: Upload visual QC
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r13-visual-qc-fast
          path: /tmp/vqc/CHICAGO_R13_VISUAL_QC.zip
          compression-level: 0
          retention-days: 3
