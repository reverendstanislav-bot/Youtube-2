name: Build Chicago V9 First Episode End Screen Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v9_first_episode_end_screen_review.yml'
      - 'CHICAGO/V9/**'
      - 'CHICAGO/BRANDING/reference/06_end_screen_background.png'

permissions:
  contents: write

jobs:
  build-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil python3-opencv jq zip fonts-dejavu-core

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v9
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v9/remotion/src /tmp/chicago_v9/remotion/public /tmp/chicago_v9/work /tmp/chicago_v9/qc
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 work assets and canonical timing/audio
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_extract             "-ir!*/_V2/work/assets/*"             "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -d "$ASSETS"; test -s "$V2"; test -s "$SRT"; test -s "$WORDS"

          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"

      - name: Prepare canonical first-episode end screen
        run: |
          set -euo pipefail
          test -s CHICAGO/BRANDING/reference/06_end_screen_background.png

          python3 CHICAGO/V9/cleanup_first_episode_end_screen.py             --input CHICAGO/BRANDING/reference/06_end_screen_background.png             --output /tmp/chicago_v9/remotion/public/end_screen_first_episode.png             | tee /tmp/chicago_v9/qc/END_SCREEN_CLEANUP_QC.txt

          grep -q 'subscribe_circle_region_bit_identical=True' /tmp/chicago_v9/qc/END_SCREEN_CLEANUP_QC.txt

          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('/tmp/chicago_v9/qc/END_SCREEN_CLEANUP_QC.txt').read_text()
          b=float(re.search(r'before=([0-9.]+)',t).group(1))
          a=float(re.search(r'after=([0-9.]+)',t).group(1))
          print('border_edge_reduction_ratio=', a/b if b else 0)
          assert a < b*0.85, (b,a)
          PY

      - name: Validate V9 source rules
        run: |
          set -euo pipefail
          ! grep -q 'CONTINUE EXPLORING' CHICAGO/V9/src/index.jsx
          ! grep -q 'WATCH NEXT' CHICAGO/V9/src/index.jsx
          grep -q 'SUBSCRIBE' CHICAGO/V9/src/index.jsx
          grep -q 'end_screen_first_episode.png' CHICAGO/V9/src/index.jsx
          ! grep -q 'AI RECONSTRUCTION' CHICAGO/V9/prepare_remotion_data.py
          echo "V9 source rules PASS"

      - name: Preflight V9 Remotion bundle
        run: |
          set -euo pipefail
          cp CHICAGO/V9/src/index.jsx /tmp/chicago_v9/remotion/src/index.jsx
          cp CHICAGO/V9/package.json /tmp/chicago_v9/remotion/package.json

          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=960x540:r=25 -t 1             -c:v libx264 -pix_fmt yuv420p /tmp/chicago_v9/remotion/public/base.mp4
          echo '[]' > /tmp/chicago_v9/remotion/public/captions.json
          echo '{"cards":[],"provenance":[]}' > /tmp/chicago_v9/remotion/public/overlays.json

          cd /tmp/chicago_v9/remotion
          npm install --no-audit --no-fund
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/BUNDLE_PREFLIGHT.png --frame=0

      - name: Build clean V9 picture track
        run: |
          set -euo pipefail
          python3 CHICAGO/V4/build_v4_picture.py             --v3-builder CHICAGO/V3/build_v3_picture.py             --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json             --assets-root "$ASSETS"             --work /tmp/chicago_v9/work/picture             --output-video /tmp/chicago_v9/remotion/public/base.mp4             --plan-out /tmp/chicago_v9/work/V9_SHOTS.json

      - name: Prepare V9 editorial data
        run: |
          set -euo pipefail
          python3 CHICAGO/V9/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan /tmp/chicago_v9/work/V9_SHOTS.json             --captions-out /tmp/chicago_v9/remotion/public/captions.json             --overlays-out /tmp/chicago_v9/remotion/public/overlays.json             --report /tmp/chicago_v9/qc/REMOTION_DATA_REPORT.json

          ! grep -q 'AI RECONSTRUCTION' /tmp/chicago_v9/remotion/public/overlays.json

      - name: Extract original AAC
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/chicago_v9/work/original.aac
          AH="$(sha256sum /tmp/chicago_v9/work/original.aac | awk '{print $1}')"
          test "$AH" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$AH  original.aac" > /tmp/chicago_v9/qc/AUDIO_SHA256.txt

      - name: Render V9 end-screen preflight stills
        working-directory: /tmp/chicago_v9/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v9/qc/stills
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/stills/end_01_start.png --frame=31830
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/stills/end_02_brand.png --frame=31860
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/stills/end_03_subscribe.png --frame=31930
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/stills/end_04_caption.png --frame=32020
          npx remotion still src/index.jsx ChicagoV9 /tmp/chicago_v9/qc/stills/end_05_final.png --frame=32240

      - name: Render full V9 through Remotion
        working-directory: /tmp/chicago_v9/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.jsx ChicagoV9 out/raw_video.mp4             --codec=h264 --crf=19 --pixel-format=yuv420p --concurrency=4

      - name: Mux original AAC
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_v9/HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4

          ffmpeg -y -hide_banner -loglevel error             -i /tmp/chicago_v9/remotion/out/raw_video.mp4             -i /tmp/chicago_v9/work/original.aac             -map 0:v:0 -map 1:a:0             -c:v copy -c:a copy             -movflags +faststart             "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Technical QC
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format -of json "$OUT" > /tmp/chicago_v9/qc/FFPROBE.json
          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> /tmp/chicago_v9/qc/DECODE_ERRORS.txt
          test ! -s /tmp/chicago_v9/qc/DECODE_ERRORS.txt

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.20, d
          PY

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts /tmp/chicago_v9/qc/review.aac
          RH="$(sha256sum /tmp/chicago_v9/qc/review.aac | awk '{print $1}')"
          EXPECTED="a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          {
            echo "$EXPECTED  expected_original.aac"
            echo "$RH  review.aac"
          } | tee /tmp/chicago_v9/qc/REVIEW_AUDIO_SHA256.txt
          test "$RH" = "$EXPECTED"

          sha256sum "$OUT" > /tmp/chicago_v9/qc/VIDEO_SHA256.txt

      - name: Sequence QC
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/audit_v2_sequence.py             --shots /tmp/chicago_v9/work/V9_SHOTS.json             --out-json /tmp/chicago_v9/qc/V9_SEQUENCE_AUDIT.json             --out-md /tmp/chicago_v9/qc/V9_SEQUENCE_AUDIT.md

      - name: Build V9 QC summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/chicago_v9/qc')
          seq=json.loads((q/'V9_SEQUENCE_AUDIT.json').read_text())
          data=json.loads((q/'REMOTION_DATA_REPORT.json').read_text())
          lines=[
            '# Chicago V9 First-Episode End Screen review QC','',
            '- V8/V7 content before 21:12.72: unchanged.',
            '- End screen source: canonical HIA 06 End Screen.',
            '- Recommendation/video rectangle: REMOVED for Episode 1.',
            '- Subscribe/avatar circle: PRESERVED from canonical asset.',
            '- Subscribe circle region remained bit-identical during deterministic cleanup.',
            '- WATCH NEXT / CONTINUE EXPLORING: absent.',
            '- SUBSCRIBE + HIDDEN INDUSTRIAL AMERICA label: present near circle.',
            '- Actual clickable Subscribe element should be placed over the circle in YouTube Studio.',
            '- Final captions: compact left-bottom zone, clear of subscribe circle.',
            '- No new generated assets.',
            '- AI RECONSTRUCTION label: absent.',
            '- HISTORICAL SOURCE remains the provenance label before outro.',
            '- Original AAC preserved bit-for-bit.',
            '- Full decode: PASS.',
            f"- Caption cues: {data['caption_cues']}.",
            f"- Caption token match: {data['token_match_ratio']:.3%}.",
            f"- Sequence shots: {seq['shot_count']}.",
          ]
          (q/'V9_QC_SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Package QC
        run: |
          set -euo pipefail
          cp /tmp/chicago_v9/work/V9_SHOTS.json /tmp/chicago_v9/qc/
          cp /tmp/chicago_v9/remotion/public/end_screen_first_episode.png /tmp/chicago_v9/qc/
          cp CHICAGO/V9/src/index.jsx /tmp/chicago_v9/qc/
          cp CHICAGO/V9/cleanup_first_episode_end_screen.py /tmp/chicago_v9/qc/
          cd /tmp/chicago_v9
          zip -q -r HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_QC.zip qc
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt

      - name: Publish V9 review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-v9-first-episode-end-screen-review-20260921
          BODY='Review only. V9 applies the canonical HIA 06 End Screen as a first-episode variant: recommendation rectangle removed, Subscribe/avatar circle preserved, no WATCH NEXT block, captions moved clear of the Subscribe area. No generated assets. Original AAC preserved bit-for-bit.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG"               "$OUT"               /tmp/chicago_v9/HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_QC.zip               /tmp/chicago_v9/SHA256SUMS.txt               --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG"               "$OUT"               /tmp/chicago_v9/HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_QC.zip               /tmp/chicago_v9/SHA256SUMS.txt               --title 'Chicago V9 First Episode End Screen Review 960x540'               --notes "$BODY"               --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record V9 review in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V9/REVIEW_QC
          cp /tmp/chicago_v9/qc/V9_QC_SUMMARY.md CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/V9_SEQUENCE_AUDIT.md CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/REMOTION_DATA_REPORT.json CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/END_SCREEN_CLEANUP_QC.txt CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/VIDEO_SHA256.txt CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/AUDIO_SHA256.txt CHICAGO/V9/REVIEW_QC/
          cp /tmp/chicago_v9/qc/REVIEW_AUDIO_SHA256.txt CHICAGO/V9/REVIEW_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V9/REVIEW_QC
          git commit -m "Record Chicago V9 first-episode end-screen review QC"
          git push

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v9-first-episode-end-screen-review
          path: |
            /tmp/chicago_v9/HIA_CHICAGO_V9_FIRST_EPISODE_END_SCREEN_REVIEW_960x540.mp4
            /tmp/chicago_v9/qc
          retention-days: 14
