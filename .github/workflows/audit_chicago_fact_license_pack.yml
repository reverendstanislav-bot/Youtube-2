name: Audit Chicago Fact License Music SFX Pack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_chicago_fact_license_pack.yml'
      - 'CHICAGO/tools/audit_fact_license_pack.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_fact_audit
          mkdir -p /tmp/chicago_fact_audit/src /tmp/chicago_fact_audit/extracted /tmp/chicago_fact_audit/out
          cd /tmp/chicago_fact_audit/src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract fact / license / music / SFX metadata
        run: |
          set -euo pipefail
          cd /tmp/chicago_fact_audit/src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_fact_audit/extracted             "-ir!*/06_LICENSES_FACTS/fact_map.csv"             "-ir!*/06_LICENSES_FACTS/license_manifest.csv"             "-ir!*/06_LICENSES_FACTS/music_attribution.txt"             "-ir!*/04_DOWNLOADS/music_downloads.csv"             "-ir!*/04_DOWNLOADS/sfx_downloads.csv"

          ROOT="$(find /tmp/chicago_fact_audit/extracted -type f -path '*/06_LICENSES_FACTS/fact_map.csv' -printf '%h/..\n' | head -n1)"
          ROOT="$(readlink -f "$ROOT")"
          echo "SRCROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Run fact / license audit
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/audit_fact_license_pack.py             --fact-map "$SRCROOT/06_LICENSES_FACTS/fact_map.csv"             --license-manifest "$SRCROOT/06_LICENSES_FACTS/license_manifest.csv"             --music-downloads "$SRCROOT/04_DOWNLOADS/music_downloads.csv"             --sfx-downloads "$SRCROOT/04_DOWNLOADS/sfx_downloads.csv"             --music-attribution "$SRCROOT/06_LICENSES_FACTS/music_attribution.txt"             --out-json /tmp/chicago_fact_audit/out/FACT_LICENSE_AUDIT.json             --out-md /tmp/chicago_fact_audit/out/FACT_LICENSE_AUDIT.md

      - name: Show audit details
        run: |
          cat /tmp/chicago_fact_audit/out/FACT_LICENSE_AUDIT.md
          cat /tmp/chicago_fact_audit/out/FACT_LICENSE_AUDIT.json

      - name: Record audit in Git
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p CHICAGO/V9/EXHAUSTIVE_QC/FACT_LICENSE
          cp /tmp/chicago_fact_audit/out/* CHICAGO/V9/EXHAUSTIVE_QC/FACT_LICENSE/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V9/EXHAUSTIVE_QC/FACT_LICENSE
          git commit -m "Record Chicago fact license music SFX audit"
          git push
