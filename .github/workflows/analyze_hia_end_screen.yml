name: Analyze Canonical HIA End Screen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze_hia_end_screen.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vision tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-opencv tesseract-ocr

      - name: Analyze original 06 end screen
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import cv2, json, subprocess
          from pathlib import Path

          p=Path('CHICAGO/BRANDING/reference/06_end_screen_background.png')
          im=cv2.imread(str(p))
          assert im is not None
          h,w=im.shape[:2]
          gray=cv2.cvtColor(im,cv2.COLOR_BGR2GRAY)
          edges=cv2.Canny(gray,60,150)

          # Circle candidates.
          circles=cv2.HoughCircles(
              gray,cv2.HOUGH_GRADIENT,dp=1.2,minDist=60,
              param1=120,param2=45,minRadius=25,maxRadius=300
          )
          circle_rows=[]
          if circles is not None:
              for c in circles[0]:
                  x,y,r=map(float,c)
                  circle_rows.append({'x':round(x,1),'y':round(y,1),'r':round(r,1)})

          # Large near-rectangular contour candidates.
          contours,_=cv2.findContours(edges,cv2.RETR_LIST,cv2.CHAIN_APPROX_SIMPLE)
          rects=[]
          for cnt in contours:
              peri=cv2.arcLength(cnt,True)
              approx=cv2.approxPolyDP(cnt,0.02*peri,True)
              if len(approx)==4:
                  x,y,rw,rh=cv2.boundingRect(approx)
                  area=rw*rh
                  if area > 0.015*w*h and rw>120 and rh>80:
                      rects.append({'x':x,'y':y,'w':rw,'h':rh,'area':area})
          rects=sorted(rects,key=lambda z:z['area'],reverse=True)[:20]

          # OCR.
          ocr=subprocess.check_output(
              ['tesseract',str(p),'stdout','--psm','11'],
              text=True,stderr=subprocess.DEVNULL
          ).strip()

          report={
              'file':str(p),
              'size':[w,h],
              'circle_candidates':circle_rows[:20],
              'large_rectangle_candidates':rects,
              'ocr_text':ocr,
          }
          out=Path('CHICAGO/BRANDING/reference/06_end_screen_analysis.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit analysis
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/BRANDING/reference/06_end_screen_analysis.json
          git commit -m "Analyze canonical HIA end-screen geometry and text"
          git push
