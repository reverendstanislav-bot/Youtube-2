name: Ingest Chicago V9 Exhaustive QC Details

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ingest_chicago_v9_exhaustive_qc.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download exhaustive QC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/qc_ingest
          mkdir -p /tmp/qc_ingest
          cd /tmp/qc_ingest
          gh release download chicago-v9-exhaustive-qc-20260921             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip'
          unzip -q HIA_CHICAGO_V9_EXHAUSTIVE_PREPUBLICATION_QC.zip
          test -s exhaustive/EXHAUSTIVE_QC.json
          test -s exhaustive/EXHAUSTIVE_QC.md

      - name: Print key review flags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/qc_ingest/exhaustive/EXHAUSTIVE_QC.json').read_text())
          print('=== AUTOMATIC GATE ===')
          print(json.dumps(d['automatic_gate'],indent=2))
          print('=== BLUR ANOMALIES ===')
          print(json.dumps(d['frame']['one_frame_blur_anomalies'],indent=2))
          print('=== UNKNOWN SCENE IDS ===')
          print(json.dumps(d['script']['shots']['missing_scene_ids'],indent=2))
          print('=== LOW SEMANTIC REFERENCE CHECKS ===')
          print(json.dumps(d['script']['semantic_reference_checks']['low_similarity_under_0_25'][:100],indent=2))
          print('=== FREEZE SEGMENTS ===')
          print(json.dumps(d['frame']['freeze_segments_ge_3s'][:100],indent=2))
          print('=== AUDIO SILENCE RUNS ===')
          print(json.dumps(d['audio']['silence_runs_ge_0_5s_below_-60dbfs'],indent=2))
          print('=== AUDIO CLICK CANDIDATES ===')
          print(json.dumps(d['audio']['click_candidate_times_first_200'][:100],indent=2))
          print('=== PTS / PACKETS ===')
          print(json.dumps({
            'pts_interval_errors':d['technical']['pts_interval_error_count'],
            'packet_timing':d['technical']['packet_timing']
          },indent=2))
          PY

      - name: Build compact detailed review report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/qc_ingest')
          d=json.loads((root/'exhaustive/EXHAUSTIVE_QC.json').read_text())
          lic=json.loads((root/'exhaustive/FACT_LICENSE_AUDIT.json').read_text())

          def fmt(t):
              m=int(t//60); s=t-m*60
              return f'{m:02d}:{s:06.3f}'

          blur=d['frame']['one_frame_blur_anomalies']
          miss=d['script']['shots']['missing_scene_ids']
          low=d['script']['semantic_reference_checks']['low_similarity_under_0_25']
          frz=d['frame']['freeze_segments_ge_3s']
          clicks=d['audio']['click_candidate_times_first_200']

          lines=[
            '# Chicago V9 exhaustive QC — detailed flags','',
            '## Automatic gate',
            f"**{d['automatic_gate']['verdict']}**",''
          ]
          for x in d['automatic_gate']['issues']:
              lines.append(f'- {x}')
          lines+=['','## One-frame blur-collapse candidates']
          if not blur: lines.append('- None.')
          for x in blur:
              lines.append(f"- {fmt(x['time'])} / frame {x['frame']}: blur={x['blur']:.3f}, neighbor mean={x['neighbor_mean']:.3f}")
          lines+=['','## Shot-plan IDs not present in canonical scene_map']
          if not miss: lines.append('- None.')
          for x in miss:
              lines.append(f"- shot {x['index']}: {x['scene']}")
          lines+=['','## Semantic-reference candidates <0.25']
          lines.append(f'- Count: **{len(low)}**')
          for x in low[:80]:
              lines.append(f"- {fmt(x['time'])}: shot {x['shot']} / {x['scene']} / active {x['active_scene']} / similarity {x['text_similarity']:.3f} / {x['source']}")
          lines+=['','## Audio']
          lines.append(f"- Loudness: {d['loudness'].get('input_i')} LUFS")
          lines.append(f"- True peak: {d['loudness'].get('input_tp')} dBTP")
          lines.append(f"- Clipped samples >=0.9999: {d['audio']['samples_ge_0_9999']}")
          lines.append(f"- Silence runs >=0.5 s below -60 dBFS: {len(d['audio']['silence_runs_ge_0_5s_below_-60dbfs'])}")
          lines.append(f"- Adjacent-sample click candidates logged: {len(clicks)}")
          lines+=['','## Facts / licenses']
          lines.append(f"- Facts: {lic['fact_rows']}; nonlocked: {lic['nonlocked_fact_rows']}")
          lines.append(f"- License rows: {lic['license_rows']}; missing source/license: {lic['license_rows_missing_source_or_license']}")
          lines.append(f"- Referenced archive IDs missing from manifest: {lic['referenced_archive_ids_missing_from_license_manifest']}")
          lines+=['','## Frame / transition integrity']
          lines.append(f"- Black frames: {len(d['frame']['black_frames'])}")
          lines.append(f"- White blank frames: {len(d['frame']['white_frames'])}")
          lines.append(f"- Single-frame flashes: {len(d['frame']['single_frame_flash_candidates'])}")
          lines.append(f"- Unexpected hard discontinuities: {len(d['frame']['unexpected_hard_discontinuities'])}")
          lines.append(f"- Freeze segments >=3 s: {len(frz)}")
          lines.append(f"- PTS interval errors: {d['technical']['pts_interval_error_count']}")
          lines+=['','## Script integrity']
          ta=d['script']['token_alignment']
          lines.append(f"- Script ↔ SRT: {ta['script_vs_srt_ratio']:.4%}")
          lines.append(f"- Script ↔ word transcript: {ta['script_vs_voice_ratio']:.4%}")
          lines.append(f"- Script ↔ scene-map narration: {ta['script_vs_scene_map_ratio']:.4%}")
          lines.append(f"- SRT ↔ word transcript: {ta['srt_vs_voice_ratio']:.4%}")

          (root/'DETAILED_FLAGS.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Commit compact QC safely
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V9/EXHAUSTIVE_QC
          cp /tmp/qc_ingest/exhaustive/EXHAUSTIVE_QC.md CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/qc_ingest/exhaustive/AUTOMATIC_GATE.json CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/qc_ingest/exhaustive/FACT_LICENSE_AUDIT.json CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/qc_ingest/exhaustive/AUDIO_BITSTREAM_SHA256.txt CHICAGO/V9/EXHAUSTIVE_QC/
          cp /tmp/qc_ingest/DETAILED_FLAGS.md CHICAGO/V9/EXHAUSTIVE_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V9/EXHAUSTIVE_QC
          if ! git diff --cached --quiet; then
            git commit -m "Record Chicago V9 exhaustive QC details"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload full QC as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v9-exhaustive-qc-full
          path: |
            /tmp/qc_ingest/exhaustive
            /tmp/qc_ingest/current
            /tmp/qc_ingest/DETAILED_FLAGS.md
          retention-days: 14
