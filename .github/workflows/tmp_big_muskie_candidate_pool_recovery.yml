name: Temporary Big Muskie candidate pool recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_big_muskie_candidate_pool_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover historical CDN PNG pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/png
          git log --all -p -- BIG_MUSKIE .github/workflows 2>/dev/null |             grep -oE 'https://(d8j0ntlcm91z4|d2ol7oe51mr4n9)\.cloudfront\.net/[^ )"'"'"'<>]+' |             sed 's/[),.;]*$//' | sort -u | grep -Ei '\.png$' > out/urls.txt || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          urls=[x.strip() for x in Path('out/urls.txt').read_text().splitlines() if x.strip()]
          rows=[]
          for i,u in enumerate(urls,1):
              ext='.png'
              name=f'{i:03d}_{hashlib.sha1(u.encode()).hexdigest()[:12]}{ext}'
              dst=Path('out/png')/name
              p=subprocess.run(['curl','-fL','--retry','3','--retry-delay','2','-o',str(dst),u])
              if p.returncode==0 and dst.exists() and dst.stat().st_size>1000:
                  rows.append((name,u,dst.stat().st_size))
              else:
                  dst.unlink(missing_ok=True)
          with Path('out/URL_MAP.tsv').open('w') as f:
              f.write('file\turl\tbytes\n')
              for row in rows:
                  f.write('\t'.join(map(str,row))+'\n')
          print('requested',len(urls),'downloaded',len(rows))
          PY
          file out/png/* | head -20 || true
          sha256sum out/png/* > out/SHA256SUMS.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: BIG_MUSKIE_HISTORICAL_CDN_PNG_POOL
          path: out/
          retention-days: 7
          compression-level: 0
