name: Build TC497 FULL V7 Fast Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v7_fast.yml'
      - 'TC497/FULL_V7/v7_fast_render.py'

permissions:
  contents: read
  actions: read

jobs:
  build-v7-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download FULL V6 review
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v6-review
          path: /tmp/v6
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425090519
          github-token: ${{ github.token }}

      - name: Download FULL V4 report
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/v7 /tmp/report/screens TC497/FULL_V7_FAST_OUT
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/overlay_v4.ass
          test -s /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4
          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_48dcb295-57ea-4d53-901d-7ce9c3492c42.png'             -o /tmp/v7/V4_EMPTY_END.png
          python3 TC497/FULL_V7/generate_outro_music.py --output /tmp/v7/outro_resolve_original.wav

      - name: Render tail-only V7
        run: |
          set -euo pipefail
          python3 TC497/FULL_V7/v7_fast_render.py             --input /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4             --clean-end /tmp/v7/V4_EMPTY_END.png             --source-ass /tmp/v4report/overlay_v4.ass             --music /tmp/v7/outro_resolve_original.wav             --work-dir /tmp/v7/work             --output TC497/FULL_V7_FAST_OUT/TC497_FULL_V7_REVIEW_960x540.mp4

      - name: QC package
        run: |
          set -euo pipefail
          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,duration:format=duration,size,bit_rate             -of json TC497/FULL_V7_FAST_OUT/TC497_FULL_V7_REVIEW_960x540.mp4             > /tmp/report/FFPROBE.json
          ffmpeg -hide_banner -nostats             -i TC497/FULL_V7_FAST_OUT/TC497_FULL_V7_REVIEW_960x540.mp4             -af ebur128=peak=true -f null - > /dev/null 2> /tmp/report/EBUR128.txt
          for t in 1185 1215 1222 1223 1225 1228 1232 1235; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V7_FAST_OUT/TC497_FULL_V7_REVIEW_960x540.mp4               -frames:v 1 "/tmp/report/screens/frame_${t}.jpg"
          done
          cp /tmp/v7/work/v7_tail.ass /tmp/report/
          cp TC497/FULL_V7/VIEWER_AUDIT.md /tmp/report/
          cp TC497/FULL_V7/v7_fast_render.py /tmp/report/
          cp TC497/FULL_V7/generate_outro_music.py /tmp/report/
          cat > /tmp/report/V7_BUILD_NOTES.md <<'EOF'
          FULL_V7 is a review build only and is not user-approved.
          Only the tail from 19:45 onward is re-rendered; the prior V6 picture is stream-copied.
          The final centered slogan is removed and replaced with a clean desert plate plus restrained left-aligned branding.
          Final narration captions are preserved.
          A new original procedural resolving music cue begins at 19:45 and ducks under narration.
          No 1080p build is promoted by this workflow.
          EOF
          (cd /tmp/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V7_FAST_OUT/FULL_V7_REPORT.zip" .)
          (cd TC497/FULL_V7_FAST_OUT && sha256sum TC497_FULL_V7_REVIEW_960x540.mp4 FULL_V7_REPORT.zip > SHA256SUMS.txt)

      - name: Upload FULL V7 review
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v7-review-fast
          path: |
            TC497/FULL_V7_FAST_OUT/TC497_FULL_V7_REVIEW_960x540.mp4
            TC497/FULL_V7_FAST_OUT/FULL_V7_REPORT.zip
            TC497/FULL_V7_FAST_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
