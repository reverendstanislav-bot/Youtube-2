name: Build Chicago V2 Visible Captions Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v2_visible_captions_review.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg fonts-dejavu-core

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_src
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 master, V2 SRT and word timings
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v2 /tmp/chicago_build
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_v2 \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.srt" \
            "-ir!*/_QC/voice_words.json"

          V2="$(find /tmp/chicago_v2 -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_v2 -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_v2 -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -s "$V2"; test -s "$SRT"; test -s "$WORDS"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"

      - name: Generate white-base orange-active running ASS
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/make_v2_running_ass.py \
            --srt "$SRT" \
            --words "$WORDS" \
            --output /tmp/chicago_build/HIA_CHICAGO_V2_RUNNING.ass \
            | tee /tmp/chicago_build/ASS_BUILD_REPORT.txt
          grep -q 'Style: Run,DejaVu Sans,29,&H00FFFFFF&,&H003A8AF2&' /tmp/chicago_build/HIA_CHICAGO_V2_RUNNING.ass

      - name: Render 960x540 review with copied audio
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_build/HIA_CHICAGO_V2_VISIBLE_CAPTIONS_REVIEW_960x540.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -i "$V2" \
            -vf "scale=960:540:flags=lanczos,ass=/tmp/chicago_build/HIA_CHICAGO_V2_RUNNING.ass:fontsdir=/usr/share/fonts/truetype/dejavu" \
            -map 0:v:0 -map 0:a:0 \
            -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart \
            "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: QC review build
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_build/qc

          ffprobe -v error -show_streams -show_format -of json "$OUT" > /tmp/chicago_build/qc/FFPROBE.json

          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - \
            2> /tmp/chicago_build/qc/DECODE_ERRORS.txt
          test ! -s /tmp/chicago_build/qc/DECODE_ERRORS.txt

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.15, d
          PY

          ffmpeg -y -v error -i "$OUT" -map 0:a:0 -c copy -f adts /tmp/chicago_build/qc/review_audio.aac
          REV_AUDIO="$(sha256sum /tmp/chicago_build/qc/review_audio.aac | awk '{print $1}')"
          test "$REV_AUDIO" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$REV_AUDIO  review_audio.aac" > /tmp/chicago_build/qc/AUDIO_SHA256.txt

          sha256sum "$OUT" > /tmp/chicago_build/qc/VIDEO_SHA256.txt

          for t in 5 322 645 969 1282; do
            ffmpeg -y -loglevel error -ss "$t" -i "$OUT" -frames:v 1 "/tmp/chicago_build/qc/frame_${t}s.jpg"
          done

      - name: Package QC
        run: |
          set -euo pipefail
          cp /tmp/chicago_build/HIA_CHICAGO_V2_RUNNING.ass /tmp/chicago_build/qc/
          cp /tmp/chicago_build/ASS_BUILD_REPORT.txt /tmp/chicago_build/qc/
          cd /tmp/chicago_build
          zip -r HIA_CHICAGO_V2_VISIBLE_CAPTIONS_REVIEW_QC.zip qc >/dev/null
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt

      - name: Publish review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-v2-visible-captions-review-20260920
          TITLE='Chicago V2 Visible Captions Review 960x540'
          BODY='Review build only. V2 picture, V1/V2 bit-identical AAC copied without re-encode. One subtitle layer: white base with orange active spoken word. Not a publication master until user approval.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUT" \
              /tmp/chicago_build/HIA_CHICAGO_V2_VISIBLE_CAPTIONS_REVIEW_QC.zip \
              /tmp/chicago_build/SHA256SUMS.txt \
              --clobber \
              --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG" \
              "$OUT" \
              /tmp/chicago_build/HIA_CHICAGO_V2_VISIBLE_CAPTIONS_REVIEW_QC.zip \
              /tmp/chicago_build/SHA256SUMS.txt \
              --title "$TITLE" \
              --notes "$BODY" \
              --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record review build
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V2_VISIBLE_CAPTIONS
          cp /tmp/chicago_build/qc/VIDEO_SHA256.txt CHICAGO/V2_VISIBLE_CAPTIONS/REVIEW_SHA256.txt
          cp /tmp/chicago_build/qc/AUDIO_SHA256.txt CHICAGO/V2_VISIBLE_CAPTIONS/AUDIO_SHA256.txt
          cp /tmp/chicago_build/ASS_BUILD_REPORT.txt CHICAGO/V2_VISIBLE_CAPTIONS/ASS_BUILD_REPORT.txt
          cat > CHICAGO/V2_VISIBLE_CAPTIONS/README.md <<'EOF'
          # Chicago V2 visible captions review

          Review tag: `chicago-v2-visible-captions-review-20260920`

          This build keeps the V2 picture composition and copies the original AAC bitstream without re-encoding.
          The only editorial addition is one running subtitle layer:
          - white base text;
          - orange active spoken word;
          - no black plaque;
          - no duplicate subtitle layer.

          Resolution of this review is 960x540 for fast user inspection.
          Do not promote to publication master until explicit user approval.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V2_VISIBLE_CAPTIONS
          git commit -m "Record Chicago V2 visible captions review build"
          git push
