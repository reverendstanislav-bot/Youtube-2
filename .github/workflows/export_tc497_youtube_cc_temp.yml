name: Export TC497 YouTube CC Temp
on:
  push:
    paths:
      - '.github/workflows/export_tc497_youtube_cc_temp.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TRANSCRIPT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical TC497 transcript
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc497_cc
          curl -fL --retry 4 --retry-all-errors "$TRANSCRIPT_URL" -o /tmp/tc497_cc/transcript.zip
          unzip -q /tmp/tc497_cc/transcript.zip -d /tmp/tc497_cc/transcript
          WORD="$(find /tmp/tc497_cc/transcript -type f -name 'TC497_VO_WORD_LEVEL.csv' | head -n1)"
          test -s "$WORD"
          echo "WORD_CSV=$WORD" >> "$GITHUB_ENV"

      - name: Build positioned WebVTT
        run: |
          python3 - <<'PY'
          import csv, os, re
          from pathlib import Path

          src=Path(os.environ["WORD_CSV"])
          words=[]
          with src.open(encoding="utf-8-sig", newline="") as f:
              for r in csv.DictReader(f):
                  s=float(r["start_sec"]); e=float(r["end_sec"]); w=r["word"].strip()
                  if not w:
                      continue
                  if s >= 1222.3:
                      break
                  words.append({"s":max(0.0,s),"e":min(1222.3,e),"w":w})

          cues=[]
          buf=[]
          for w in words:
              buf.append(w)
              span=buf[-1]["e"]-buf[0]["s"]
              chars=sum(len(x["w"])+1 for x in buf)
              punct=buf[-1]["w"].rstrip().endswith((".", "!", "?", ";", ":"))
              comma=buf[-1]["w"].rstrip().endswith(",")
              if len(buf)>=7 or chars>=48 or span>=2.45 or (punct and len(buf)>=3) or (comma and len(buf)>=5):
                  cues.append((buf[0]["s"], min(1222.3,buf[-1]["e"]+0.08), " ".join(x["w"] for x in buf)))
                  buf=[]
          if buf:
              cues.append((buf[0]["s"], min(1222.3,buf[-1]["e"]+0.08), " ".join(x["w"] for x in buf)))

          def ts(sec):
              ms=round(sec*1000)
              h=ms//3600000; ms%=3600000
              m=ms//60000; ms%=60000
              s=ms//1000; ms%=1000
              return f"{h:02d}:{m:02d}:{s:02d}.{ms:03d}"

          def wrap(text, limit=42):
              toks=text.split()
              lines=[]; cur=""
              for t in toks:
                  cand=t if not cur else cur+" "+t
                  if len(cand)<=limit:
                      cur=cand
                  else:
                      if cur: lines.append(cur)
                      cur=t
              if cur: lines.append(cur)
              if len(lines)<=2:
                  return "\n".join(lines)
              # preserve every word while balancing into two lines
              mid=len(text)//2
              left=text.rfind(" ",0,mid+1)
              right=text.find(" ",mid)
              cut=left if left>0 else right
              return text if cut<1 else text[:cut]+"\n"+text[cut+1:]

          out=["WEBVTT",""]
          for s,e,text in cues:
              out.append(f"{ts(s)} --> {ts(e)} line:68% position:50% align:center size:88%")
              out.append(wrap(text))
              out.append("")
          dest=Path("YOUTUBE_ENGLISH_CC_TC497_POSITIONED.vtt")
          dest.write_text("\n".join(out),encoding="utf-8")
          print(f"words={len(words)} cues={len(cues)} first={cues[0] if cues else None} last={cues[-1] if cues else None}")
          PY
          test -s YOUTUBE_ENGLISH_CC_TC497_POSITIONED.vtt

      - uses: actions/upload-artifact@v4
        with:
          name: tc497-youtube-english-cc
          path: YOUTUBE_ENGLISH_CC_TC497_POSITIONED.vtt
          compression-level: 0
          retention-days: 1
