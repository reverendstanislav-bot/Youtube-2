name: Build TC497 FINAL V9 1080 VeryFast Master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_final_v9_1080_vf.yml'
      - 'TC497/FINAL_V9/**'

permissions:
  contents: read
  actions: read

jobs:
  build-final-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download native 1080 source master
        uses: actions/download-artifact@v4
        with:
          name: tc497-final-upload-master-1080
          path: /tmp/native1080
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35421316892
          github-token: ${{ github.token }}

      - name: Download approved FULL V9 review
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v9-review-fast
          path: /tmp/v9
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35427554323
          github-token: ${{ github.token }}

      - name: Download V4 subtitle and provenance source
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Download CODEX image package
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Prepare approved V6 V8 V9 sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/final/assets /tmp/final/v4report /tmp/final/pkg /tmp/final/report/screens TC497/FINAL_V9_OUT

          test -s /tmp/native1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4
          test -s /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4
          test -s /tmp/v4/FULL_V4_REPORT.zip

          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/final/v4report
          test -s /tmp/final/v4report/overlay_v4.ass

          PKG_ZIP="$(find /tmp/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n 1)"
          test -n "$PKG_ZIP"
          unzip -q "$PKG_ZIP" -d /tmp/final/pkg
          GEN_DIR="$(find /tmp/final/pkg -type d -name FINAL_62 | head -n 1)"
          test -n "$GEN_DIR"

          cp "$GEN_DIR/WC-Y01.png" /tmp/final/assets/WC-Y01.png
          cp "$GEN_DIR/WD-T03.png" /tmp/final/assets/WD-T03.png
          cp "$GEN_DIR/WC-D03.png" /tmp/final/assets/WC-D03.png
          cp "$GEN_DIR/WC-D05.png" /tmp/final/assets/WC-D05.png

          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_5d160867-ad98-4a85-8556-525b046a6888.png'             -o /tmp/final/assets/electric_human_v6.png
          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_052610_01ad642b-d0d3-4821-a10c-c14448b21b7f.png'             -o /tmp/final/assets/electric_wheel_v6.png
          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_48dcb295-57ea-4d53-901d-7ce9c3492c42.png'             -o /tmp/final/assets/V4_EMPTY_END.png

          for f in electric_human_v6.png electric_wheel_v6.png WC-Y01.png WD-T03.png WC-D03.png WC-D05.png V4_EMPTY_END.png; do
            test -s "/tmp/final/assets/$f"
          done

          python3 TC497/FINAL_V9/build_final_ass.py             --source-ass /tmp/final/v4report/overlay_v4.ass             --output-ass /tmp/final/master_patch.ass

          test -s /tmp/final/master_patch.ass

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/native1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 /tmp/native1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4)" = "1080"

      - name: Render approved V9 picture at 1920x1080
        run: |
          set -euo pipefail

          ffmpeg -y -loglevel error             -i /tmp/native1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4             -loop 1 -framerate 30 -i /tmp/final/assets/electric_human_v6.png             -loop 1 -framerate 30 -i /tmp/final/assets/electric_wheel_v6.png             -loop 1 -framerate 30 -i /tmp/final/assets/WC-Y01.png             -loop 1 -framerate 30 -i /tmp/final/assets/WD-T03.png             -loop 1 -framerate 30 -i /tmp/final/assets/WC-D03.png             -loop 1 -framerate 30 -i /tmp/final/assets/WC-D05.png             -loop 1 -framerate 30 -i /tmp/final/assets/V4_EMPTY_END.png             -filter_complex "              [1:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p1];              [2:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p2];              [3:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p3];              [4:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p4];              [5:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p5];              [6:v]crop=iw*0.76:ih*0.76:iw*0.12:ih*0.12,scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p6];              [7:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,eq=brightness=0.015:contrast=1.025:saturation=0.92[clean];              [0:v][p1]overlay=0:0:eof_action=pass:enable='between(t,215.356,221.464)'[v1];              [v1][p2]overlay=0:0:eof_action=pass:enable='between(t,230.014,237.342)'[v2];              [v2][p3]overlay=0:0:eof_action=pass:enable='between(t,766.838,775.922)'[v3];              [v3][p4]overlay=0:0:eof_action=pass:enable='between(t,815.287,822.857)'[v4];              [v4][p5]overlay=0:0:eof_action=pass:enable='between(t,1020.122,1028.334)'[v5];              [v5][p6]overlay=0:0:eof_action=pass:enable='between(t,1054.611,1062.822)'[v6];              [v6][clean]overlay=0:0:eof_action=pass:enable='between(t,1222.300,1236.533333)'[v7];              [v7]ass=/tmp/final/master_patch.ass,format=yuv420p[vout]"             -map "[vout]" -an -t 1236.533333 -r 30             -c:v libx264 -preset veryfast -crf 14 -profile:v high -level 4.1 -pix_fmt yuv420p             -movflags +faststart             /tmp/final/TC497_FINAL_V9_PICTURE_1920x1080.mp4

      - name: Mux approved V9 audio bit for bit
        run: |
          set -euo pipefail

          ffmpeg -y -loglevel error             -i /tmp/final/TC497_FINAL_V9_PICTURE_1920x1080.mp4             -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4             -map 0:v:0 -map 1:a:0 -c copy -t 1236.533333 -movflags +faststart             TC497/FINAL_V9_OUT/TC497_FINAL_UPLOAD_MASTER_V9_1920x1080.mp4

          ffmpeg -y -loglevel error             -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4             -map 0:a:0 -c copy -f adts /tmp/final/v9_approved.aac

          ffmpeg -y -loglevel error             -i TC497/FINAL_V9_OUT/TC497_FINAL_UPLOAD_MASTER_V9_1920x1080.mp4             -map 0:a:0 -c copy -f adts /tmp/final/final_master.aac

          sha256sum /tmp/final/v9_approved.aac /tmp/final/final_master.aac             | tee /tmp/final/report/AUDIO_SHA256.txt
          cmp /tmp/final/v9_approved.aac /tmp/final/final_master.aac

      - name: Final image audio subtitle QC
        run: |
          set -euo pipefail
          MASTER=TC497/FINAL_V9_OUT/TC497_FINAL_UPLOAD_MASTER_V9_1920x1080.mp4

          ffprobe -v error -count_frames             -show_entries stream=index,codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,duration,bit_rate,nb_read_frames:format=duration,size,bit_rate             -of json "$MASTER" > /tmp/final/report/FFPROBE.json

          ffmpeg -hide_banner -nostats -i "$MASTER"             -af ebur128=peak=true -f null -             > /dev/null 2> /tmp/final/report/EBUR128.txt || true

          ffmpeg -hide_banner -nostats -i "$MASTER"             -vf "blackdetect=d=0.25:pix_th=0.02" -an -f null -             > /dev/null 2> /tmp/final/report/BLACKDETECT.txt || true

          for t in 90 218 233 330 710 733 770 817 840 1024 1058 1083 1111 1212 1223 1226 1228 1232 1235; do
            ffmpeg -y -loglevel error -ss "$t" -i "$MASTER"               -frames:v 1 "/tmp/final/report/screens/final_${t}.jpg"
            ffmpeg -y -loglevel error -ss "$t" -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4               -frames:v 1 "/tmp/final/report/screens/v9_${t}.jpg"
          done

          for spec in "218:3" "233:3" "770:3" "817:3" "1024:3" "1058:3" "1223:3" "1228:3" "1232:3"; do
            start="${spec%%:*}"
            dur="${spec##*:}"
            ffmpeg -hide_banner -nostats               -ss "$start" -t "$dur" -i "$MASTER"               -ss "$start" -t "$dur" -i /tmp/v9/TC497_FULL_V9_REVIEW_960x540.mp4               -filter_complex "[0:v]scale=960:540:flags=lanczos[a];[a][1:v]ssim=stats_file=/tmp/final/report/ssim_${start}.log"               -an -f null - > /dev/null 2>> /tmp/final/report/SSIM_SUMMARY.txt || true
          done

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$MASTER")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$MASTER")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$MASTER")" = "30/1"

          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$MASTER")"
          test "$FRAMES" = "37096"

          cp /tmp/final/master_patch.ass /tmp/final/report/
          cp TC497/FULL_V9/CRITIC_QC.md /tmp/final/report/V9_CRITIC_QC.md
          cp TC497/FULL_V9/EDIT_PLAN.md /tmp/final/report/V9_EDIT_PLAN.md
          cp TC497/FINAL_V9/build_final_ass.py /tmp/final/report/

          cat > /tmp/final/report/FINAL_MASTER_STATUS.md <<'EOF'
          # TC497 FINAL V9 1080 upload master

          User explicitly approved the V9 edit for final-master production.

          Picture:
          - 1920x1080 / 30 fps / H.264 High / yuv420p
          - native 1080 source master is used as the picture base, not the 960x540 V9 proxy;
          - exact V6 Electric Wheel replacements are restored at 215.356-221.464 and 230.014-237.342;
          - exact V9 replacements are applied at 766.838-775.922, 815.287-822.857, 1020.122-1028.334, 1054.611-1062.822;
          - V9 12% edge crop is preserved on all four V9 reconstruction stills;
          - V8 clean cinematic ending begins at 1222.300;
          - old centered slogan and old CTA captions are covered/removed;
          - approved left-aligned HIA / TC-497 / OVERLAND TRAIN end identity is restored;
          - replacement captions and RECONSTRUCTION provenance labels are reburned from the authoritative V4 ASS.

          Audio:
          - copied bit-for-bit from the user-approved FULL_V9 review;
          - no additional normalization or AAC generation is introduced at final-master stage.

          Required release QC:
          - 1920x1080 assertion;
          - 30 fps assertion;
          - exact 37,096 video-frame assertion;
          - approved V9 AAC elementary-stream SHA comparison;
          - EBU R128 loudness scan;
          - black-frame scan;
          - key visual/subtitle frame captures;
          - SSIM spot checks against FULL_V9 review on every changed visual family and ending.
          EOF

          (cd /tmp/final/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FINAL_V9_OUT/TC497_FINAL_V9_QC.zip" .)
          (cd TC497/FINAL_V9_OUT && sha256sum             TC497_FINAL_UPLOAD_MASTER_V9_1920x1080.mp4             TC497_FINAL_V9_QC.zip > SHA256SUMS.txt)

          ls -lh TC497/FINAL_V9_OUT/

      - name: Upload final V9 1080 master
        uses: actions/upload-artifact@v4
        with:
          name: tc497-final-v9-upload-master-1080
          path: |
            TC497/FINAL_V9_OUT/TC497_FINAL_UPLOAD_MASTER_V9_1920x1080.mp4
            TC497/FINAL_V9_OUT/TC497_FINAL_V9_QC.zip
            TC497/FINAL_V9_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
