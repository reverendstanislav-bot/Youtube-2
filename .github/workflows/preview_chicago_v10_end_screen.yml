name: Preview Chicago V10 End Screen Cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preview_chicago_v10_end_screen.yml'
      - 'CHICAGO/V10/cleanup_first_episode_end_screen.py'
      - 'CHICAGO/BRANDING/reference/06_end_screen_background.png'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-opencv python3-numpy python3-pil

      - name: Build V10 first-episode end-screen proof
        run: |
          set -euo pipefail
          rm -rf /tmp/v10_end
          mkdir -p /tmp/v10_end

          python3 CHICAGO/V10/cleanup_first_episode_end_screen.py             --input CHICAGO/BRANDING/reference/06_end_screen_background.png             --output /tmp/v10_end/06_end_screen_episode1_v10.png             --report /tmp/v10_end/V10_END_SCREEN_CLEANUP_QC.json

          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          before=Image.open('CHICAGO/BRANDING/reference/06_end_screen_background.png').convert('RGB')
          after=Image.open('/tmp/v10_end/06_end_screen_episode1_v10.png').convert('RGB')

          # 960x540 review-sized proof.
          b=before.resize((960,540))
          a=after.resize((960,540))

          side=Image.new('RGB',(1920,590),(15,15,15))
          side.paste(b,(0,50)); side.paste(a,(960,50))
          d=ImageDraw.Draw(side)
          d.text((20,15),'BEFORE — CANONICAL 06 END SCREEN',fill='white')
          d.text((980,15),'V10 EPISODE 1 — BOTH VIDEO SLOTS REMOVED / SUBSCRIBE CIRCLE KEPT',fill='white')
          side.save('/tmp/v10_end/V10_END_SCREEN_BEFORE_AFTER.jpg',quality=90)

          a.save('/tmp/v10_end/V10_END_SCREEN_PROOF_960x540.jpg',quality=92)
          PY

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v10-end-screen-proof
          path: /tmp/v10_end
          retention-days: 14
