name: Extract Chicago Channel Brand Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-brand-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip jq

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/brand_extract /tmp/brand_release
          mkdir -p /tmp/chicago_src /tmp/brand_extract /tmp/brand_release
          cd /tmp/chicago_src

          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract channel brand assets only
        run: |
          set -euo pipefail
          cd /tmp/chicago_src

          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/brand_extract \
            "-ir!*Hidden_Industrial_America_7_Brand_Assets/*"

          find /tmp/brand_extract -type f -printf '%p\n' | sort | tee /tmp/brand_release/BRAND_ASSETS_FILE_LIST.txt

          BRAND_ROOT="$(find /tmp/brand_extract -type d -name 'Hidden_Industrial_America_7_Brand_Assets' | head -n1)"
          test -n "$BRAND_ROOT"
          echo "BRAND_ROOT=$BRAND_ROOT"

          cp -a "$BRAND_ROOT" /tmp/brand_release/

          find "$BRAND_ROOT" -type f \( \
            -iname '*06*' -o \
            -iname '*end*screen*' -o \
            -iname '*quick*usage*guide*' \
          \) -print | sort | tee /tmp/brand_release/TARGET_FILES.txt

          TARGET_COUNT="$(wc -l < /tmp/brand_release/TARGET_FILES.txt)"
          test "$TARGET_COUNT" -ge 2

          while IFS= read -r f; do
            cp -f "$f" /tmp/brand_release/
          done < /tmp/brand_release/TARGET_FILES.txt

          cd /tmp/brand_release
          zip -q -r HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip Hidden_Industrial_America_7_Brand_Assets
          sha256sum * > SHA256SUMS.txt || true

      - name: Build manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path('/tmp/brand_release')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append({
                    'path':str(p.relative_to(root)),
                    'size_bytes':p.stat().st_size,
                    'sha256':h
                  })
          (root/'BRAND_ASSETS_MANIFEST.json').write_text(
              json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          PY

      - name: Publish extracted brand assets release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-channel-brand-assets-extracted-20260920
          cd /tmp/brand_release

          ASSETS=(BRAND_ASSETS_FILE_LIST.txt TARGET_FILES.txt BRAND_ASSETS_MANIFEST.json HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip SHA256SUMS.txt)
          for f in *; do
            case "$f" in
              *.pdf|*.png|*.jpg|*.jpeg|*.webp) ASSETS+=("$f");;
            esac
          done

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title 'Hidden Industrial America — Extracted Channel Brand Assets' \
              --notes 'Exact extraction from canonical Chicago source archive. Contains the original brand-assets package, including Quick Usage Guide and 06 End Screen assets. No regeneration or redesign.' \
              --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hia-channel-brand-assets-extracted
          path: /tmp/brand_release
          retention-days: 14
