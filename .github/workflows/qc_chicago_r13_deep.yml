name: Deep QC Chicago R13 Review

on:
  push:
    paths:
      - '.github/workflows/qc_chicago_r13_deep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install QC tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip gh
          mkdir -p /tmp/qc/{frames_regular,frames_shots,prov_crops,out}

      - name: Download Chicago R13 review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/qc
          gh release download chicago-r13-remotion-provenance-reedit-review-20260923 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'HIA_CHICAGO_R13_REMOTION_PROVENANCE_REEDIT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R13_REMOTION_PROVENANCE_REEDIT_REVIEW_1920x1080.mp4 chicago.mp4
          test -s chicago.mp4

      - name: Technical decode and stream QC
        run: |
          set -euo pipefail
          cd /tmp/qc
          ffprobe -v error -count_frames -show_streams -show_format -of json chicago.mp4 > out/FFPROBE.json
          ffmpeg -v error -xerror -i chicago.mp4 -map 0:v:0 -map 0:a:0 -f null - 2> out/DECODE_ERRORS.txt
          test ! -s out/DECODE_ERRORS.txt
          ffmpeg -hide_banner -nostats -i chicago.mp4 -vf "blackdetect=d=0.20:pix_th=0.02" -an -f null - > /dev/null 2> out/BLACKDETECT.txt || true
          ffmpeg -hide_banner -nostats -i chicago.mp4 -af "silencedetect=noise=-45dB:d=0.80" -vn -f null - > /dev/null 2> out/SILENCEDETECT.txt || true
          ffmpeg -hide_banner -nostats -i chicago.mp4 -af "ebur128=peak=true" -vn -f null - > /dev/null 2> out/EBUR128.txt || true
          ffmpeg -hide_banner -nostats -i chicago.mp4 -vf "select='gt(scene,0.22)',metadata=print:file=out/SCENE_METADATA.txt" -an -f null - > /dev/null 2> out/SCENE_DETECT_STDERR.txt || true
          sha256sum chicago.mp4 > out/VIDEO_SHA256.txt

      - name: Extract regular timeline samples
        run: |
          set -euo pipefail
          cd /tmp/qc
          ffmpeg -y -loglevel error -i chicago.mp4 \
            -vf "fps=1/10,scale=640:360" -q:v 3 frames_regular/f_%04d.jpg
          # Exact outro boundary / final frames at full resolution.
          for t in 1266.0 1267.5 1268.1 1269.0 1275.0 1285.0 1290.0; do
            ffmpeg -y -loglevel error -ss "$t" -i chicago.mp4 -frames:v 1 -q:v 2 "out/outro_${t}.jpg"
          done

      - name: Extract one early frame from every planned shot plus provenance crops
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          shots=json.loads(Path('CHICAGO/AUDIT/V2_SEQUENCE/shots.json').read_text(encoding='utf-8-sig'))
          q=Path('/tmp/qc')
          manifest=[]
          for i,s in enumerate(shots):
              # 0.40 s after the planned shot start, but keep inside very short shots.
              start=s['a']/25
              end=s['b']/25
              t=min(start+0.40,max(start+0.04,end-0.04))
              manifest.append({
                  'i':i,'t':round(t,3),'scene':s.get('scene',''),'kind':s.get('kind',''),
                  'variant':s.get('variant',''),'section':s.get('section',''),
                  'start':round(start,3),'end':round(end,3),
              })
              out=q/'frames_shots'/f'shot_{i:03d}.jpg'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(q/'chicago.mp4'),
                              '-frames:v','1','-vf','scale=640:360','-q:v','3',str(out)],check=True)
              if s.get('kind') in {'archive','map','reconstruction','document','concept'}:
                  crop=q/'prov_crops'/f'prov_{i:03d}.jpg'
                  # Top-right provenance area, enlarged 3x.
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(q/'chicago.mp4'),
                                  '-frames:v','1','-vf','crop=650:150:1270:0,scale=1300:300','-q:v','2',str(crop)],check=True)
          (q/'out'/'SHOT_SAMPLE_MANIFEST.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY

      - name: Build contact sheets and quantitative report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import json,re,statistics
          q=Path('/tmp/qc')
          out=q/'out'
          font=ImageFont.load_default()

          def sheets(img_dir, pattern, cols, rows, prefix, labels=None, thumb=(640,360)):
              files=sorted(img_dir.glob(pattern))
              per=cols*rows
              for page in range((len(files)+per-1)//per):
                  batch=files[page*per:(page+1)*per]
                  cellw,cellh=thumb[0],thumb[1]+30
                  canvas=Image.new('RGB',(cols*cellw,rows*cellh),(24,24,24))
                  d=ImageDraw.Draw(canvas)
                  for j,p in enumerate(batch):
                      im=Image.open(p).convert('RGB')
                      im.thumbnail(thumb)
                      x=(j%cols)*cellw; y=(j//cols)*cellh
                      canvas.paste(im,(x,y))
                      label=p.stem
                      if labels and p.name in labels: label=labels[p.name]
                      d.rectangle((x,y+thumb[1],x+cellw,y+cellh),fill=(12,12,12))
                      d.text((x+6,y+thumb[1]+7),label,fill=(240,240,240),font=font)
                  canvas.save(out/f'{prefix}_{page+1:02d}.jpg',quality=88)

          # Regular timeline labels are 0,10,20... seconds.
          rfiles=sorted((q/'frames_regular').glob('f_*.jpg'))
          rlabels={p.name:f'{(i)*10:04d}s' for i,p in enumerate(rfiles)}
          sheets(q/'frames_regular','f_*.jpg',4,4,'REGULAR_TIMELINE',rlabels,(640,360))

          manifest=json.loads((out/'SHOT_SAMPLE_MANIFEST.json').read_text())
          slabels={}
          for m in manifest:
              name=f"shot_{m['i']:03d}.jpg"
              slabels[name]=f"{m['i']:03d} {m['t']:7.2f}s {m['scene']} {m['kind']} | {m['section'][:32]}"
          sheets(q/'frames_shots','shot_*.jpg',4,4,'SHOT_TIMELINE',slabels,(640,360))

          plabels={}
          for m in manifest:
              name=f"prov_{m['i']:03d}.jpg"
              plabels[name]=f"{m['i']:03d} {m['t']:7.2f}s {m['scene']} {m['kind']}"
          sheets(q/'prov_crops','prov_*.jpg',3,5,'PROVENANCE_CROPS',plabels,(1300,300))

          # Quantitative shot pacing from planned timeline.
          durations=[m['end']-m['start'] for m in manifest]
          long=[m for m in manifest if m['end']-m['start']>=8]
          short=[m for m in manifest if m['end']-m['start']<1.2]

          ff=json.loads((out/'FFPROBE.json').read_text())
          v=[s for s in ff['streams'] if s.get('codec_type')=='video'][0]
          a=[s for s in ff['streams'] if s.get('codec_type')=='audio'][0]

          scene=(out/'SCENE_METADATA.txt').read_text(errors='ignore') if (out/'SCENE_METADATA.txt').exists() else ''
          scene_pts=[float(x) for x in re.findall(r'pts_time:([0-9.]+)',scene)]
          black=(out/'BLACKDETECT.txt').read_text(errors='ignore')
          blacks=re.findall(r'black_start:([0-9.]+).*?black_end:([0-9.]+)',black)
          sil=(out/'SILENCEDETECT.txt').read_text(errors='ignore')
          sils=re.findall(r'silence_start: ([0-9.]+).*?silence_end: ([0-9.]+)',sil,re.S)

          report={
            'video':{
              'width':v.get('width'),'height':v.get('height'),'fps':v.get('r_frame_rate'),
              'frames':v.get('nb_read_frames'),'duration':ff['format'].get('duration'),
              'video_codec':v.get('codec_name'),'audio_codec':a.get('codec_name'),
              'audio_sample_rate':a.get('sample_rate'),'audio_channels':a.get('channels')
            },
            'planned_shots':len(manifest),
            'shot_duration_sec':{
              'min':round(min(durations),3),'median':round(statistics.median(durations),3),
              'mean':round(statistics.mean(durations),3),'max':round(max(durations),3),
              'ge_8sec_count':len(long),'lt_1_2sec_count':len(short)
            },
            'long_shots':long,
            'very_short_shots':short,
            'detected_scene_changes_threshold_0_22':len(scene_pts),
            'scene_pts':scene_pts,
            'black_events':blacks,
            'silence_events':sils,
          }
          (out/'QUANT_REPORT.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY

      - name: Package visual QC
        run: |
          set -euo pipefail
          cd /tmp/qc
          cp frames_regular/*.jpg out/
          cp frames_shots/*.jpg out/
          cp prov_crops/*.jpg out/
          zip -q -r CHICAGO_R13_DEEP_QC.zip out
          ls -lh CHICAGO_R13_DEEP_QC.zip

      - name: Upload deep QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-r13-deep-qc
          path: /tmp/qc/CHICAGO_R13_DEEP_QC.zip
          compression-level: 0
          retention-days: 3
