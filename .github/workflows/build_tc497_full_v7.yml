name: Build TC497 FULL V7 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v7.yml'
      - 'TC497/FULL_V7/**'

permissions:
  contents: read
  actions: read

jobs:
  build-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download FULL V6 review base
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v6-review
          path: /tmp/v6
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425090519
          github-token: ${{ github.token }}

      - name: Download FULL V4 report for final captions
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare source assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/v7 /tmp/v7report/screens TC497/FULL_V7_OUT
          test -s /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4
          test -s /tmp/v4/FULL_V4_REPORT.zip
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/overlay_v4.ass

          curl -fL --retry 4 --retry-all-errors             'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_48dcb295-57ea-4d53-901d-7ce9c3492c42.png'             -o /tmp/v7/V4_EMPTY_END.png
          test -s /tmp/v7/V4_EMPTY_END.png

      - name: Generate original resolving music
        run: |
          set -euo pipefail
          python3 TC497/FULL_V7/generate_outro_music.py             --output /tmp/v7/outro_resolve_original.wav
          test -s /tmp/v7/outro_resolve_original.wav

      - name: Render FULL V7 review
        run: |
          set -euo pipefail
          python3 TC497/FULL_V7/v7_outro_patch.py             --input /tmp/v6/TC497_FULL_V6_REVIEW_960x540.mp4             --clean-end /tmp/v7/V4_EMPTY_END.png             --source-ass /tmp/v4report/overlay_v4.ass             --music /tmp/v7/outro_resolve_original.wav             --work-dir /tmp/v7             --output TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4

          test -s TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4
          test -s /tmp/v7/v7_end.ass
          grep -q 'V7Brand' /tmp/v7/v7_end.ass
          if grep -q 'THE MACHINE WORKED' /tmp/v7/v7_end.ass; then
            echo 'Old centered slogan leaked into V7 end ASS' >&2
            exit 1
          fi

      - name: Objective QC and review package
        run: |
          set -euo pipefail

          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,duration:format=duration,size,bit_rate             -of json TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4             > /tmp/v7report/FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4             -af ebur128=peak=true -f null -             > /dev/null 2> /tmp/v7report/EBUR128.txt

          for t in 1185 1201 1215 1222 1224 1228 1232 1235; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4               -frames:v 1 "/tmp/v7report/screens/frame_${t}.jpg"
          done

          cp /tmp/v7/v7_end.ass /tmp/v7report/
          cp TC497/FULL_V7/VIEWER_AUDIT.md /tmp/v7report/
          cp TC497/FULL_V7/v7_outro_patch.py /tmp/v7report/
          cp TC497/FULL_V7/generate_outro_music.py /tmp/v7report/

          cat > /tmp/v7report/V7_BUILD_NOTES.md <<'EOF'
          # TC497 FULL_V7 — review build only

          FULL_V7 is NOT a final upload master and is NOT user-approved.

          Base:
          - FULL_V6 review from GitHub Actions run 35425090519.

          Changes:
          - redesigns only the final plate beginning at 20:21.948;
          - removes the centered HIDDEN INDUSTRIAL AMERICA / THE MACHINE WORKED / THE WORLD MOVED ON end slogan;
          - restores a clean V4 desert source for the final plate;
          - preserves the final narration captions;
          - introduces restrained left-aligned channel/episode typography;
          - leaves the right side visually quiet for YouTube end-screen elements;
          - adds a copyright-independent original procedural resolving music cue from ~19:45 to the end;
          - no zoom ping-pong, collage blocks, or faux archive treatment.

          No 1080p build is promoted by this workflow.
          EOF

          (cd /tmp/v7report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V7_OUT/FULL_V7_REPORT.zip" .)
          (cd TC497/FULL_V7_OUT && sha256sum             TC497_FULL_V7_REVIEW_960x540.mp4 FULL_V7_REPORT.zip > SHA256SUMS.txt)

          ls -lh TC497/FULL_V7_OUT/

      - name: Upload FULL V7 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v7-review
          path: |
            TC497/FULL_V7_OUT/TC497_FULL_V7_REVIEW_960x540.mp4
            TC497/FULL_V7_OUT/FULL_V7_REPORT.zip
            TC497/FULL_V7_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
