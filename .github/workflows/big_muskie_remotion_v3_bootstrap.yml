name: Big Muskie Remotion V3 bootstrap

on:
  push:
    paths:
      - '.github/workflows/big_muskie_remotion_v3_bootstrap.yml'
      - 'BIG_MUSKIE/REMOTION_V3/package.json'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion runtime
        working-directory: BIG_MUSKIE/REMOTION_V3
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node -e "console.log(require('remotion/package.json').version)"
      - name: Package node_modules
        run: |
          set -euo pipefail
          tar -C BIG_MUSKIE/REMOTION_V3 -czf /tmp/big_muskie_remotion_v3_node_modules.tar.gz node_modules package-lock.json
          ls -lh /tmp/big_muskie_remotion_v3_node_modules.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: big-muskie-remotion-v3-node-modules
          path: /tmp/big_muskie_remotion_v3_node_modules.tar.gz
          retention-days: 1
          compression-level: 0
