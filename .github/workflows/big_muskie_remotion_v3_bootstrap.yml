name: Big Muskie Remotion V3 bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/big_muskie_remotion_v3_bootstrap.yml'
      - 'BIG_MUSKIE/REMOTION_V3/package.json'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion runtime and browser
        working-directory: BIG_MUSKIE/REMOTION_V3
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx remotion browser ensure
          node -e "console.log(require('remotion/package.json').version)"
          echo "=== browser cache candidates ==="
          find "$HOME" /tmp -type f \( -name 'headless_shell' -o -name 'chrome-headless-shell' -o -name 'chrome' \) 2>/dev/null | head -30 || true
      - name: Package runtime and Remotion browser cache
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime
          tar -C BIG_MUSKIE/REMOTION_V3 -czf /tmp/runtime/node_runtime.tar.gz node_modules package-lock.json
          for d in "$HOME/.cache/remotion" "$HOME/.cache/remotion-browser" "$HOME/.cache/puppeteer" "/tmp/remotion"; do
            if [ -e "$d" ]; then
              n="$(echo "$d" | tr '/.' '__')"
              tar -czf "/tmp/runtime/cache_${n}.tar.gz" -C "$(dirname "$d")" "$(basename "$d")"
            fi
          done
          find /tmp/runtime -maxdepth 1 -type f -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: big-muskie-remotion-v3-runtime-browser
          path: /tmp/runtime/
          retention-days: 7
          compression-level: 0
