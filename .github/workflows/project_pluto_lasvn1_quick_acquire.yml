name: VIDEO006 Fast Original 1963 LASVN1 Film Fetch
on:
  push:
    paths:
      - '.github/workflows/project_pluto_lasvn1_quick_acquire.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tools only (no apt mirror dependency)
        run: python -m pip install -U yt-dlp imageio-ffmpeg
      - name: Retrieve 1963 historical film and test real source frames
        run: python PROJECT_PLUTO/ARCHIVE/lasvn1_quick_acquire.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LASVN1_Primary_1963_Research_Mirror_Rights_PENDING
          path: LASVN1_RESEARCH_1963/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
