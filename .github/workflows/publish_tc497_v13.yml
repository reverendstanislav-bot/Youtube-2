name: Publish TC497 V13

on:
  push:
    paths:
      - '.github/workflows/publish_tc497_v13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download V13 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TC497/V13
          curl -fL --retry 5 --retry-all-errors             'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/73e17c53-037f-4b6b-9e1c-c093c6963ae8.mp4'             -o TC497/V13/TC497_V13_COLD_OPEN_FINAL_POLISH.mp4
          curl -fL --retry 5 --retry-all-errors             'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/2e453b68-f00c-4ce7-9760-826de6a1537b.zip'             -o TC497/V13/TC497_V13_REMOTION_REPORT.zip
          (
            cd TC497/V13
            sha256sum TC497_V13_COLD_OPEN_FINAL_POLISH.mp4 TC497_V13_REMOTION_REPORT.zip > SHA256SUMS.txt
          )
          ls -lh TC497/V13

      - name: Commit V13 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             TC497/V13/TC497_V13_COLD_OPEN_FINAL_POLISH.mp4             TC497/V13/TC497_V13_REMOTION_REPORT.zip             TC497/V13/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No artifact changes to commit.'
            exit 0
          fi
          git commit -m 'Publish TC497 V13 cold open artifacts'
          git push origin HEAD:main
