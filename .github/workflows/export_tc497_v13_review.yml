name: Export TC497 V13 Review Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export_tc497_v13_review.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify V13 files
        run: |
          set -euo pipefail
          ls -lh TC497/V13/
          test -s TC497/V13/TC497_V13_COLD_OPEN_FINAL_POLISH.mp4
          test -s TC497/V13/TC497_V13_REMOTION_REPORT.zip
      - name: Upload V13 review bundle
        uses: actions/upload-artifact@v4
        with:
          name: tc497-v13-review
          path: |
            TC497/V13/TC497_V13_COLD_OPEN_FINAL_POLISH.mp4
            TC497/V13/TC497_V13_REMOTION_REPORT.zip
            TC497/V13/NEW_CHAT_HANDOFF.md
            TC497/V13/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
