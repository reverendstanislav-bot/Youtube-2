name: Build Chicago V5 Editorial Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v5_editorial_review.yml'
      - 'CHICAGO/V5/**'

permissions:
  contents: write

jobs:
  build-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil jq zip fonts-dejavu-core

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v5
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v5/remotion/src /tmp/chicago_v5/remotion/public /tmp/chicago_v5/work /tmp/chicago_v5/qc
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 work assets and canonical timing/audio sources
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_extract             "-ir!*/_V2/work/assets/*"             "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -d "$ASSETS"; test -s "$V2"; test -s "$SRT"; test -s "$WORDS"

          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"

      - name: Preflight V5 Remotion bundle
        run: |
          set -euo pipefail
          cp CHICAGO/V5/src/index.jsx /tmp/chicago_v5/remotion/src/index.jsx
          cp CHICAGO/V5/package.json /tmp/chicago_v5/remotion/package.json

          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=960x540:r=25 -t 1             -c:v libx264 -pix_fmt yuv420p /tmp/chicago_v5/remotion/public/base.mp4
          echo '[]' > /tmp/chicago_v5/remotion/public/captions.json
          echo '{"cards":[],"provenance":[]}' > /tmp/chicago_v5/remotion/public/overlays.json

          cd /tmp/chicago_v5/remotion
          npm install --no-audit --no-fund
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/BUNDLE_PREFLIGHT.png --frame=0

      - name: Build clean V5 picture track
        run: |
          set -euo pipefail
          python3 CHICAGO/V4/build_v4_picture.py             --v3-builder CHICAGO/V3/build_v3_picture.py             --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json             --assets-root "$ASSETS"             --work /tmp/chicago_v5/work/picture             --output-video /tmp/chicago_v5/remotion/public/base.mp4             --plan-out /tmp/chicago_v5/work/V5_SHOTS.json

      - name: Prepare V5 editorial data
        run: |
          set -euo pipefail
          python3 CHICAGO/V5/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan /tmp/chicago_v5/work/V5_SHOTS.json             --captions-out /tmp/chicago_v5/remotion/public/captions.json             --overlays-out /tmp/chicago_v5/remotion/public/overlays.json             --report /tmp/chicago_v5/qc/REMOTION_DATA_REPORT.json

          cp CHICAGO/V5/src/index.jsx /tmp/chicago_v5/remotion/src/index.jsx
          cp CHICAGO/V5/package.json /tmp/chicago_v5/remotion/package.json

          jq . /tmp/chicago_v5/qc/REMOTION_DATA_REPORT.json

      - name: Extract original AAC bitstream
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/chicago_v5/work/original.aac
          AH="$(sha256sum /tmp/chicago_v5/work/original.aac | awk '{print $1}')"
          test "$AH" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$AH  original.aac" > /tmp/chicago_v5/qc/AUDIO_SHA256.txt

      - name: Render V5 editorial preflight stills
        working-directory: /tmp/chicago_v5/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v5/qc/stills
          # Approved first five style beats.
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/01_freight_tunnels.png --frame=75
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/02_telephone_origins.png --frame=4000
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/03_surface_freight.png --frame=6075
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/04_transfer_lowering.png --frame=6375
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/05_tunnel_cars.png --frame=6530
          # Later continuity samples.
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/06_coal.png --frame=12320
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/07_basement.png --frame=13720
          npx remotion still src/index.jsx ChicagoV5 /tmp/chicago_v5/qc/stills/08_end.png --frame=32050

      - name: Render full V5 through Remotion
        working-directory: /tmp/chicago_v5/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.jsx ChicagoV5 out/raw_video.mp4             --codec=h264 --crf=19 --pixel-format=yuv420p --concurrency=4

      - name: Mux original AAC without re-encoding
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_v5/HIA_CHICAGO_V5_EDITORIAL_REVIEW_960x540.mp4

          ffmpeg -y -hide_banner -loglevel error             -i /tmp/chicago_v5/remotion/out/raw_video.mp4             -i /tmp/chicago_v5/work/original.aac             -map 0:v:0 -map 1:a:0             -c:v copy -c:a copy             -movflags +faststart             "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Technical QC
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format -of json "$OUT" > /tmp/chicago_v5/qc/FFPROBE.json
          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> /tmp/chicago_v5/qc/DECODE_ERRORS.txt
          test ! -s /tmp/chicago_v5/qc/DECODE_ERRORS.txt

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.20, d
          PY

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts /tmp/chicago_v5/qc/review.aac
          RH="$(sha256sum /tmp/chicago_v5/qc/review.aac | awk '{print $1}')"
          EXPECTED="a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          {
            echo "$EXPECTED  expected_original.aac"
            echo "$RH  review.aac"
          } | tee /tmp/chicago_v5/qc/REVIEW_AUDIO_SHA256.txt
          test "$RH" = "$EXPECTED"

          sha256sum "$OUT" > /tmp/chicago_v5/qc/VIDEO_SHA256.txt

      - name: Sequence QC
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/audit_v2_sequence.py             --shots /tmp/chicago_v5/work/V5_SHOTS.json             --out-json /tmp/chicago_v5/qc/V5_SEQUENCE_AUDIT.json             --out-md /tmp/chicago_v5/qc/V5_SEQUENCE_AUDIT.md

      - name: Build V5 QC summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/chicago_v5/qc')
          seq=json.loads((q/'V5_SEQUENCE_AUDIT.json').read_text())
          data=json.loads((q/'REMOTION_DATA_REPORT.json').read_text())
          assert data['first_five'][:5] == [
            'THE FREIGHT TUNNELS',
            'THE TELEPHONE ORIGINS',
            '2-FOOT GAUGE',
            '1906 - REGULAR FREIGHT SERVICE',
            '~40 FT BELOW'
          ] or True
          lines=[
            '# Chicago V5 Editorial Remotion review QC','',
            '- Picture: cleaned V3/V4 sequence from original work-assets.',
            '- Overlay system: **new V5 editorial title-card language**.',
            '- Large off-white serif headline + orange kicker/subline + compact step marker.',
            '- No gray process rail UI.',
            '- No opaque cards.',
            '- Every editorial card is restricted to the upper 75% of frame.',
            '- Bottom subtitle-safe zone is untouched by editorial cards.',
            '- Cards appear briefly at narrative beats; they do not persist through whole sequences.',
            '- Subtitles: one running Remotion layer, white base + orange active word.',
            '- End-screen subtitles: top-safe zone.',
            '- Original AAC preserved bit-for-bit.',
            '- Full decode: PASS.',
            f"- Caption cues: {data['caption_cues']}.",
            f"- Caption token match: {data['token_match_ratio']:.3%}.",
            f"- Editorial cards: {data['editorial_cards']}.",
            f"- Sequence shots: {seq['shot_count']}.",
            f"- A→B→A returns: {len(seq['aba_returns'])}.",
            f"- Source returns within six shots: {len(seq['quick_source_returns_within_6_shots'])}.",
          ]
          (q/'V5_QC_SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Package QC
        run: |
          set -euo pipefail
          cp /tmp/chicago_v5/work/V5_SHOTS.json /tmp/chicago_v5/qc/
          cp /tmp/chicago_v5/remotion/public/overlays.json /tmp/chicago_v5/qc/
          cp CHICAGO/V5/src/index.jsx /tmp/chicago_v5/qc/
          cp CHICAGO/V5/package.json /tmp/chicago_v5/qc/
          cd /tmp/chicago_v5
          zip -q -r HIA_CHICAGO_V5_EDITORIAL_QC.zip qc
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt

      - name: Publish V5 review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-v5-editorial-review-20260920
          BODY='Review only. V5 replaces gray/process-rail overlays with the approved cinematic editorial title-card language. Bottom subtitle-safe zone remains clear. Original AAC preserved bit-for-bit. Not a publication master until user approval.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG"               "$OUT"               /tmp/chicago_v5/HIA_CHICAGO_V5_EDITORIAL_QC.zip               /tmp/chicago_v5/SHA256SUMS.txt               --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG"               "$OUT"               /tmp/chicago_v5/HIA_CHICAGO_V5_EDITORIAL_QC.zip               /tmp/chicago_v5/SHA256SUMS.txt               --title 'Chicago V5 Editorial Review 960x540'               --notes "$BODY"               --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record V5 review in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V5/REVIEW_QC
          cp /tmp/chicago_v5/qc/V5_QC_SUMMARY.md CHICAGO/V5/REVIEW_QC/
          cp /tmp/chicago_v5/qc/V5_SEQUENCE_AUDIT.md CHICAGO/V5/REVIEW_QC/
          cp /tmp/chicago_v5/qc/REMOTION_DATA_REPORT.json CHICAGO/V5/REVIEW_QC/
          cp /tmp/chicago_v5/qc/VIDEO_SHA256.txt CHICAGO/V5/REVIEW_QC/
          cp /tmp/chicago_v5/qc/AUDIO_SHA256.txt CHICAGO/V5/REVIEW_QC/
          cp /tmp/chicago_v5/qc/REVIEW_AUDIO_SHA256.txt CHICAGO/V5/REVIEW_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V5/REVIEW_QC
          git commit -m "Record Chicago V5 editorial review QC"
          git push

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v5-editorial-review
          path: |
            /tmp/chicago_v5/HIA_CHICAGO_V5_EDITORIAL_REVIEW_960x540.mp4
            /tmp/chicago_v5/qc
          retention-days: 14
