name: Build 10 Shorts Review Pack

on:
  push:
    paths:
      - '.github/workflows/build_hia_shorts_review.yml'
      - 'SHORTS_RENDER/**'
      - 'CHICAGO/SHORTS/**'
      - 'TC497/SHORTS/**'
      - 'CHANNEL/SHORTS_PRODUCTION_CANON.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hia-shorts-review
  cancel-in-progress: true

jobs:
  chicago:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip
          mkdir -p /tmp/shorts_chi/{project/src,project/public,out,qc}

      - name: Download Chicago R14 source video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/shorts_chi/project/public
          gh release download chicago-r14-editorial-recut-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4 chicago.mp4
          test -s chicago.mp4

      - name: Prepare Chicago Shorts project
        run: |
          set -euo pipefail
          cp SHORTS_RENDER/src/index.jsx /tmp/shorts_chi/project/src/index.jsx
          cp SHORTS_RENDER/package.json /tmp/shorts_chi/project/package.json
          jq '{chicago:{shorts:[.shorts[] + {source_file:"chicago.mp4",source_fps:25}]},tc497:{shorts:[]}}'             CHICAGO/SHORTS/shorts_extraction_map.json > /tmp/shorts_chi/project/public/maps.json
          cd /tmp/shorts_chi/project
          npm install --no-audit --no-fund

      - name: Render 5 Chicago Shorts reviews
        working-directory: /tmp/shorts_chi/project
        run: |
          set -euo pipefail
          mkdir -p /tmp/shorts_chi/out
          for id in $(jq -r '.chicago.shorts[].id' public/maps.json); do
            echo "RENDER $id"
            npx remotion render src/index.jsx "$id" "/tmp/shorts_chi/out/${id}_REVIEW.mp4"               --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=4
          done

      - name: Chicago technical QC and contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont

          base=Path('/tmp/shorts_chi')
          maps=json.loads((base/'project/public/maps.json').read_text())
          q=base/'qc'; q.mkdir(exist_ok=True)
          report={'episode':'CHICAGO','shorts':[]}
          font=ImageFont.load_default()

          for sh in maps['chicago']['shorts']:
              p=base/'out'/f"{sh['id']}_REVIEW.mp4"
              probe=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)
              ]))
              v=[x for x in probe['streams'] if x.get('codec_type')=='video'][0]
              a=[x for x in probe['streams'] if x.get('codec_type')=='audio']
              dur=float(probe['format']['duration'])
              ok=(v.get('width')==1080 and v.get('height')==1920 and v.get('r_frame_rate')=='25/1' and len(a)>=1 and abs(dur-sh['duration_sec'])<0.25)
              dec=q/f"{sh['id']}_decode.txt"
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              ok=ok and rc==0 and dec.stat().st_size==0

              # Five visual checkpoints.
              frames=[]
              for n,fraction in enumerate([.08,.28,.48,.68,.88],1):
                  t=max(.1,min(dur-.1,dur*fraction))
                  out=q/f"{sh['id']}_{n}.jpg"
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(out)],check=True)
                  frames.append(out)

              canvas=Image.new('RGB',(1080*5,1920),(20,20,20))
              for i,pic in enumerate(frames):
                  im=Image.open(pic).convert('RGB')
                  canvas.paste(im,(i*1080,0))
                  d=ImageDraw.Draw(canvas)
                  d.rectangle((i*1080,0,i*1080+250,46),fill=(12,12,12))
                  d.text((i*1080+8,14),f"{sh['id']} {i+1}/5",fill=(245,245,245),font=font)
              canvas.thumbnail((2700,9600))
              sheet=q/f"{sh['id']}_CONTACT.jpg"
              canvas.save(sheet,quality=88)

              subprocess.run([
                  'ffmpeg','-hide_banner','-nostats','-i',str(p),
                  '-vf','blackdetect=d=0.25:pix_th=0.02','-an','-f','null','-'
              ],stdout=subprocess.DEVNULL,stderr=open(q/f"{sh['id']}_blackdetect.txt",'w'))
              report['shorts'].append({
                  'id':sh['id'],'duration':dur,'width':v.get('width'),'height':v.get('height'),
                  'fps':v.get('r_frame_rate'),'audio_streams':len(a),'decode_ok':rc==0,'technical_pass':ok
              })
          report['status']='PASS' if all(x['technical_pass'] for x in report['shorts']) else 'FAIL'
          (q/'TECHNICAL_QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS':
              raise SystemExit(report)
          PY

      - name: Upload Chicago review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-chicago-review
          path: |
            /tmp/shorts_chi/out
            /tmp/shorts_chi/qc
          compression-level: 0
          retention-days: 7

  tc497:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip
          mkdir -p /tmp/shorts_tc/{project/src,project/public,out,qc}

      - name: Download TC497 R14 source video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/shorts_tc/project/public
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 tc497.mp4
          test -s tc497.mp4

      - name: Prepare TC497 Shorts project
        run: |
          set -euo pipefail
          cp SHORTS_RENDER/src/index.jsx /tmp/shorts_tc/project/src/index.jsx
          cp SHORTS_RENDER/package.json /tmp/shorts_tc/project/package.json
          jq '{chicago:{shorts:[]},tc497:{shorts:[.shorts[] + {source_file:"tc497.mp4",source_fps:30}]}}'             TC497/SHORTS/shorts_extraction_map.json > /tmp/shorts_tc/project/public/maps.json
          cd /tmp/shorts_tc/project
          npm install --no-audit --no-fund

      - name: Render 5 TC497 Shorts reviews
        working-directory: /tmp/shorts_tc/project
        run: |
          set -euo pipefail
          mkdir -p /tmp/shorts_tc/out
          for id in $(jq -r '.tc497.shorts[].id' public/maps.json); do
            echo "RENDER $id"
            npx remotion render src/index.jsx "$id" "/tmp/shorts_tc/out/${id}_REVIEW.mp4"               --codec=h264 --crf=17 --pixel-format=yuv420p --concurrency=4
          done

      - name: TC497 technical QC and contact sheets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont

          base=Path('/tmp/shorts_tc')
          maps=json.loads((base/'project/public/maps.json').read_text())
          q=base/'qc'; q.mkdir(exist_ok=True)
          report={'episode':'TC497','shorts':[]}
          font=ImageFont.load_default()

          for sh in maps['tc497']['shorts']:
              p=base/'out'/f"{sh['id']}_REVIEW.mp4"
              probe=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)
              ]))
              v=[x for x in probe['streams'] if x.get('codec_type')=='video'][0]
              a=[x for x in probe['streams'] if x.get('codec_type')=='audio']
              dur=float(probe['format']['duration'])
              ok=(v.get('width')==1080 and v.get('height')==1920 and v.get('r_frame_rate')=='30/1' and len(a)>=1 and abs(dur-sh['duration_sec'])<0.25)
              dec=q/f"{sh['id']}_decode.txt"
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              ok=ok and rc==0 and dec.stat().st_size==0

              frames=[]
              for n,fraction in enumerate([.08,.28,.48,.68,.88],1):
                  t=max(.1,min(dur-.1,dur*fraction))
                  out=q/f"{sh['id']}_{n}.jpg"
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(out)],check=True)
                  frames.append(out)

              canvas=Image.new('RGB',(1080*5,1920),(20,20,20))
              for i,pic in enumerate(frames):
                  im=Image.open(pic).convert('RGB')
                  canvas.paste(im,(i*1080,0))
                  d=ImageDraw.Draw(canvas)
                  d.rectangle((i*1080,0,i*1080+250,46),fill=(12,12,12))
                  d.text((i*1080+8,14),f"{sh['id']} {i+1}/5",fill=(245,245,245),font=font)
              canvas.thumbnail((2700,9600))
              sheet=q/f"{sh['id']}_CONTACT.jpg"
              canvas.save(sheet,quality=88)

              subprocess.run([
                  'ffmpeg','-hide_banner','-nostats','-i',str(p),
                  '-vf','blackdetect=d=0.25:pix_th=0.02','-an','-f','null','-'
              ],stdout=subprocess.DEVNULL,stderr=open(q/f"{sh['id']}_blackdetect.txt",'w'))
              report['shorts'].append({
                  'id':sh['id'],'duration':dur,'width':v.get('width'),'height':v.get('height'),
                  'fps':v.get('r_frame_rate'),'audio_streams':len(a),'decode_ok':rc==0,'technical_pass':ok
              })
          report['status']='PASS' if all(x['technical_pass'] for x in report['shorts']) else 'FAIL'
          (q/'TECHNICAL_QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS':
              raise SystemExit(report)
          PY

      - name: Upload TC497 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-tc497-review
          path: |
            /tmp/shorts_tc/out
            /tmp/shorts_tc/qc
          compression-level: 0
          retention-days: 7

  package:
    needs: [chicago, tc497]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hia-shorts-chicago-review
          path: /tmp/review/chicago

      - uses: actions/download-artifact@v4
        with:
          name: hia-shorts-tc497-review
          path: /tmp/review/tc497

      - name: Package 10-Short review archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack/HIA_SHORTS_10_REVIEW/CHICAGO /tmp/pack/HIA_SHORTS_10_REVIEW/TC497 /tmp/pack/HIA_SHORTS_10_REVIEW/QC
          cp /tmp/review/chicago/out/*.mp4 /tmp/pack/HIA_SHORTS_10_REVIEW/CHICAGO/
          cp /tmp/review/tc497/out/*.mp4 /tmp/pack/HIA_SHORTS_10_REVIEW/TC497/
          cp -r /tmp/review/chicago/qc /tmp/pack/HIA_SHORTS_10_REVIEW/QC/CHICAGO
          cp -r /tmp/review/tc497/qc /tmp/pack/HIA_SHORTS_10_REVIEW/QC/TC497
          cd /tmp/pack
          zip -q -r -0 HIA_SHORTS_10_REVIEW_PACK.zip HIA_SHORTS_10_REVIEW
          sha256sum HIA_SHORTS_10_REVIEW_PACK.zip > SHA256SUMS.txt
          ls -lh HIA_SHORTS_10_REVIEW_PACK.zip

      - name: Upload combined review pack
        uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-10-review-pack
          path: |
            /tmp/pack/HIA_SHORTS_10_REVIEW_PACK.zip
            /tmp/pack/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
