name: VIDEO006 Export 26 Genuine Tory Engineering Visuals
on:
  push:
    paths:
      - '.github/workflows/project_pluto_real_figures_export.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf
      - name: Restore government primary Tory original reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pluto_primary_reports
          gh release download project-pluto-authentic-primary-documents-20261021 --pattern 'DOC-0*.pdf' --dir pluto_primary_reports
      - name: Render 26 real report photos and pages full resolution
        run: python PROJECT_PLUTO/ARCHIVE/export_curated_primary_figures.py
      - name: Publish authentic Tory engine documentary visuals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=project-pluto-26-authentic-technical-figures-20261022
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HIA VIDEO006 — 26 actual Tory primary technical visuals" --notes "26 producer visually selected historical Tory II-C and Pluto engineering report pages/photographs/diagrams, each rendered at 2.6x, original PDF page IDs and SHA. These are not video or invented images. Verify individual reuse, accurate captions and script mapping before edit."
          gh release upload "$TAG" HIA_VIDEO006_26_GENUINE_TORY_ENGINEERING_FIGURES.zip PROJECT_PLUTO_DIRECT_REPORT_VISUALS/FIGURES_SOURCE_MANIFEST.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HIA_VIDEO006_26_Original_Engineering_Pages
          path: HIA_VIDEO006_26_GENUINE_TORY_ENGINEERING_FIGURES.zip
          if-no-files-found: warn
          retention-days: 14
