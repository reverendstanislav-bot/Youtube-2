name: Build TC497 FULL V2 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v2.yml'

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/130bfd1b-7ac4-4dbf-9bc4-6a5fe00927ac.mp3
      TRANSCRIPT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip
      V2_WORK: /tmp/tc497v2/work
      V2_PUBLIC: /tmp/tc497v2/public
      V2_EXTRA: /tmp/tc497v2/extra
      ASS_OUT: /tmp/tc497v2/overlay.ass
      BUILD_REV: 1339ecabb9dc128967a429ce4cd0e445e94ed314

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils fonts-dejavu-core unzip zip
          pip install pillow numpy

      - name: Download package, VO and transcript
        run: |
          set -euo pipefail
          rm -rf /tmp/tc497pkg /tmp/tc497tr /tmp/tc497v2
          mkdir -p /tmp/tc497pkg /tmp/tc497tr /tmp/tc497v2/work /tmp/tc497v2/public /tmp/tc497v2/extra

          curl -fL --retry 3 \
            'https://github.com/reverendstanislav-bot/Youtube-2/releases/download/tc497-codex-ready-v1/Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' \
            -o /tmp/pkg.zip
          unzip -q /tmp/pkg.zip -d /tmp/tc497pkg

          curl -fL --retry 3 "$VO_URL" -o /tmp/tc497v2/vo.mp3
          curl -fL --retry 3 "$TRANSCRIPT_URL" -o /tmp/tr.zip
          unzip -q /tmp/tr.zip -d /tmp/tc497tr

          PKG_ROOT="$(find /tmp/tc497pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          GEN_DIR="$(find "$PKG_ROOT" -type d -name FINAL_62 | head -n 1)"
          WORD="$(find /tmp/tc497tr -type f -name TC497_VO_WORD_LEVEL.csv | head -n 1)"
          test -n "$PKG_ROOT"
          test -n "$GEN_DIR"
          test -n "$WORD"

          echo "PKG_ROOT=$PKG_ROOT" >> "$GITHUB_ENV"
          echo "GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"
          echo "TRANSCRIPT_DIR=$(dirname "$WORD")" >> "$GITHUB_ENV"

      - name: Download targeted FULL V2 stills
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222237_c38091de-d222-4038-a930-299f163943f7.png' -o "$V2_EXTRA/V2_POWERTRAIN.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_cb4be4db-d792-4970-8faa-e2101780ced5.png' -o "$V2_EXTRA/V2_DISTRIBUTION.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_48fe7dc4-ba26-4692-b326-147635894a6a.png' -o "$V2_EXTRA/V2_PREDECESSOR_EARLY.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_d1d134fd-224a-4689-9ff9-9b24e8fa80a9.png' -o "$V2_EXTRA/V2_PREDECESSOR_MIL.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_66e68906-26f4-4d5b-9524-2d61cb02259a.png' -o "$V2_EXTRA/V2_STEER_FOLLOW.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_cd5eecdb-31c6-41c2-afcb-6757c6e9f7f3.png' -o "$V2_EXTRA/V2_TRACTION.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_94b48c66-3576-4731-aa02-c61c6b20893b.png' -o "$V2_EXTRA/V2_YUMA_OBSERVERS.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_f128fc7c-4ff5-478e-9148-89e57f2fc8ba.png' -o "$V2_EXTRA/V2_DUNE.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_2b1b3969-83fe-4256-a8a4-fab8d7ffbf11.png' -o "$V2_EXTRA/V2_CARGO.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_c2742a87-2ed2-4669-bf66-65543095ffb6.png' -o "$V2_EXTRA/V2_LEGACY.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_223846_82111952-45be-4ae5-bc0c-a1dcd308dd5f.png' -o "$V2_EXTRA/V2_ELECTRIC_HERO.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_223846_cb411bf3-79f4-448f-907b-93f6a8e4e289.png' -o "$V2_EXTRA/V2_NUCLEAR_CONCEPT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_225155_c256ee6d-b461-456e-94d1-c78edcd6de3a.png' -o "$V2_EXTRA/V2_CONTROL_INTERIOR.png"
          test "$(find "$V2_EXTRA" -type f -name '*.png' | wc -l)" -eq 13

      - name: Build V2 visual rhythm and captions
        run: |
          set -euo pipefail
          python TC497/FULL_V2/full_v2_build.py
          python TC497/FULL_V2/make_overlay_v2_ass.py
          cat "$V2_WORK/V2_QA.json"

      - name: Assemble locked V14 cold open plus rebuilt V2 rest
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4 \
            -t 82.6 -an -vf "fps=30,scale=960:540,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p /tmp/tc497v2/v14_picture.mp4

          printf "file '/tmp/tc497v2/v14_picture.mp4'\nfile '$V2_PUBLIC/rest_base.mp4'\n" > /tmp/tc497v2/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/tc497v2/concat.txt -c copy /tmp/tc497v2/full_base.mp4

      - name: Build continuous audio mix
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4 \
            -t 82.6 -vn -ac 2 -ar 48000 -c:a pcm_s16le /tmp/tc497v2/v14_audio.wav

          ffmpeg -y -loglevel error \
            -i /tmp/tc497v2/vo.mp3 -i "$V2_PUBLIC/rest_score.wav" \
            -filter_complex "[0:a]atrim=start=82.6:end=1236.506,asetpts=PTS-STARTPTS,aresample=48000,pan=stereo|c0=c0|c1=c0[vo];[1:a]aresample=48000[mu];[vo][mu]amix=inputs=2:duration=first:normalize=0,alimiter=limit=.92[rest]" \
            -map "[rest]" -ac 2 -ar 48000 -c:a pcm_s16le /tmp/tc497v2/rest_mix.wav

          ffmpeg -y -loglevel error \
            -i /tmp/tc497v2/v14_audio.wav -i /tmp/tc497v2/rest_mix.wav \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[a]" -map "[a]" -t 1236.506 \
            -ac 2 -ar 48000 -c:a pcm_s16le /tmp/tc497v2/full_mix.wav

      - name: Encode FULL V2 review
        run: |
          set -euo pipefail
          mkdir -p TC497/FULL_V2_OUT /tmp/tc497v2/report

          ffmpeg -y -loglevel error \
            -i /tmp/tc497v2/full_base.mp4 -i /tmp/tc497v2/full_mix.wav \
            -vf "ass=$ASS_OUT" \
            -af "loudnorm=I=-14:TP=-2:LRA=7" \
            -map 0:v -map 1:a -t 1236.506 \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart \
            TC497/FULL_V2_OUT/TC497_FULL_V2_REVIEW_960x540.mp4

          ffprobe -v error \
            -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate \
            -of json TC497/FULL_V2_OUT/TC497_FULL_V2_REVIEW_960x540.mp4 \
            > /tmp/tc497v2/report/FFPROBE.json

          ffmpeg -hide_banner -nostats \
            -i TC497/FULL_V2_OUT/TC497_FULL_V2_REVIEW_960x540.mp4 \
            -af ebur128=peak=true -f null - 2> /tmp/tc497v2/report/EBUR128.txt || true

          cp "$V2_WORK/V2_QA.json" /tmp/tc497v2/report/
          cp "$V2_PUBLIC/shots.json" /tmp/tc497v2/report/
          cp "$ASS_OUT" /tmp/tc497v2/report/overlay_v2.ass
          cp TC497/FULL_V2/README.md /tmp/tc497v2/report/
          cp TC497/FULL_V2/full_v2_build.py /tmp/tc497v2/report/
          cp TC497/FULL_V2/make_overlay_v2_ass.py /tmp/tc497v2/report/
          cp "$V2_EXTRA"/*.png /tmp/tc497v2/report/

          (cd /tmp/tc497v2/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V2_OUT/FULL_V2_REPORT.zip" .)
          (cd TC497/FULL_V2_OUT && sha256sum TC497_FULL_V2_REVIEW_960x540.mp4 FULL_V2_REPORT.zip > SHA256SUMS.txt)

          ls -lh TC497/FULL_V2_OUT/

      - name: Upload FULL V2 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v2-review
          path: |
            TC497/FULL_V2_OUT/TC497_FULL_V2_REVIEW_960x540.mp4
            TC497/FULL_V2_OUT/FULL_V2_REPORT.zip
            TC497/FULL_V2_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
