
name: Build Chicago V12 Final 1080p Upload Master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v12_final_1080p.yml'
      - 'CHICAGO/V12/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg unzip python3-pil python3-opencv python3-numpy jq zip fonts-dejavu-core

      - name: Reconstruct canonical Chicago source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/v12 /tmp/hia_brand
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/v12/remotion/src /tmp/v12/remotion/public /tmp/v12/work /tmp/v12/qc /tmp/hia_brand

          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract canonical source material
        run: |
          set -euo pipefail
          cd /tmp/chicago_src

          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_extract             "-ir!*/_V2/work/assets/*"             "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"

          test -d "$ASSETS"
          test -s "$V2"
          test -s "$SRT"
          test -s "$WORDS"

          {
            echo "ASSETS=$ASSETS"
            echo "V2=$V2"
            echo "SRT=$SRT"
            echo "WORDS=$WORDS"
          } >> "$GITHUB_ENV"

      - name: Build final clean HIA end screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/hia_brand
          gh release download chicago-channel-brand-assets-extracted-20260920             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'
          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip

          BASE="$(find . -type f -name '07_generic_reusable_thumbnail_base.png' | head -n1)"
          test -s "$BASE"

          python3 - "$BASE" <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import sys
          from pathlib import Path

          src=Image.open(sys.argv[1]).convert('RGB')
          assert src.size==(1920,1080), src.size

          im=Image.blend(src,Image.new('RGB',src.size,(0,0,0)),0.15)
          d=ImageDraw.Draw(im)

          PAPER=(230,221,200)
          IVORY=(243,235,221)
          RUST=(165,82,53)
          INK=(18,20,21)

          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          f_title=ImageFont.truetype(bold,54)
          f_tag=ImageFont.truetype(reg,29)
          f_label=ImageFont.truetype(bold,27)
          f_small=ImageFont.truetype(reg,21)

          # Channel identity.
          x=105; y=88
          d.rectangle([x,y,x+70,y+6],fill=RUST)
          d.text((x+92,y-28),'HIDDEN INDUSTRIAL AMERICA',
                 font=f_title,fill=IVORY,stroke_width=2,stroke_fill=INK)
          d.text((x+92,y+58),'THE INFRASTRUCTURE REMAINS',
                 font=f_tag,fill=PAPER,stroke_width=1,stroke_fill=INK)

          # Exactly one Previous Story / previous-video target.
          rx1,ry1,rx2,ry2=185,350,1015,817
          d.rounded_rectangle([rx1,ry1,rx2,ry2],radius=6,
                              fill=(22,25,27),outline=PAPER,width=5)
          d.line([rx1,ry1,rx1+155,ry1],fill=RUST,width=7)
          d.text((rx1,ry1-58),'PREVIOUS STORY',
                 font=f_label,fill=RUST,stroke_width=1,stroke_fill=INK)
          d.text((rx1,ry2+24),'CONTINUE EXPLORING HIDDEN INDUSTRIAL AMERICA',
                 font=f_small,fill=PAPER,stroke_width=1,stroke_fill=INK)

          # Exactly one Subscribe/avatar target.
          cx,cy,r=1425,590,145
          d.ellipse([cx-r,cy-r,cx+r,cy+r],
                    fill=(18,21,23),outline=PAPER,width=5)
          d.arc([cx-r-9,cy-r-9,cx+r+9,cy+r+9],
                start=208,end=325,fill=RUST,width=6)

          label='SUBSCRIBE'
          bb=d.textbbox((0,0),label,font=f_label)
          tw=bb[2]-bb[0]
          d.text((cx-tw/2,cy+r+38),label,
                 font=f_label,fill=RUST,stroke_width=1,stroke_fill=INK)

          label2='HIDDEN INDUSTRIAL AMERICA'
          bb=d.textbbox((0,0),label2,font=f_small)
          tw=bb[2]-bb[0]
          d.text((cx-tw/2,cy+r+82),label2,
                 font=f_small,fill=PAPER,stroke_width=1,stroke_fill=INK)

          # IMPORTANT: no technical labels such as "YOUTUBE END SCREEN".
          out=Path('/tmp/v12/remotion/public/end_screen_final_1920.png')
          im.save(out,compress_level=6)
          im.resize((960,540),Image.Resampling.LANCZOS).save('/tmp/v12/qc/END_SCREEN_FINAL_PREVIEW.jpg',quality=92)
          PY

      - name: Validate final end screen and V12 rules
        run: |
          set -euo pipefail
          test -s /tmp/v12/remotion/public/end_screen_final_1920.png

          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/src/index.jsx
          ! grep -q 'WATCH NEXT' CHICAGO/V12/src/index.jsx
          ! grep -q 'CONTINUE EXPLORING' CHICAGO/V12/src/index.jsx
          ! grep -q 'AI RECONSTRUCTION' CHICAGO/V12/prepare_remotion_data.py

          grep -q 'END_START=1268.0' CHICAGO/V12/src/index.jsx
          grep -q "width={1920} height={1080}" CHICAGO/V12/src/index.jsx
          grep -q "if(t>=END_START)return null" CHICAGO/V12/src/index.jsx

          python3 - <<'PY'
          from PIL import Image
          p='/tmp/v12/remotion/public/end_screen_final_1920.png'
          im=Image.open(p)
          assert im.size==(1920,1080), im.size
          PY

      - name: Install Remotion
        run: |
          set -euo pipefail
          cp CHICAGO/V12/src/index.jsx /tmp/v12/remotion/src/index.jsx
          cp CHICAGO/V12/package.json /tmp/v12/remotion/package.json
          cd /tmp/v12/remotion
          npm install --no-audit --no-fund

      - name: Build native 1920x1080 picture track
        run: |
          set -euo pipefail
          python3 CHICAGO/V12/build_picture_1080.py             --v3-builder CHICAGO/V3/build_v3_picture.py             --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json             --assets-root "$ASSETS"             --work /tmp/v12/work/picture             --output-video /tmp/v12/remotion/public/base.mp4             --plan-out /tmp/v12/work/V12_SHOTS.json

          ffprobe -v error -select_streams v:0             -show_entries stream=width,height,r_frame_rate             -of json /tmp/v12/remotion/public/base.mp4 > /tmp/v12/qc/BASE_FFPROBE.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v12/qc/BASE_FFPROBE.json'))
          s=d['streams'][0]
          assert s['width']==1920 and s['height']==1080
          assert s['r_frame_rate']=='25/1'
          PY

      - name: Prepare final captions and overlays
        run: |
          set -euo pipefail
          python3 CHICAGO/V12/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan /tmp/v12/work/V12_SHOTS.json             --captions-out /tmp/v12/remotion/public/captions.json             --overlays-out /tmp/v12/remotion/public/overlays.json             --report /tmp/v12/qc/REMOTION_DATA_REPORT.json

          ! grep -q 'AI RECONSTRUCTION' /tmp/v12/remotion/public/overlays.json

      - name: Extract and verify original AAC
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/v12/work/original.aac
          AH="$(sha256sum /tmp/v12/work/original.aac | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          test "$AH" = "$EXPECTED"
          echo "$AH  original.aac" > /tmp/v12/qc/AUDIO_SHA256.txt

      - name: Render preflight stills at 1080p
        working-directory: /tmp/v12/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/v12/qc/stills

          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/01_opening.png --frame=75
          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/02_mid.png --frame=16000
          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/03_before_outro.png --frame=31690
          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/04_outro_start.png --frame=31720
          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/05_outro_middle.png --frame=32000
          npx remotion still src/index.jsx ChicagoV12 /tmp/v12/qc/stills/06_outro_final.png --frame=32240

      - name: Render final 1920x1080 master
        working-directory: /tmp/v12/remotion
        run: |
          set -euo pipefail
          mkdir -p out

          npx remotion render src/index.jsx ChicagoV12 out/final_video.mp4             --codec=h264             --crf=17             --pixel-format=yuv420p             --concurrency=4

      - name: Mux original AAC
        run: |
          set -euo pipefail
          OUT=/tmp/v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4

          ffmpeg -y -hide_banner -loglevel error             -i /tmp/v12/remotion/out/final_video.mp4             -i /tmp/v12/work/original.aac             -map 0:v:0 -map 1:a:0             -c:v copy -c:a copy             -movflags +faststart             "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Final upload-master QC
        run: |
          set -euo pipefail
          Q=/tmp/v12/qc

          ffmpeg -v error -xerror -i "$OUT"             -map 0:v:0 -map 0:a:0 -f null -             2> "$Q/DECODE_ERRORS.txt"
          test ! -s "$Q/DECODE_ERRORS.txt"

          ffprobe -v error -show_streams -show_format -of json "$OUT" > "$Q/FINAL_FFPROBE.json"

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v12/qc/FINAL_FFPROBE.json'))
          v=[x for x in d['streams'] if x['codec_type']=='video'][0]
          a=[x for x in d['streams'] if x['codec_type']=='audio'][0]
          assert v['width']==1920 and v['height']==1080
          assert v['r_frame_rate']=='25/1'
          dur=float(d['format']['duration'])
          assert abs(dur-1290.720)<0.20, dur
          print('VIDEO',v['codec_name'],v['width'],v['height'],v['r_frame_rate'])
          print('AUDIO',a['codec_name'],a.get('sample_rate'),a.get('channels'))
          print('DURATION',dur)
          PY

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts "$Q/final.aac"
          FH="$(sha256sum "$Q/final.aac" | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          test "$FH" = "$EXPECTED"
          echo "$FH  final.aac" > "$Q/FINAL_AUDIO_SHA256.txt"

          ffmpeg -hide_banner -nostats -i "$OUT"             -vf "blackdetect=d=0.08:pix_th=0.10:pic_th=0.98"             -an -f null - 2> "$Q/BLACKDETECT.log" || true

          sha256sum "$OUT" > "$Q/VIDEO_SHA256.txt"

          python3 - <<'PY'
          from pathlib import Path
          q=Path('/tmp/v12/qc')
          black=(q/'BLACKDETECT.log').read_text(errors='replace').count('black_start:')
          ff=(q/'FINAL_FFPROBE.json').read_text()
          sha=(q/'VIDEO_SHA256.txt').read_text().strip()
          audio=(q/'FINAL_AUDIO_SHA256.txt').read_text().strip()
          text='\n'.join([
            '# Hidden Industrial America — Chicago FINAL 1080p QC','',
            '- Resolution: **1920×1080 native render**.',
            '- Frame rate: **25 fps**.',
            '- Outro begins at **21:08.000**.',
            '- Running captions after outro start: **disabled in renderer**.',
            '- End screen: **1 Previous Story slot + 1 Subscribe/avatar circle**.',
            '- Technical label YOUTUBE END SCREEN: **absent**.',
            '- AI RECONSTRUCTION: **absent**.',
            '- Provenance before outro: **HISTORICAL SOURCE only**.',
            '- Original AAC: **bit-identical**.',
            '- Full decode: **PASS**.',
            f'- blackdetect events: **{black}**.','',
            'Video SHA-256:',
            sha,'',
            'Audio SHA-256:',
            audio
          ])
          (q/'FINAL_QC.md').write_text(text+'\n',encoding='utf-8')
          PY

      - name: Package final QC
        run: |
          set -euo pipefail
          cd /tmp/v12
          zip -q -r HIA_CHICAGO_FINAL_1080P_QC.zip qc
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt

      - name: Publish final upload master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-final-upload-master-1080p-20260922
          BODY='Final YouTube upload master. Native 1920x1080/25fps render from canonical source assets. Final end screen contains one Previous Story target and one Subscribe/avatar target, with no technical YOUTUBE END SCREEN label and no running captions after 21:08. Original AAC preserved bit-for-bit. Full decode QC passed.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG"               "$OUT"               /tmp/v12/HIA_CHICAGO_FINAL_1080P_QC.zip               /tmp/v12/SHA256SUMS.txt               --clobber               --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG"               "$OUT"               /tmp/v12/HIA_CHICAGO_FINAL_1080P_QC.zip               /tmp/v12/SHA256SUMS.txt               --title 'Hidden Industrial America — Chicago Final Upload Master 1080p'               --notes "$BODY"               --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record final status in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V12/FINAL_QC
          cp /tmp/v12/qc/FINAL_QC.md CHICAGO/V12/FINAL_QC/
          cp /tmp/v12/qc/VIDEO_SHA256.txt CHICAGO/V12/FINAL_QC/
          cp /tmp/v12/qc/FINAL_AUDIO_SHA256.txt CHICAGO/V12/FINAL_QC/
          cp /tmp/v12/qc/REMOTION_DATA_REPORT.json CHICAGO/V12/FINAL_QC/
          cp /tmp/v12/qc/END_SCREEN_FINAL_PREVIEW.jpg CHICAGO/V12/FINAL_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V12/FINAL_QC
          if ! git diff --cached --quiet; then
            git commit -m "Record Chicago final 1080p upload master QC"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-final-upload-master-1080p
          path: |
            /tmp/v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4
            /tmp/v12/qc
          retention-days: 14
