name: Build Chicago V12 Final 1080 Upload Master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v12_final_1080.yml'
      - 'CHICAGO/V12/**'

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil jq zip fonts-dejavu-core

      - name: Download canonical source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v12 /tmp/hia_brand
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v12/remotion/src /tmp/chicago_v12/remotion/public /tmp/chicago_v12/work /tmp/chicago_v12/qc /tmp/hia_brand

          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract canonical project assets
        run: |
          set -euo pipefail
          cd /tmp/chicago_src

          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_extract \
            "-ir!*/_V2/work/assets/*" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.srt" \
            "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"

          test -d "$ASSETS"
          test -s "$V2"
          test -s "$SRT"
          test -s "$WORDS"

          {
            echo "ASSETS=$ASSETS"
            echo "V2=$V2"
            echo "SRT=$SRT"
            echo "WORDS=$WORDS"
          } >> "$GITHUB_ENV"

      - name: Download canonical HIA branding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/hia_brand

          gh release download chicago-channel-brand-assets-extracted-20260920 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'

          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip -d extracted
          ROOT="$(find extracted -type d -name 'Hidden_Industrial_America_7_Brand_Assets' | head -n1)"
          BASE="$ROOT/07_generic_reusable_thumbnail_base.png"

          test -s "$BASE"

          python3 "$GITHUB_WORKSPACE/CHICAGO/V12/build_final_end_screen.py" \
            --base "$BASE" \
            --output /tmp/chicago_v12/remotion/public/end_screen_1080.png

          test -s /tmp/chicago_v12/remotion/public/end_screen_1080.png

          # Final user-requested cleanup: no technical marker anywhere.
          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/build_final_end_screen.py
          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/src/index.jsx

      - name: Build clean 1920x1080 picture track from original assets
        run: |
          set -euo pipefail

          python3 CHICAGO/V12/build_picture_1080.py \
            --v3-builder CHICAGO/V3/build_v3_picture.py \
            --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json \
            --assets-root "$ASSETS" \
            --work /tmp/chicago_v12/work/picture \
            --output-video /tmp/chicago_v12/remotion/public/base_1080.mp4 \
            --plan-out /tmp/chicago_v12/work/V12_SHOTS.json

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=nw=1 /tmp/chicago_v12/remotion/public/base_1080.mp4 | tee /tmp/chicago_v12/qc/BASE_1080_PROBE.txt

          grep -q '^width=1920$' /tmp/chicago_v12/qc/BASE_1080_PROBE.txt
          grep -q '^height=1080$' /tmp/chicago_v12/qc/BASE_1080_PROBE.txt
          grep -q '^r_frame_rate=25/1$' /tmp/chicago_v12/qc/BASE_1080_PROBE.txt

      - name: Prepare final captions and overlays
        run: |
          set -euo pipefail

          python3 CHICAGO/V12/prepare_remotion_data.py \
            --srt "$SRT" \
            --words "$WORDS" \
            --plan /tmp/chicago_v12/work/V12_SHOTS.json \
            --captions-out /tmp/chicago_v12/remotion/public/captions.json \
            --overlays-out /tmp/chicago_v12/remotion/public/overlays.json \
            --report /tmp/chicago_v12/qc/REMOTION_DATA_REPORT.json

          ! grep -q 'AI RECONSTRUCTION' /tmp/chicago_v12/remotion/public/overlays.json

          cp CHICAGO/V12/src/index.jsx /tmp/chicago_v12/remotion/src/index.jsx
          cp CHICAGO/V12/package.json /tmp/chicago_v12/remotion/package.json

      - name: Validate final 1080 renderer rules
        run: |
          set -euo pipefail

          grep -q 'width={1920} height={1080}' CHICAGO/V12/src/index.jsx
          grep -q 'const END_START=1268.0' CHICAGO/V12/src/index.jsx
          grep -q 'if(t>=END_START)return null' CHICAGO/V12/src/index.jsx
          grep -q "transform:'scale(2)'" CHICAGO/V12/src/index.jsx
          grep -q 'end_screen_1080.png' CHICAGO/V12/src/index.jsx

          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/src/index.jsx
          ! grep -q 'AI RECONSTRUCTION' CHICAGO/V12/prepare_remotion_data.py

          echo "V12 FINAL RULES PASS"

      - name: Install Remotion
        working-directory: /tmp/chicago_v12/remotion
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Render final visual checkpoints
        working-directory: /tmp/chicago_v12/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v12/qc/stills

          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/01_opening.png --frame=75
          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/02_light_chapter.png --frame=4000
          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/03_mid.png --frame=16000
          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/04_pre_outro.png --frame=31690
          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/05_outro.png --frame=31850
          npx remotion still src/index.jsx ChicagoV12 /tmp/chicago_v12/qc/stills/06_outro_final.png --frame=32200

      - name: Render true 1920x1080 final video
        working-directory: /tmp/chicago_v12/remotion
        run: |
          set -euo pipefail
          mkdir -p out

          npx remotion render src/index.jsx ChicagoV12 out/final_video_only.mp4 \
            --codec=h264 \
            --crf=17 \
            --pixel-format=yuv420p \
            --concurrency=4

      - name: Preserve original approved AAC and mux upload master
        run: |
          set -euo pipefail

          ffmpeg -y -loglevel error \
            -i "$V2" -map 0:a:0 -c copy -f adts \
            /tmp/chicago_v12/work/original.aac

          AH="$(sha256sum /tmp/chicago_v12/work/original.aac | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          test "$AH" = "$EXPECTED"
          echo "$AH  original.aac" > /tmp/chicago_v12/qc/AUDIO_SOURCE_SHA256.txt

          OUT=/tmp/chicago_v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4

          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/chicago_v12/remotion/out/final_video_only.mp4 \
            -i /tmp/chicago_v12/work/original.aac \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a copy \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -movflags +faststart \
            "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Final upload-master QC
        run: |
          set -euo pipefail
          Q=/tmp/chicago_v12/qc

          ffprobe -v error -show_streams -show_format -of json "$OUT" > "$Q/FINAL_FFPROBE.json"

          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$OUT")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$OUT")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$OUT")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$OUT")"
          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"

          {
            echo "width=$WIDTH"
            echo "height=$HEIGHT"
            echo "fps=$FPS"
            echo "frames=$FRAMES"
            echo "duration=$DUR"
          } | tee "$Q/FINAL_MEDIA_SUMMARY.txt"

          test "$WIDTH" = "1920"
          test "$HEIGHT" = "1080"
          test "$FPS" = "25/1"

          python3 - "$FRAMES" "$DUR" <<'PY'
          import sys
          f=int(sys.argv[1]); d=float(sys.argv[2])
          assert f == 32268, f
          assert abs(d-1290.720) < 0.20, d
          PY

          # Full stream decode.
          ffmpeg -v error -xerror -i "$OUT" \
            -map 0:v:0 -map 0:a:0 -f null - \
            2> "$Q/FINAL_DECODE_ERRORS.txt"

          test ! -s "$Q/FINAL_DECODE_ERRORS.txt"

          # Audio elementary stream must remain exactly approved.
          ffmpeg -y -loglevel error -i "$OUT" \
            -map 0:a:0 -c copy -f adts "$Q/final.aac"

          FH="$(sha256sum "$Q/final.aac" | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          test "$FH" = "$EXPECTED"
          echo "$FH  final.aac" > "$Q/FINAL_AUDIO_SHA256.txt"

          # No technical/instructional marker in source or generated end-screen builder.
          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/build_final_end_screen.py
          ! grep -q 'YOUTUBE END SCREEN' CHICAGO/V12/src/index.jsx

          # Outro captions are impossible by source rule from 21:08 onward.
          grep -q 'if(t>=END_START)return null' CHICAGO/V12/src/index.jsx

          # Decode and save final outro checkpoints.
          ffmpeg -y -hide_banner -loglevel error -ss 1268 -i "$OUT" -frames:v 1 "$Q/OUTRO_2108.jpg"
          ffmpeg -y -hide_banner -loglevel error -ss 1278 -i "$OUT" -frames:v 1 "$Q/OUTRO_2118.jpg"
          ffmpeg -y -hide_banner -loglevel error -ss 1289 -i "$OUT" -frames:v 1 "$Q/OUTRO_2129.jpg"

          sha256sum "$OUT" > "$Q/FINAL_VIDEO_SHA256.txt"

      - name: Build final delivery report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          q=Path('/tmp/chicago_v12/qc')
          media=(q/'FINAL_MEDIA_SUMMARY.txt').read_text().strip()
          vh=(q/'FINAL_VIDEO_SHA256.txt').read_text().split()[0]
          ah=(q/'FINAL_AUDIO_SHA256.txt').read_text().split()[0]
          txt=f"""# Hidden Industrial America — Chicago FINAL upload master

- Resolution: **1920x1080**
- Frame rate: **25 fps**
- Runtime: **21:30.720**
- Video: H.264 / yuv420p / CRF 17 final render
- Color metadata: BT.709
- Audio: original approved AAC, preserved **bit-for-bit**
- Running captions after 21:08: **NONE**
- End screen: **1 Previous Story slot + 1 Subscribe/avatar circle**
- Technical text `YOUTUBE END SCREEN`: **REMOVED**
- Full decode: **PASS**
- Video SHA-256: `{vh}`
- Audio elementary-stream SHA-256: `{ah}`

## ffprobe summary

```
{media}
```

Status: **FINAL UPLOAD MASTER**
"""
          (q/'FINAL_DELIVERY_REPORT.md').write_text(txt,encoding='utf-8')
          PY

      - name: Package final sidecar and QC
        run: |
          set -euo pipefail

          cp "$SRT" /tmp/chicago_v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER.srt
          cd /tmp/chicago_v12
          zip -q -r HIA_CHICAGO_FINAL_QC.zip qc

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chicago_v12

          TAG=chicago-final-upload-master-20260922
          BODY='FINAL upload master for Hidden Industrial America — Chicago. True 1920x1080/25fps render rebuilt from original project assets, approved V7/V9 editorial system, final V11 one-video + Subscribe outro, with the technical YOUTUBE END SCREEN text removed. Running captions are disabled from 21:08 onward. Original approved AAC is preserved bit-for-bit. Full decode and media QC passed.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG" \
              HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4 \
              HIA_CHICAGO_FINAL_UPLOAD_MASTER.srt \
              HIA_CHICAGO_FINAL_QC.zip \
              --clobber \
              --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG" \
              HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4 \
              HIA_CHICAGO_FINAL_UPLOAD_MASTER.srt \
              HIA_CHICAGO_FINAL_QC.zip \
              --title 'HIA Chicago — FINAL Upload Master 1920x1080' \
              --notes "$BODY" \
              --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record final status in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/FINAL
          cp /tmp/chicago_v12/qc/FINAL_DELIVERY_REPORT.md CHICAGO/FINAL/
          cp /tmp/chicago_v12/qc/FINAL_VIDEO_SHA256.txt CHICAGO/FINAL/
          cp /tmp/chicago_v12/qc/FINAL_AUDIO_SHA256.txt CHICAGO/FINAL/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/FINAL

          if ! git diff --cached --quiet; then
            git commit -m "Lock Chicago final 1080 upload master"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-final-upload-master-1080
          path: |
            /tmp/chicago_v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER_1920x1080.mp4
            /tmp/chicago_v12/HIA_CHICAGO_FINAL_UPLOAD_MASTER.srt
            /tmp/chicago_v12/qc
          retention-days: 14
