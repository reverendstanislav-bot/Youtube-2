name: Build TC497 S01 V9 Semantic Static Proof

on:
  push:
    paths:
      - '.github/workflows/build_tc497_s01_v7_clean_proof.yml'
      - 'SHORTS_RENDER/build_clean_asset_proof.py'
      - 'TC497/SHORTS/TC497-S01_V7_CLEAN_ASSET_PROOF.json'
      - 'TC497/FULL_V13/asset_urls.json'
      - 'TC497/SHORTS/shorts_extraction_map.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tc497-s01-v9-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3 python3-pil fonts-dejavu-core
          python3 -m py_compile SHORTS_RENDER/build_clean_asset_proof.py
          mkdir -p /tmp/proof/{assets,qc}

      - name: Download clean TC497 visual assets
        run: |
          set -euo pipefail
          MAN=TC497/FULL_V13/asset_urls.json
          for name in V3_YUMA_TEST.png V3_ASSEMBLY.png V2_POWERTRAIN.png V3_TOPDOWN.png V2_YUMA_OBSERVERS.png V3_WHEEL_MOTION.png V2_TRACTION.png V3_CARGOLOAD.png V3_CREW.png V2_DUNE.png V3_DUNE_LIMIT.png; do
            url="$(jq -r --arg n "$name" '.v4_extra[$n] // empty' "$MAN")"
            test -n "$url" || { echo "missing url for $name" >&2; exit 1; }
            curl -fL --retry 4 --retry-all-errors "$url" -o "/tmp/proof/assets/$name"
            test -s "/tmp/proof/assets/$name"
          done
          file /tmp/proof/assets/*

      - name: Download locked TC497 R14 audio source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/proof
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 source.mp4

      - name: Render V9 semantic static proof
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_clean_asset_proof.py             --plan TC497/SHORTS/TC497-S01_V7_CLEAN_ASSET_PROOF.json             --map TC497/SHORTS/shorts_extraction_map.json             --asset-dir /tmp/proof/assets             --audio-source /tmp/proof/source.mp4             --out /tmp/proof/TC497-S01_V9_SEMANTIC_STATIC_PROOF.mp4             --qc /tmp/proof/qc

      - name: Technical QC and contact sheet
        run: |
          set -euo pipefail
          P=/tmp/proof/TC497-S01_V9_SEMANTIC_STATIC_PROOF.mp4
          ffmpeg -v error -xerror -i "$P" -f null - 2>/tmp/proof/qc/decode.txt
          test ! -s /tmp/proof/qc/decode.txt
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          p=Path('/tmp/proof/TC497-S01_V9_SEMANTIC_STATIC_PROOF.mp4'); q=Path('/tmp/proof/qc')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)]))
          times=[dur*x for x in [.02,.08,.16,.24,.32,.40,.50,.60,.70,.80,.90,.98]]
          frames=[]; font=ImageFont.load_default()
          for i,t in enumerate(times):
            jpg=q/f'f{i+1:02d}.jpg'
            subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
            frames.append((t,Image.open(jpg).convert('RGB').copy()))
          canvas=Image.new('RGB',(1080*4,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas)
          for i,(t,im) in enumerate(frames):
            x=(i%4)*1080; y=(i//4)*1920; canvas.paste(im,(x,y))
            d.rectangle((x,y,x+260,y+42),fill=(10,10,10)); d.text((x+8,y+12),f'{t:.1f}s',fill=(245,245,245),font=font)
          canvas.thumbnail((2160,2880)); canvas.save(q/'CONTACT.jpg',quality=92)
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          (q/'FFPROBE.json').write_text(json.dumps(info,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tc497-s01-v9-semantic-static-proof
          path: |
            /tmp/proof/TC497-S01_V9_SEMANTIC_STATIC_PROOF.mp4
            /tmp/proof/qc
          compression-level: 0
          retention-days: 7
