name: Build TC497 FULL V13 Fast Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v13_fast.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-v13-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSCRIPT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils unzip zip fonts-dejavu-core

      - name: Download prior clean V13 success
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v13-review
          path: /tmp/oldv13
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35475278860
          github-token: ${{ github.token }}

      - name: Download V4 overlay source
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Download CODEX package
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Prepare workspace, transcript and assets
        run: |
          set -euo pipefail
          rm -rf /tmp/v13fast /tmp/pkg
          mkdir -p /tmp/v13fast/{remotion/src,remotion/public,extra,coldwork,v4report,report/screens} /tmp/pkg TC497/FULL_V13_FAST_OUT

          test -s /tmp/oldv13/TC497_FULL_V13_REVIEW_960x540.mp4
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v13fast/v4report
          test -s /tmp/v13fast/v4report/overlay_v4.ass

          PKG_ZIP="$(find /tmp/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n 1)"
          test -n "$PKG_ZIP"
          unzip -q "$PKG_ZIP" -d /tmp/pkg
          PKG_ROOT="$(find /tmp/pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          GEN_DIR="$(find "$PKG_ROOT" -type d -name FINAL_62 | head -n 1)"
          test -n "$GEN_DIR"
          echo "PKG_ROOT=$PKG_ROOT" >> "$GITHUB_ENV"
          echo "GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"

          curl -fL --retry 4 --retry-all-errors "$TRANSCRIPT_URL" -o /tmp/v13fast/transcript.zip
          unzip -q /tmp/v13fast/transcript.zip -d /tmp/v13fast/transcript
          WORD="$(find /tmp/v13fast/transcript -type f -name TC497_VO_WORD_LEVEL.csv | head -n 1)"
          test -n "$WORD"
          echo "WORD_CSV=$WORD" >> "$GITHUB_ENV"

          cp "$GEN_DIR/ST-ELECTRIC.png" /tmp/v13fast/st_electric.png
          test -s /tmp/v13fast/st_electric.png

      - name: Build current orange-only cold open without WA-09
        run: |
          set -euo pipefail
          export V14_EXTRA=/tmp/v13fast/extra
          export V14_PUBLIC=/tmp/v13fast/remotion/public
          export V14_WORK=/tmp/v13fast/coldwork

          cp TC497/V14/assets/INTRO_DETAIL.png "$V14_EXTRA/INTRO_DETAIL.png"
          cp TC497/V14/assets/INTRO_OBSERVERS.png "$V14_EXTRA/INTRO_OBSERVERS.png"
          cp TC497/V14/assets/INTRO_REVEAL.png "$V14_EXTRA/INTRO_REVEAL.png"

          unzip -p TC497/V14/TC497_V14_REMOTION_REPORT.zip captions.json > /tmp/v13fast/remotion/public/captions.json
          ffmpeg -y -loglevel error -i /tmp/oldv13/TC497_FULL_V13_REVIEW_960x540.mp4             -t 82.6 -vn -ac 2 -ar 48000 -c:a pcm_s16le /tmp/v13fast/remotion/public/mix.wav

          python3 TC497/FULL_V13/prep_v13_cold.py
          ! grep -q 'WA-09' /tmp/v13fast/coldwork/V14_EDIT_DECISIONS.csv

          cp TC497/FULL_V13/index_v13.jsx /tmp/v13fast/remotion/src/index.jsx
          cp TC497/V14/package.json /tmp/v13fast/remotion/package.json
          (cd /tmp/v13fast/remotion && npm install --no-audit --no-fund)
          (cd /tmp/v13fast/remotion && npx remotion render src/index.jsx TC497V14 out.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p)

          ffmpeg -y -loglevel error -i /tmp/v13fast/remotion/out.mp4 -t 82.6 -an             -c:v libx264 -preset ultrafast -crf 19 -pix_fmt yuv420p             /tmp/v13fast/cold.mp4

      - name: Build current orange-running ASS
        run: |
          set -euo pipefail
          python3 TC497/FULL_V13/make_orange_running_ass.py             --words "$WORD_CSV"             --source-ass /tmp/v13fast/v4report/overlay_v4.ass             --output /tmp/v13fast/v13.ass

          ! grep -q 'CapV10' /tmp/v13fast/v13.ass
          ! grep -q 'BorderStyle=3' /tmp/v13fast/v13.ass
          grep -q '&H003A8AF2&' /tmp/v13fast/v13.ass
          grep -q '&H003D6FB9&' /tmp/v13fast/v13.ass

      - name: Re-render post-cold-open captions and purge rejected wheel-break
        run: |
          set -euo pipefail

          ffmpeg -y -loglevel error             -ss 82.6 -i /tmp/oldv13/TC497_FULL_V13_REVIEW_960x540.mp4             -loop 1 -framerate 30 -i /tmp/v13fast/st_electric.png             -filter_complex "               [0:v]setpts=PTS+82.6/TB[base];               [1:v]crop=iw*0.72:ih*0.72:iw*0.14:ih*0.14,scale=960:540:force_original_aspect_ratio=increase,crop=960:540,setpts=PTS-STARTPTS+230.014/TB[elec];               [base][elec]overlay=0:0:eof_action=pass:enable='between(t,230.014,237.342)'[v1];               [v1]ass=/tmp/v13fast/v13.ass,setpts=PTS-82.6/TB,format=yuv420p[vout]"             -map "[vout]" -an -t 1153.933333 -r 30             -c:v libx264 -preset ultrafast -crf 19 -pix_fmt yuv420p             /tmp/v13fast/rest.mp4

      - name: Assemble V13 fast review and preserve audio
        run: |
          set -euo pipefail
          printf "file '/tmp/v13fast/cold.mp4'
file '/tmp/v13fast/rest.mp4'
" > /tmp/v13fast/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/v13fast/concat.txt -c copy /tmp/v13fast/video.mp4

          ffmpeg -y -loglevel error             -i /tmp/v13fast/video.mp4             -i /tmp/oldv13/TC497_FULL_V13_REVIEW_960x540.mp4             -map 0:v:0 -map 1:a:0 -c copy -t 1236.533333 -movflags +faststart             TC497/FULL_V13_FAST_OUT/TC497_FULL_V13_REVIEW_960x540.mp4

      - name: QC
        run: |
          set -euo pipefail
          OUT=TC497/FULL_V13_FAST_OUT/TC497_FULL_V13_REVIEW_960x540.mp4

          ffprobe -v error -count_frames             -show_entries stream=index,codec_name,width,height,r_frame_rate,duration,nb_read_frames:format=duration,size,bit_rate             -of json "$OUT" > /tmp/v13fast/report/FFPROBE.json

          for t in 60 61 62 63 64 65 90 92 200 218 232 234 236 238 262 298 475 717 724 770 817 1024 1058 1083 1110 1212 1228 1235; do
            ffmpeg -y -loglevel error -ss "$t" -i "$OUT" -frames:v 1 "/tmp/v13fast/report/screens/frame_${t}.jpg"
          done

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = "960"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = "540"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$OUT")" = "30/1"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$OUT")"
          test "$FRAMES" = "37096"

          cat > /tmp/v13fast/report/V13_FAST_QC.md <<'EOF'
          FULL_V13 review only.

          - cold-open WA-09 removed;
          - current cold-open subtitles are muted orange + bright active orange;
          - post-cold-open running captions are over-burned in the same geometry, replacing the old ivory appearance;
          - rejected V6 electric wheel-break interval 230.014–237.342 is replaced with ST-ELECTRIC;
          - no black caption rectangle;
          - no CapV10 layer;
          - picture edit otherwise inherits the successful clean FULL_V13 review.
          EOF

          cp /tmp/v13fast/v13.ass /tmp/v13fast/report/
          cp TC497/FULL_V13/EDIT_PLAN.md /tmp/v13fast/report/
          (cd /tmp/v13fast/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V13_FAST_OUT/FULL_V13_REPORT.zip" .)
          (cd TC497/FULL_V13_FAST_OUT && sha256sum TC497_FULL_V13_REVIEW_960x540.mp4 FULL_V13_REPORT.zip > SHA256SUMS.txt)

      - name: Upload V13 fast review
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v13-review-fast
          path: |
            TC497/FULL_V13_FAST_OUT/TC497_FULL_V13_REVIEW_960x540.mp4
            TC497/FULL_V13_FAST_OUT/FULL_V13_REPORT.zip
            TC497/FULL_V13_FAST_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
# trigger fast V13 review
