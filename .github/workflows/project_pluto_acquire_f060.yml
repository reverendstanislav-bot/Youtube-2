name: Project Pluto Third Wave — DoD Test Railway Film
on:
  push:
    paths:
      - '.github/workflows/project_pluto_acquire_f060.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install requests pillow
      - name: Fetch actual Department of Defense test-rail film via Internet Archive
        run: python PROJECT_PLUTO/ARCHIVE/acquire_f060_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: Project_Pluto_F060_Space_Age_Railroad_Source_Original
          path: archive_f060/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish access to original and source QC for next production stages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="project-pluto-archive-f060-space-age-railroad-20261021"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "HIA Pluto — authentic 1969 DoD rail-test context film" --notes "Authentic 1969 Space Age Railroad / Holloman AFB USDoD film. This is NOT Project Pluto Nevada reactor testing. Original and SHA256 supplied for technical source provenance."
          gh release upload "$TAG" archive_f060/* --clobber
