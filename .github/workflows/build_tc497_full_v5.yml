name: Build TC497 FULL V5 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v5.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-v5:
    env:
      BUILD_REV: 1789792774608
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip
          pip install numpy

      - name: Download accepted FULL V4 artifact
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Prepare V4 report and VO
        env:
          VO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/130bfd1b-7ac4-4dbf-9bc4-6a5fe00927ac.mp3
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/v5cfg/music /tmp/v5cfg/replacements /tmp/v5report
          test -s /tmp/v4artifact/TC497_FULL_V4_REVIEW_960x540.mp4
          test -s /tmp/v4artifact/FULL_V4_REPORT.zip
          unzip -q /tmp/v4artifact/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/shots.json
          test -s /tmp/v4report/ORIGINAL_UNDERSCORE.wav
          curl -fL --retry 3 "$VO_URL" -o /tmp/v5_vo.mp3
          test -s /tmp/v5_vo.mp3

      - name: Download clean V5 visual replacements
        run: |
          set -euo pipefail
          # Existing clean V4 concept / helicopter / survivor stills.
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_ef53745c-7d9b-40d7-9375-c3c27c19b958.png'             -o /tmp/v5cfg/replacements/nuclear_concept_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_d5259b58-486d-4be2-a84e-06ebc8f1db72.png'             -o /tmp/v5cfg/replacements/heavy_lift_logistics_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_a47863ca-4a61-4e9e-9baf-812785b182df.png'             -o /tmp/v5cfg/replacements/survivor_detail_clean.png

          # Unique V5 images generated specifically for the second concept / sky beats.
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_83c46c89-d5da-4679-b0b5-e7040f256687.png'             -o /tmp/v5cfg/replacements/nuclear_unbuilt_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_f0ef4a51-417a-4aa3-8497-f376988c719b.png'             -o /tmp/v5cfg/replacements/ground_vs_air_clean.png

          test "$(find /tmp/v5cfg/replacements -type f -name '*.png' | wc -l)" -eq 5

      - name: Generate original copyright-independent music
        run: |
          set -euo pipefail
          python TC497/FULL_V5/generate_original_music.py --out-dir /tmp/v5cfg/music
          cp TC497/FULL_V5/music_manifest.original.json /tmp/v5cfg/music_manifest.json
          cp TC497/FULL_V5/visual_patches.v5.json /tmp/v5cfg/visual_patches.json
          test -s /tmp/v5cfg/music/ambient_original.wav
          test -s /tmp/v5cfg/music/engineering_pulse_original.wav
          test -s /tmp/v5cfg/music/sky_tension_original.wav

      - name: Build FULL V5 visual patches and stem-based audio master
        run: |
          set -euo pipefail
          mkdir -p TC497/FULL_V5_OUT
          python TC497/FULL_V5/v5_fix_and_music.py             --input-video /tmp/v4artifact/TC497_FULL_V4_REVIEW_960x540.mp4             --shots-json /tmp/v4report/shots.json             --music-manifest /tmp/v5cfg/music_manifest.json             --visual-patches /tmp/v5cfg/visual_patches.json             --vo /tmp/v5_vo.mp3             --sfx-bed /tmp/v4report/ORIGINAL_UNDERSCORE.wav             --output TC497/FULL_V5_OUT/TC497_FULL_V5_REVIEW_960x540.mp4             --report-dir /tmp/v5report

      - name: Final V5 QC
        run: |
          set -euo pipefail
          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate             -of json TC497/FULL_V5_OUT/TC497_FULL_V5_REVIEW_960x540.mp4             > /tmp/v5report/FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/FULL_V5_OUT/TC497_FULL_V5_REVIEW_960x540.mp4             -af ebur128=peak=true -f null - 2> /tmp/v5report/EBUR128.txt || true

          mkdir -p /tmp/v5report/screens
          for t in 90 210 330 540 710 735 840 960 1083 1110 1212 1228; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V5_OUT/TC497_FULL_V5_REVIEW_960x540.mp4               -frames:v 1 "/tmp/v5report/screens/frame_${t}.jpg"
          done

          cp TC497/FULL_V5/README.md /tmp/v5report/
          cp TC497/FULL_V5/v5_fix_and_music.py /tmp/v5report/
          cp TC497/FULL_V5/generate_original_music.py /tmp/v5report/
          cp /tmp/v5cfg/music_manifest.json /tmp/v5report/
          cp /tmp/v5cfg/visual_patches.json /tmp/v5report/

          (cd /tmp/v5report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V5_OUT/FULL_V5_REPORT.zip" .)
          (cd TC497/FULL_V5_OUT && sha256sum              TC497_FULL_V5_REVIEW_960x540.mp4 FULL_V5_REPORT.zip > SHA256SUMS.txt)
          ls -lh TC497/FULL_V5_OUT/

      - name: Upload FULL V5 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v5-review
          path: |
            TC497/FULL_V5_OUT/TC497_FULL_V5_REVIEW_960x540.mp4
            TC497/FULL_V5_OUT/FULL_V5_REPORT.zip
            TC497/FULL_V5_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
