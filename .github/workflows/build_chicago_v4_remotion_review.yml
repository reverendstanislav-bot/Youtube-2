name: Build Chicago V4 Remotion Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v4_remotion_review.yml'
      - 'CHICAGO/V4/**'

permissions:
  contents: write

jobs:
  build-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil jq zip fonts-dejavu-core

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v4
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v4/remotion/src /tmp/chicago_v4/remotion/public /tmp/chicago_v4/work /tmp/chicago_v4/qc
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 work assets and canonical timing/audio sources
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/chicago_extract \
            "-ir!*/_V2/work/assets/*" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.srt" \
            "-ir!*/_QC/voice_words.json"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          test -d "$ASSETS"; test -s "$V2"; test -s "$SRT"; test -s "$WORDS"

          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          echo "WORDS=$WORDS" >> "$GITHUB_ENV"

      - name: Preflight Remotion bundle before expensive picture build
        run: |
          set -euo pipefail
          cp CHICAGO/V4/src/index.jsx /tmp/chicago_v4/remotion/src/index.jsx
          cp CHICAGO/V4/package.json /tmp/chicago_v4/remotion/package.json

          # Minimal placeholders only for compile/bundle validation.
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=960x540:r=25 -t 1 \
            -c:v libx264 -pix_fmt yuv420p /tmp/chicago_v4/remotion/public/base.mp4
          echo '[]' > /tmp/chicago_v4/remotion/public/captions.json
          cat > /tmp/chicago_v4/remotion/public/overlays.json <<'JSON'
          {"info":[],"provenance":[],"gauge":{"s":9999,"e":10000},"processes":[]}
          JSON

          cd /tmp/chicago_v4/remotion
          npm install --no-audit --no-fund
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/BUNDLE_PREFLIGHT.png --frame=0

      - name: Build clean V4 picture track
        run: |
          set -euo pipefail
          python3 CHICAGO/V4/build_v4_picture.py \
            --v3-builder CHICAGO/V3/build_v3_picture.py \
            --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json \
            --assets-root "$ASSETS" \
            --work /tmp/chicago_v4/work/picture \
            --output-video /tmp/chicago_v4/remotion/public/base.mp4 \
            --plan-out /tmp/chicago_v4/work/V4_SHOTS.json

          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/chicago_v4/remotion/public/base.mp4

      - name: Prepare Remotion timing data
        run: |
          set -euo pipefail
          python3 CHICAGO/V4/prepare_remotion_data.py \
            --srt "$SRT" \
            --words "$WORDS" \
            --plan /tmp/chicago_v4/work/V4_SHOTS.json \
            --captions-out /tmp/chicago_v4/remotion/public/captions.json \
            --overlays-out /tmp/chicago_v4/remotion/public/overlays.json \
            --report /tmp/chicago_v4/qc/REMOTION_DATA_REPORT.json

          cp CHICAGO/V4/src/index.jsx /tmp/chicago_v4/remotion/src/index.jsx
          cp CHICAGO/V4/package.json /tmp/chicago_v4/remotion/package.json

      - name: Extract original AAC bitstream
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/chicago_v4/work/original.aac
          AH="$(sha256sum /tmp/chicago_v4/work/original.aac | awk '{print $1}')"
          test "$AH" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$AH  original.aac" > /tmp/chicago_v4/qc/AUDIO_SHA256.txt

      - name: Confirm Remotion install
        working-directory: /tmp/chicago_v4/remotion
        run: test -d node_modules/remotion && test -x node_modules/.bin/remotion

      - name: Remotion preflight stills
        working-directory: /tmp/chicago_v4/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v4/qc/stills
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/gauge.png --frame=4800
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/transfer.png --frame=6300
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/coal.png --frame=12600
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/basement.png --frame=14200
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/water.png --frame=23800
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/survivor.png --frame=27200
          npx remotion still src/index.jsx ChicagoV4 /tmp/chicago_v4/qc/stills/end.png --frame=32050

      - name: Render full V4 through Remotion
        working-directory: /tmp/chicago_v4/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.jsx ChicagoV4 out/raw_video.mp4 \
            --codec=h264 --crf=19 --pixel-format=yuv420p --concurrency=4

      - name: Mux original AAC without re-encoding
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_v4/HIA_CHICAGO_V4_REMOTION_REVIEW_960x540.mp4

          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/chicago_v4/remotion/out/raw_video.mp4 \
            -i /tmp/chicago_v4/work/original.aac \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a copy \
            -movflags +faststart -shortest \
            "$OUT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Technical QC
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format -of json "$OUT" > /tmp/chicago_v4/qc/FFPROBE.json

          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> /tmp/chicago_v4/qc/DECODE_ERRORS.txt
          test ! -s /tmp/chicago_v4/qc/DECODE_ERRORS.txt

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.20, d
          PY

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts /tmp/chicago_v4/qc/review.aac
          RH="$(sha256sum /tmp/chicago_v4/qc/review.aac | awk '{print $1}')"
          test "$RH" = "a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed"
          echo "$RH  review.aac" > /tmp/chicago_v4/qc/REVIEW_AUDIO_SHA256.txt

          sha256sum "$OUT" > /tmp/chicago_v4/qc/VIDEO_SHA256.txt

      - name: Sequence QC against V4 shot plan
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/audit_v2_sequence.py \
            --shots /tmp/chicago_v4/work/V4_SHOTS.json \
            --out-json /tmp/chicago_v4/qc/V4_SEQUENCE_AUDIT.json \
            --out-md /tmp/chicago_v4/qc/V4_SEQUENCE_AUDIT.md

      - name: Build V4 QC summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/chicago_v4/qc')
          seq=json.loads((q/'V4_SEQUENCE_AUDIT.json').read_text())
          data=json.loads((q/'REMOTION_DATA_REPORT.json').read_text())
          lines=[
            '# Chicago V4 Remotion review QC','',
            '- Picture source: clean V3/V4 sequence from original work-assets.',
            '- Legacy PIL/FFmpeg explainer cards in picture: **NONE**.',
            '- Explainers: **Remotion motion graphics only**.',
            '- Motion language: line reveal + spring/fade/slide + phase progress rail.',
            '- No opaque explainer panels.',
            '- Subtitles: one Remotion layer, white base + orange active word.',
            '- End-screen subtitles: top-safe zone.',
            '- Original AAC preserved bit-for-bit.',
            '- Full decode: PASS.',
            f"- Caption cues: {data['caption_cues']}.",
            f"- Caption token match: {data['token_match_ratio']:.3%}.",
            f"- Info/chapter overlays: {data['info_overlays']}.",
            f"- Process overlays: {', '.join(data['processes'])}.",
            f"- Sequence shots: {seq['shot_count']}.",
            f"- A→B→A returns: {len(seq['aba_returns'])}.",
            f"- Source returns within six shots: {len(seq['quick_source_returns_within_6_shots'])}.",
            '',
            'Preflight stills:',
            '- gauge',
            '- transfer',
            '- coal',
            '- basement',
            '- water',
            '- survivor',
            '- end',
          ]
          (q/'V4_QC_SUMMARY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Package QC
        run: |
          set -euo pipefail
          cp /tmp/chicago_v4/work/V4_SHOTS.json /tmp/chicago_v4/qc/
          cp /tmp/chicago_v4/remotion/public/overlays.json /tmp/chicago_v4/qc/
          cp CHICAGO/V4/src/index.jsx /tmp/chicago_v4/qc/
          cp CHICAGO/V4/package.json /tmp/chicago_v4/qc/
          cd /tmp/chicago_v4
          zip -q -r HIA_CHICAGO_V4_REMOTION_QC.zip qc
          cp qc/VIDEO_SHA256.txt SHA256SUMS.txt

      - name: Publish V4 review release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=chicago-v4-remotion-review-20260920
          BODY='Review only. Full Chicago picture rebuilt clean, all explainer inserts rendered as animated Remotion motion graphics with no opaque cards. One running subtitle layer. Original AAC preserved bit-for-bit. Not a publication master until user approval.'

          if gh release view "$TAG" --repo reverendstanislav-bot/Youtube-2 >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUT" \
              /tmp/chicago_v4/HIA_CHICAGO_V4_REMOTION_QC.zip \
              /tmp/chicago_v4/SHA256SUMS.txt \
              --clobber --repo reverendstanislav-bot/Youtube-2
          else
            gh release create "$TAG" \
              "$OUT" \
              /tmp/chicago_v4/HIA_CHICAGO_V4_REMOTION_QC.zip \
              /tmp/chicago_v4/SHA256SUMS.txt \
              --title 'Chicago V4 Remotion Review 960x540' \
              --notes "$BODY" \
              --repo reverendstanislav-bot/Youtube-2
          fi

      - name: Record V4 review in Git
        run: |
          set -euo pipefail
          mkdir -p CHICAGO/V4/REVIEW_QC
          cp /tmp/chicago_v4/qc/V4_QC_SUMMARY.md CHICAGO/V4/REVIEW_QC/
          cp /tmp/chicago_v4/qc/V4_SEQUENCE_AUDIT.md CHICAGO/V4/REVIEW_QC/
          cp /tmp/chicago_v4/qc/REMOTION_DATA_REPORT.json CHICAGO/V4/REVIEW_QC/
          cp /tmp/chicago_v4/qc/VIDEO_SHA256.txt CHICAGO/V4/REVIEW_QC/
          cp /tmp/chicago_v4/qc/AUDIO_SHA256.txt CHICAGO/V4/REVIEW_QC/
          cp /tmp/chicago_v4/qc/REVIEW_AUDIO_SHA256.txt CHICAGO/V4/REVIEW_QC/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/V4/REVIEW_QC
          git commit -m "Record Chicago V4 Remotion review QC"
          git push

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v4-remotion-review
          path: |
            /tmp/chicago_v4/HIA_CHICAGO_V4_REMOTION_REVIEW_960x540.mp4
            /tmp/chicago_v4/qc
          retention-days: 14
