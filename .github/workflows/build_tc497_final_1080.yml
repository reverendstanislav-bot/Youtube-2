name: Build TC497 FINAL 1080 Master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_final_1080.yml'

permissions:
  contents: read

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BUILD_REV: 1789791574468
      VO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/130bfd1b-7ac4-4dbf-9bc4-6a5fe00927ac.mp3
      TRANSCRIPT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/7ead52a5-61f7-44be-b6d0-861d8159592f.zip
      V4_WORK: /tmp/tc497master/work
      V4_PUBLIC: /tmp/tc497master/public
      V4_EXTRA: /tmp/tc497master/extra
      ASS_OUT: /tmp/tc497master/overlay.ass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils fonts-dejavu-core unzip zip
          pip install pillow numpy opencv-python-headless

      - name: Download package, VO and transcript
        run: |
          set -euo pipefail
          rm -rf /tmp/tc497pkg /tmp/tc497tr /tmp/tc497master
          mkdir -p /tmp/tc497pkg /tmp/tc497tr /tmp/tc497master/work /tmp/tc497master/public /tmp/tc497master/extra

          if ! curl -fL --retry 5 --retry-all-errors \
            'https://github.com/reverendstanislav-bot/Youtube-2/releases/download/tc497-codex-ready-v1/Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' \
            -o /tmp/pkg.zip; then
            curl -fL --retry 5 --retry-all-errors \
              -H 'Accept: application/octet-stream' \
              -H 'Authorization: Bearer ${{ github.token }}' \
              'https://api.github.com/repos/reverendstanislav-bot/Youtube-2/releases/assets/573862020' \
              -o /tmp/pkg.zip
          fi
          test -s /tmp/pkg.zip
          unzip -q /tmp/pkg.zip -d /tmp/tc497pkg

          curl -fL --retry 3 "$VO_URL" -o /tmp/tc497master/vo.mp3
          curl -fL --retry 3 "$TRANSCRIPT_URL" -o /tmp/tr.zip
          unzip -q /tmp/tr.zip -d /tmp/tc497tr

          PKG_ROOT="$(find /tmp/tc497pkg -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          GEN_DIR="$(find "$PKG_ROOT" -type d -name FINAL_62 | head -n 1)"
          WORD="$(find /tmp/tc497tr -type f -name TC497_VO_WORD_LEVEL.csv | head -n 1)"
          test -n "$PKG_ROOT"
          test -n "$GEN_DIR"
          test -n "$WORD"

          echo "PKG_ROOT=$PKG_ROOT" >> "$GITHUB_ENV"
          echo "GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"
          echo "TRANSCRIPT_DIR=$(dirname "$WORD")" >> "$GITHUB_ENV"

      - name: Download FULL V2 clean stills reused by V3
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222237_c38091de-d222-4038-a930-299f163943f7.png' -o "$V4_EXTRA/V2_POWERTRAIN.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_cb4be4db-d792-4970-8faa-e2101780ced5.png' -o "$V4_EXTRA/V2_DISTRIBUTION.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_48fe7dc4-ba26-4692-b326-147635894a6a.png' -o "$V4_EXTRA/V2_PREDECESSOR_EARLY.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_d1d134fd-224a-4689-9ff9-9b24e8fa80a9.png' -o "$V4_EXTRA/V2_PREDECESSOR_MIL.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_66e68906-26f4-4d5b-9524-2d61cb02259a.png' -o "$V4_EXTRA/V2_STEER_FOLLOW.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222236_cd5eecdb-31c6-41c2-afcb-6757c6e9f7f3.png' -o "$V4_EXTRA/V2_TRACTION.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_94b48c66-3576-4731-aa02-c61c6b20893b.png' -o "$V4_EXTRA/V2_YUMA_OBSERVERS.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_f128fc7c-4ff5-478e-9148-89e57f2fc8ba.png' -o "$V4_EXTRA/V2_DUNE.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_2b1b3969-83fe-4256-a8a4-fab8d7ffbf11.png' -o "$V4_EXTRA/V2_CARGO.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_222304_c2742a87-2ed2-4669-bf66-65543095ffb6.png' -o "$V4_EXTRA/V2_LEGACY.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_223846_82111952-45be-4ae5-bc0c-a1dcd308dd5f.png' -o "$V4_EXTRA/V2_ELECTRIC_HERO.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_223846_cb411bf3-79f4-448f-907b-93f6a8e4e289.png' -o "$V4_EXTRA/V2_NUCLEAR_CONCEPT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260918_225155_c256ee6d-b461-456e-94d1-c78edcd6de3a.png' -o "$V4_EXTRA/V2_CONTROL_INTERIOR.png"

      - name: Download targeted FULL V4 coverage pack
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_002337_dcd45eeb-38ba-4930-9838-bdf6edd15e75.png' -o "$V4_EXTRA/V3_PREDECESSOR.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_002337_2964f294-200e-4aac-963d-c99934269291.png' -o "$V4_EXTRA/V3_YUMA_TEST.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_002347_1e229ca2-2bca-4d94-a808-e6955417ed12.png' -o "$V4_EXTRA/V3_DUNE_LIMIT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_002347_6124113d-d00b-4ed3-9f3e-25888f794b25.png' -o "$V4_EXTRA/V3_LEGACY.png"

          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005304_cf5151e4-476a-4615-bd9d-cf58168f622c.png' -o "$V4_EXTRA/V3_ASSEMBLY.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005305_ccba2b64-f2ed-4c65-8e39-b46e69ea680b.png' -o "$V4_EXTRA/V3_COUPLING.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005305_773f6719-7e01-40af-b74b-9eab0aa9bc2c.png' -o "$V4_EXTRA/V3_TOPDOWN.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005304_e98f93c2-3f32-4cb3-9308-54d87222bdf0.png' -o "$V4_EXTRA/V3_CARGOLOAD.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005305_cf933f70-7f50-4a47-9fba-379666cf6183.png' -o "$V4_EXTRA/V3_CREW.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005305_c81f882d-f605-45d5-9938-7f578effb4ce.png' -o "$V4_EXTRA/V3_WHEEL_MOTION.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005315_6ac99692-c4f5-468f-8578-085dba834649.png' -o "$V4_EXTRA/V3_RANGE.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005315_28be5767-c7b4-4ec0-b0a3-f1315820b9b3.png' -o "$V4_EXTRA/V3_LEGACY_DETAIL.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005315_865cae45-6b98-4eba-b0cc-efb6108c399d.png' -o "$V4_EXTRA/V3_EMPTY_YUMA.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_005315_2530317b-85af-454b-853e-56163f60b653.png' -o "$V4_EXTRA/V3_HELI_LOAD.png"

          test "$(find "$V4_EXTRA" -type f -name '*.png' | wc -l)" -eq 27

      - name: Download targeted FULL V4 clean coverage pack
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_b479b024-1193-4e1f-b293-0611f7d8cb51.png' -o "$V4_EXTRA/V4_STEER_TRACKS.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_5c93c827-4bc5-466a-8824-fdf0b844fd28.png' -o "$V4_EXTRA/V4_STEER_JOINT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_5ec671d0-ba6c-40d8-b8b5-65c77d78daa2.png' -o "$V4_EXTRA/V4_DRIVER.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_af253b61-91da-4026-9260-99ae4cb5e4a6.png' -o "$V4_EXTRA/V4_WHEEL_ALT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_a9c28e97-f856-431a-9517-fb0f8dda9ebf.png' -o "$V4_EXTRA/V4_ASSEMBLY_ALT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014105_15664101-2fb5-4666-8e35-c0034242a207.png' -o "$V4_EXTRA/V4_CARGO_ALT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_02a283a4-6b68-498d-9bea-fb3f09190356.png' -o "$V4_EXTRA/V4_RANGE_ALT.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_ef53745c-7d9b-40d7-9375-c3c27c19b958.png' -o "$V4_EXTRA/V4_NUKE_TECH.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_d5259b58-486d-4be2-a84e-06ebc8f1db72.png' -o "$V4_EXTRA/V4_HELI_CARGO.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_716056f2-ff26-4bb6-b680-2559a293dc01.png' -o "$V4_EXTRA/V4_SURVIVOR_INTERIOR.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_a47863ca-4a61-4e9e-9baf-812785b182df.png' -o "$V4_EXTRA/V4_SURVIVOR_DETAIL.png"
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_48dcb295-57ea-4d53-901d-7ce9c3492c42.png' -o "$V4_EXTRA/V4_EMPTY_END.png"
          test "$(find "$V4_EXTRA" -type f -name '*.png' | wc -l)" -eq 39

      - name: Download FULL V5 final replacement pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc497master/v5patch
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_ef53745c-7d9b-40d7-9375-c3c27c19b958.png' -o /tmp/tc497master/v5patch/nuclear_concept_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_83c46c89-d5da-4679-b0b5-e7040f256687.png' -o /tmp/tc497master/v5patch/nuclear_unbuilt_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_d5259b58-486d-4be2-a84e-06ebc8f1db72.png' -o /tmp/tc497master/v5patch/heavy_lift_logistics_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_022944_f0ef4a51-417a-4aa3-8497-f376988c719b.png' -o /tmp/tc497master/v5patch/ground_vs_air_clean.png
          curl -fL --retry 3 'https://d8j0ntlcm91z4.cloudfront.net/user_3J3zfwu7kpgllQvPySWoLtXHwdR/hf_20260919_014113_a47863ca-4a61-4e9e-9baf-812785b182df.png' -o /tmp/tc497master/v5patch/survivor_detail_clean.png
          test "$(find /tmp/tc497master/v5patch -type f -name '*.png' | wc -l)" -eq 5

      - name: Build native 1080 post-cold-open picture track
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('TC497/FULL_V4/full_v4_build.py').read_text()
          src=src.replace('W,H=960,540','W,H=1920,1080')
          src=src.replace("'scale=960:540,format=yuv420p'","'scale=1920:1080,format=yuv420p'")
          src=src.replace("'-crf','19'","'-crf','16'")
          Path('/tmp/tc497master/full_master_build.py').write_text(src)
          PY
          python /tmp/tc497master/full_master_build.py
          python TC497/FULL_V4/make_overlay_v4_ass.py
          test -s "$V4_PUBLIC/rest_base.mp4"
          test -s "$V4_PUBLIC/rest_score.wav"
          test -s "$ASS_OUT"

      - name: Build 1080 locked cold open and full base
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4 \
            -t 82.6 -an \
            -vf "scale=1920:1080:flags=lanczos,unsharp=5:5:0.28:5:5:0.0,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 16 -pix_fmt yuv420p \
            /tmp/tc497master/v14_picture_1080.mp4

          printf "file '/tmp/tc497master/v14_picture_1080.mp4'\nfile '$V4_PUBLIC/rest_base.mp4'\n" > /tmp/tc497master/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i /tmp/tc497master/concat.txt -c copy /tmp/tc497master/full_base_1080.mp4
          test -s /tmp/tc497master/full_base_1080.mp4

      - name: Build original YouTube-safe music bed
        run: |
          set -euo pipefail
          mkdir -p /tmp/tc497master/music /tmp/tc497master/musicwork
          python TC497/FULL_V5/generate_original_music.py --out-dir /tmp/tc497master/music
          cp TC497/FULL_V5/music_manifest.original.json /tmp/tc497master/music_manifest.json
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'TC497/FULL_V5')
          import v5_fix_and_music as v
          mp=Path('/tmp/tc497master/music_manifest.json')
          manifest,_=v.validate_music_manifest(mp,mp.parent)
          v.make_music_bed(
              manifest,mp.parent,1236.506,
              Path('/tmp/tc497master/musicwork'),
              '/tmp/tc497master/public/shots.json'
          )
          PY
          test -s /tmp/tc497master/musicwork/music_bed.wav

      - name: Build final stem audio master
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i TC497/V14/TC497_V14_COLD_OPEN_TARGETED_POLISH.mp4 \
            -t 82.6 -vn -ac 2 -ar 48000 -c:a pcm_s16le \
            /tmp/tc497master/cold_audio.wav

          ffmpeg -y -loglevel error \
            -i /tmp/tc497master/vo.mp3 \
            -i "$V4_PUBLIC/rest_score.wav" \
            -i /tmp/tc497master/musicwork/music_bed.wav \
            -filter_complex "\
              [0:a]atrim=start=82.6:end=1236.506,asetpts=PTS-STARTPTS,aresample=48000,pan=stereo|c0=c0|c1=c0[vo0];\
              [vo0]asplit=2[vo][sc];\
              [1:a]aresample=48000,pan=stereo|c0=c0|c1=c0,volume=0.62,volume=0.22:enable='between(t,1032.776,1153.906)'[sfx];\
              [2:a]atrim=start=82.6:end=1236.506,asetpts=PTS-STARTPTS,aresample=48000[music];\
              [music][sc]sidechaincompress=threshold=0.020:ratio=12:attack=15:release=480:makeup=1[duck];\
              [vo][sfx][duck]amix=inputs=3:weights='1 0.75 1':normalize=0,alimiter=limit=0.89[rest]" \
            -map "[rest]" -t 1153.906 -ac 2 -ar 48000 -c:a pcm_s16le \
            /tmp/tc497master/rest_audio.wav

          ffmpeg -y -loglevel error \
            -i /tmp/tc497master/cold_audio.wav -i /tmp/tc497master/rest_audio.wav \
            -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[a]" \
            -map "[a]" -t 1236.506 -ac 2 -ar 48000 -c:a pcm_s16le \
            /tmp/tc497master/full_audio.wav

      - name: Encode native 1080 V5 visual master
        run: |
          set -euo pipefail
          mkdir -p TC497/FINAL_1080 /tmp/tc497master/report/screens

          ffmpeg -y -loglevel error \
            -i /tmp/tc497master/full_base_1080.mp4 \
            -loop 1 -framerate 30 -i /tmp/tc497master/v5patch/nuclear_concept_clean.png \
            -loop 1 -framerate 30 -i /tmp/tc497master/v5patch/nuclear_unbuilt_clean.png \
            -loop 1 -framerate 30 -i /tmp/tc497master/v5patch/heavy_lift_logistics_clean.png \
            -loop 1 -framerate 30 -i /tmp/tc497master/v5patch/ground_vs_air_clean.png \
            -loop 1 -framerate 30 -i /tmp/tc497master/v5patch/survivor_detail_clean.png \
            -filter_complex "\
              [1:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p1];\
              [2:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p2];\
              [3:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p3];\
              [4:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p4];\
              [5:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080[p5];\
              [0:v][p1]overlay=0:0:shortest=1:eof_action=pass:enable='between(t,709.241,717.165)'[v1];\
              [v1][p2]overlay=0:0:shortest=1:eof_action=pass:enable='between(t,730.373,736.976)'[v2];\
              [v2][p3]overlay=0:0:shortest=1:eof_action=pass:enable='between(t,1079.245,1087.457)'[v3];\
              [v3][p4]overlay=0:0:shortest=1:eof_action=pass:enable='between(t,1107.164,1115.376)'[v4];\
              [v4][p5]overlay=0:0:shortest=1:eof_action=pass:enable='between(t,1209.007,1215.477)',ass=$ASS_OUT[vout]" \
            -map "[vout]" -t 1236.506 \
            -c:v libx264 -preset fast -crf 17 -profile:v high -level 4.1 -pix_fmt yuv420p \
            -movflags +faststart /tmp/tc497master/master_picture.mp4

      - name: Mux final YouTube upload master and QC
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error \
            -i /tmp/tc497master/master_picture.mp4 \
            -i /tmp/tc497master/full_audio.wav \
            -filter_complex "[1:a]loudnorm=I=-14:TP=-2:LRA=6[a]" \
            -map 0:v -map "[a]" -t 1236.506 \
            -c:v copy -c:a aac -b:a 256k -movflags +faststart \
            TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4

          ffprobe -v error \
            -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate \
            -of json TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4 \
            > /tmp/tc497master/report/FFPROBE.json

          ffmpeg -hide_banner -nostats \
            -i TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4 \
            -af ebur128=peak=true -f null - 2> /tmp/tc497master/report/EBUR128.txt || true

          cp TC497/FULL_V5/CRITIC_QC.md /tmp/tc497master/report/
          cp TC497/FULL_V5/music_manifest.original.json /tmp/tc497master/report/
          cp "$ASS_OUT" /tmp/tc497master/report/overlay_master.ass
          cp "$V4_PUBLIC/shots.json" /tmp/tc497master/report/shots.json

          for t in 90 210 330 540 710 735 840 960 1083 1110 1212 1228; do
            ffmpeg -y -loglevel error -ss "$t" \
              -i TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4 \
              -frames:v 1 "/tmp/tc497master/report/screens/frame_$t.jpg"
          done

          (cd /tmp/tc497master/report && zip -q -r "$GITHUB_WORKSPACE/TC497/FINAL_1080/FINAL_MASTER_QC.zip" .)
          (cd TC497/FINAL_1080 && sha256sum \
            TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4 FINAL_MASTER_QC.zip > SHA256SUMS.txt)

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4)" = "1080"
          ls -lh TC497/FINAL_1080/

      - name: Upload final 1080 master artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc497-final-upload-master-1080
          path: |
            TC497/FINAL_1080/TC497_FINAL_UPLOAD_MASTER_1920x1080.mp4
            TC497/FINAL_1080/FINAL_MASTER_QC.zip
            TC497/FINAL_1080/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
