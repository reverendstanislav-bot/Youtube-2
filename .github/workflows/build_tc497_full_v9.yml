name: Build TC497 FULL V9 Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_tc497_full_v9.yml'
      - 'TC497/FULL_V9/**'

permissions:
  contents: read
  actions: read

jobs:
  build-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip fonts-dejavu-core

      - name: Download FULL V8 review base
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v8-review
          path: /tmp/v8
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35426397417
          github-token: ${{ github.token }}

      - name: Download FULL V4 overlay source
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v4-review
          path: /tmp/v4
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35414343740
          github-token: ${{ github.token }}

      - name: Download CODEX source package
        uses: actions/download-artifact@v4
        with:
          name: TC497-CODEX-READY-FULL-v1
          path: /tmp/pkg_artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35425693962
          github-token: ${{ github.token }}

      - name: Prepare V9 assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4report /tmp/pkg /tmp/assets /tmp/v9report/screens TC497/FULL_V9_OUT

          test -s /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4
          test -s /tmp/v4/FULL_V4_REPORT.zip
          unzip -q /tmp/v4/FULL_V4_REPORT.zip -d /tmp/v4report
          test -s /tmp/v4report/overlay_v4.ass

          PKG_ZIP="$(find /tmp/pkg_artifact -type f -name 'Hidden_Industrial_America_TC497_CODEX_READY_FULL_v1.zip' | head -n 1)"
          test -n "$PKG_ZIP"
          unzip -q "$PKG_ZIP" -d /tmp/pkg
          GEN_DIR="$(find /tmp/pkg -type d -name FINAL_62 | head -n 1)"
          test -n "$GEN_DIR"

          for f in WC-Y01.png WD-T03.png WC-D03.png WC-D05.png; do
            test -s "$GEN_DIR/$f"
            cp "$GEN_DIR/$f" "/tmp/assets/$f"
          done

          ls -lh /tmp/assets

      - name: Render V9 picture
        run: |
          set -euo pipefail
          python3 TC497/FULL_V9/v9_patch_chunk.py             --input /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             --manifest TC497/FULL_V9/v9_patch_manifest.json             --source-ass /tmp/v4report/overlay_v4.ass             --asset-dir /tmp/assets             --start 0             --end 1236.533333             --output /tmp/v9_video_only.mp4

      - name: Remux untouched V8 audio
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error             -i /tmp/v9_video_only.mp4             -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -map 0:v:0 -map 1:a:0             -c copy -movflags +faststart             TC497/FULL_V9_OUT/TC497_FULL_V9_REVIEW_960x540.mp4

          ffmpeg -y -loglevel error             -i /tmp/v8/TC497_FULL_V8_REVIEW_960x540.mp4             -map 0:a:0 -c copy -f adts /tmp/v8_audio.aac

          ffmpeg -y -loglevel error             -i TC497/FULL_V9_OUT/TC497_FULL_V9_REVIEW_960x540.mp4             -map 0:a:0 -c copy -f adts /tmp/v9_audio.aac

          sha256sum /tmp/v8_audio.aac /tmp/v9_audio.aac | tee /tmp/v9report/AUDIO_SHA256.txt
          cmp /tmp/v8_audio.aac /tmp/v9_audio.aac

      - name: V9 objective and visual QC
        run: |
          set -euo pipefail

          ffprobe -v error             -show_entries stream=index,codec_name,width,height,r_frame_rate,avg_frame_rate,duration:format=duration,size,bit_rate             -of json TC497/FULL_V9_OUT/TC497_FULL_V9_REVIEW_960x540.mp4             > /tmp/v9report/FFPROBE.json

          for t in 760 770 776 817 824 1024 1030 1058 1064 1083 1228 1235; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FULL_V9_OUT/TC497_FULL_V9_REVIEW_960x540.mp4               -frames:v 1 "/tmp/v9report/screens/frame_${t}.jpg"
          done

          cat > /tmp/v9report/V9_BUILD_NOTES.md <<'EOF'
          # TC497 FULL_V9 — review build only

          FULL_V9 is NOT user-approved and is NOT a final upload master.

          Base:
          - FULL_V8 review artifact from GitHub Actions run 35426397417.

          V9 changes:
          - 12:46.838–12:55.922: WC-Y01 dedicated Yuma proving-ground wide.
          - 13:35.287–13:42.857: WD-T03 terrain-constraint reconstruction.
          - 17:00.122–17:08.334: WC-D03 ground-route-vs-airlift overhead reconstruction.
          - 17:34.611–17:42.822: WC-D05 technology-shift overhead reconstruction.
          - raw collage/corner styling is excluded with a controlled 12% edge crop;
          - V4 captions/tags are reburned only inside the four replacement intervals;
          - all four new visual intervals are explicitly tagged RECONSTRUCTION;
          - V8 audio is preserved bit-for-bit;
          - V14 cold open and V8 ending are not changed.

          No 1080p build is promoted by this workflow.
          EOF

          cp TC497/FULL_V9/EDIT_PLAN.md /tmp/v9report/
          cp TC497/FULL_V9/v9_patch_manifest.json /tmp/v9report/
          cp TC497/FULL_V9/v9_patch_chunk.py /tmp/v9report/

          (cd /tmp/v9report && zip -q -r "$GITHUB_WORKSPACE/TC497/FULL_V9_OUT/FULL_V9_REPORT.zip" .)
          (cd TC497/FULL_V9_OUT && sha256sum             TC497_FULL_V9_REVIEW_960x540.mp4 FULL_V9_REPORT.zip > SHA256SUMS.txt)

          ls -lh TC497/FULL_V9_OUT/

      - name: Upload FULL V9 review
        uses: actions/upload-artifact@v4
        with:
          name: tc497-full-v9-review
          path: |
            TC497/FULL_V9_OUT/TC497_FULL_V9_REVIEW_960x540.mp4
            TC497/FULL_V9_OUT/FULL_V9_REPORT.zip
            TC497/FULL_V9_OUT/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
