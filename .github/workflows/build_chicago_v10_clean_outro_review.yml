name: Build Chicago V10 Clean Outro Final Review

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_chicago_v10_clean_outro_review.yml'
      - 'CHICAGO/V10/**'
      - 'CHICAGO/tools/final_prepublication_qc.py'

permissions:
  contents: write

jobs:
  build-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install media and QC tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg python3-pil python3-opencv python3-numpy jq zip fonts-dejavu-core

      - name: Download and reconstruct canonical Chicago archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v10 /tmp/hia_brand
          mkdir -p /tmp/chicago_src /tmp/chicago_extract /tmp/chicago_v10/remotion/src /tmp/chicago_v10/remotion/public /tmp/chicago_v10/work /tmp/chicago_v10/qc /tmp/hia_brand
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1             --repo reverendstanislav-bot/Youtube-2             --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'

          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01               Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02               > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar

          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract canonical project material
        run: |
          set -euo pipefail
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar             -o/tmp/chicago_extract             "-ir!*/_V2/work/assets/*"             "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4"             "-ir!*/_V2/final/HIA_CHICAGO_V2.srt"             "-ir!*/_QC/voice_words.json"             "-ir!*/02_SCRIPT/voiceover_en.txt"             "-ir!*/03_TIMELINE/scene_map.csv"             "-ir!*/03_TIMELINE/timeline.csv"             "-ir!*/06_LICENSES_FACTS/fact_map.csv"             "-ir!*/06_LICENSES_FACTS/license_manifest.csv"             "-ir!*/06_LICENSES_FACTS/music_attribution.txt"

          ASSETS="$(find /tmp/chicago_extract -type d -path '*/_V2/work/assets' | head -n1)"
          V2="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/chicago_extract -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          WORDS="$(find /tmp/chicago_extract -type f -path '*/_QC/voice_words.json' | head -n1)"
          SCRIPT="$(find /tmp/chicago_extract -type f -path '*/02_SCRIPT/voiceover_en.txt' | head -n1)"
          SCENE_MAP="$(find /tmp/chicago_extract -type f -path '*/03_TIMELINE/scene_map.csv' | head -n1)"
          TIMELINE="$(find /tmp/chicago_extract -type f -path '*/03_TIMELINE/timeline.csv' | head -n1)"
          FACT_MAP="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/fact_map.csv' | head -n1)"
          LICENSES="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/license_manifest.csv' | head -n1)"
          MUSIC_ATTR="$(find /tmp/chicago_extract -type f -path '*/06_LICENSES_FACTS/music_attribution.txt' | head -n1)"

          for v in "$ASSETS" "$V2" "$SRT" "$WORDS" "$SCRIPT" "$SCENE_MAP" "$TIMELINE" "$FACT_MAP" "$LICENSES" "$MUSIC_ATTR"; do
            test -e "$v"
          done

          {
            echo "ASSETS=$ASSETS"
            echo "V2=$V2"
            echo "SRT=$SRT"
            echo "WORDS=$WORDS"
            echo "SCRIPT=$SCRIPT"
            echo "SCENE_MAP=$SCENE_MAP"
            echo "TIMELINE=$TIMELINE"
            echo "FACT_MAP=$FACT_MAP"
            echo "LICENSES=$LICENSES"
            echo "MUSIC_ATTR=$MUSIC_ATTR"
          } >> "$GITHUB_ENV"

      - name: Download canonical HIA brand package and build accepted Episode 1 outro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/hia_brand
          gh release download chicago-channel-brand-assets-extracted-20260920 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'
          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip -d extracted
          ROOT="$(find extracted -type d -name 'Hidden_Industrial_America_7_Brand_Assets' | head -n1)"
          BASE="$ROOT/07_generic_reusable_thumbnail_base.png"
          test -s "$BASE"

          python3 "$GITHUB_WORKSPACE/CHICAGO/V10/build_brand_native_outro.py" \
            --base "$BASE" \
            --output /tmp/chicago_v10/remotion/public/end_screen_first_episode.png

          test -s /tmp/chicago_v10/remotion/public/end_screen_first_episode.png
          sha256sum "$BASE" | tee /tmp/chicago_v10/qc/OUTRO_BASE_SHA256.txt
          sha256sum /tmp/chicago_v10/remotion/public/end_screen_first_episode.png | tee /tmp/chicago_v10/qc/OUTRO_RENDER_SHA256.txt

      - name: Validate V10 source rules
        run: |
          set -euo pipefail
          ! grep -q 'WATCH NEXT' CHICAGO/V10/src/index.jsx
          ! grep -q 'CONTINUE EXPLORING' CHICAGO/V10/src/index.jsx
          grep -q 'end_screen_first_episode.png' CHICAGO/V10/src/index.jsx
          ! grep -q 'end_screen_clean_base.png' CHICAGO/V10/src/index.jsx
          ! grep -q 'AI RECONSTRUCTION' CHICAGO/V10/prepare_remotion_data.py
          grep -q "right:endMode?620:70" CHICAGO/V10/src/index.jsx
          grep -q 'HIDDEN INDUSTRIAL AMERICA' CHICAGO/V10/build_brand_native_outro.py
          grep -q 'SUBSCRIBE' CHICAGO/V10/build_brand_native_outro.py
          echo "V10 source rules PASS"

      - name: Preflight V10 Remotion bundle
        run: |
          set -euo pipefail
          cp CHICAGO/V10/src/index.jsx /tmp/chicago_v10/remotion/src/index.jsx
          cp CHICAGO/V10/package.json /tmp/chicago_v10/remotion/package.json

          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=960x540:r=25 -t 1             -c:v libx264 -pix_fmt yuv420p /tmp/chicago_v10/remotion/public/base.mp4
          echo '[]' > /tmp/chicago_v10/remotion/public/captions.json
          echo '{"cards":[],"provenance":[]}' > /tmp/chicago_v10/remotion/public/overlays.json

          cd /tmp/chicago_v10/remotion
          npm install --no-audit --no-fund
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/BUNDLE_PREFLIGHT.png --frame=0

      - name: Build clean V10 picture track
        run: |
          set -euo pipefail
          python3 CHICAGO/V4/build_v4_picture.py             --v3-builder CHICAGO/V3/build_v3_picture.py             --shots CHICAGO/AUDIT/V2_SEQUENCE/shots.json             --assets-root "$ASSETS"             --work /tmp/chicago_v10/work/picture             --output-video /tmp/chicago_v10/remotion/public/base.mp4             --plan-out /tmp/chicago_v10/work/V10_SHOTS.json

      - name: Prepare V10 editorial data
        run: |
          set -euo pipefail
          python3 CHICAGO/V10/prepare_remotion_data.py             --srt "$SRT"             --words "$WORDS"             --plan /tmp/chicago_v10/work/V10_SHOTS.json             --captions-out /tmp/chicago_v10/remotion/public/captions.json             --overlays-out /tmp/chicago_v10/remotion/public/overlays.json             --report /tmp/chicago_v10/qc/REMOTION_DATA_REPORT.json

          ! grep -q 'AI RECONSTRUCTION' /tmp/chicago_v10/remotion/public/overlays.json

      - name: Extract and verify original AAC
        run: |
          set -euo pipefail
          ffmpeg -y -loglevel error -i "$V2" -map 0:a:0 -c copy -f adts /tmp/chicago_v10/work/original.aac
          AH="$(sha256sum /tmp/chicago_v10/work/original.aac | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          test "$AH" = "$EXPECTED"
          echo "$AH  original.aac" > /tmp/chicago_v10/qc/AUDIO_SHA256.txt

      - name: Render V10 preflight stills
        working-directory: /tmp/chicago_v10/remotion
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v10/qc/stills
          # Control stills outside outro prove V9/V7 picture language is still present.
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/01_opening.png --frame=75
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/02_mid.png --frame=16000
          # Outro-specific stills.
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/03_end_start.png --frame=31830
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/04_end_circle.png --frame=31930
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/05_end_caption.png --frame=32050
          npx remotion still src/index.jsx ChicagoV10 /tmp/chicago_v10/qc/stills/06_end_final.png --frame=32240

      - name: Render full V10 review
        working-directory: /tmp/chicago_v10/remotion
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.jsx ChicagoV10 out/raw_video.mp4             --codec=h264 --crf=19 --pixel-format=yuv420p --concurrency=4

      - name: Mux original AAC
        run: |
          set -euo pipefail
          OUT=/tmp/chicago_v10/HIA_CHICAGO_V10_CLEAN_OUTRO_FINAL_REVIEW_960x540.mp4
          ffmpeg -y -hide_banner -loglevel error             -i /tmp/chicago_v10/remotion/out/raw_video.mp4             -i /tmp/chicago_v10/work/original.aac             -map 0:v:0 -map 1:a:0             -c:v copy -c:a copy             -movflags +faststart             "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Full technical decode and audio identity QC
        run: |
          set -euo pipefail
          Q=/tmp/chicago_v10/qc
          ffprobe -v error -show_streams -show_format -of json "$OUT" > "$Q/FFPROBE.json"
          ffmpeg -v error -xerror -i "$OUT" -map 0:v:0 -map 0:a:0 -f null - 2> "$Q/DECODE_ERRORS.txt"
          test ! -s "$Q/DECODE_ERRORS.txt"

          DUR="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT")"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-1290.720)<0.20, d
          PY

          ffmpeg -y -loglevel error -i "$OUT" -map 0:a:0 -c copy -f adts "$Q/review.aac"
          RH="$(sha256sum "$Q/review.aac" | awk '{print $1}')"
          EXPECTED='a1e84ecb33a2060075b5681a086bf59b166396e16564b8e705a5b201dc4928ed'
          echo "$RH  review.aac" > "$Q/REVIEW_AUDIO_SHA256.txt"
          test "$RH" = "$EXPECTED"
          sha256sum "$OUT" > "$Q/VIDEO_SHA256.txt"

      - name: Upload rendered V10 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v10-render-checkpoint
          path: |
            /tmp/chicago_v10/HIA_CHICAGO_V10_CLEAN_OUTRO_FINAL_REVIEW_960x540.mp4
            /tmp/chicago_v10/qc/FFPROBE.json
            /tmp/chicago_v10/qc/DECODE_ERRORS.txt
            /tmp/chicago_v10/qc/VIDEO_SHA256.txt
            /tmp/chicago_v10/qc/AUDIO_SHA256.txt
            /tmp/chicago_v10/qc/REVIEW_AUDIO_SHA256.txt
          retention-days: 14

      - name: Independent FFmpeg detectors
        run: |
          set -euo pipefail
          Q=/tmp/chicago_v10/qc
          ffmpeg -hide_banner -nostats -i "$OUT"             -vf "blackdetect=d=0.08:pix_th=0.10:pic_th=0.98"             -an -f null - 2> "$Q/BLACKDETECT.log" || true
          ffmpeg -hide_banner -nostats -i "$OUT"             -vf "freezedetect=n=-55dB:d=3"             -an -f null - 2> "$Q/FREEZEDETECT.log" || true
          ffmpeg -hide_banner -nostats -i "$OUT"             -af "silencedetect=n=-60dB:d=0.5"             -vn -f null - 2> "$Q/SILENCEDETECT.log" || true

      - name: Fresh subtitle to VO timing audit
        run: |
          set -euo pipefail
          python3 CHICAGO/tools/analyze_subtitle_alignment.py \
            --words "$WORDS" \
            --srt "$SRT" \
            --out-json /tmp/chicago_v10/qc/SUBTITLE_VO_ALIGNMENT.json \
            --out-md /tmp/chicago_v10/qc/SUBTITLE_VO_ALIGNMENT.md

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/chicago_v10/qc/SUBTITLE_VO_ALIGNMENT.json').read_text())
          assert len(d)==1
          assert d[0]['verdict']=='PASS', d[0]['verdict']
          assert d[0]['matched_token_ratio']>=0.98, d[0]['matched_token_ratio']
          print('subtitle timing verdict:',d[0]['verdict'])
          print('token match:',d[0]['matched_token_ratio'])
          print('median offset:',d[0]['start_offset_sec']['median'])
          print('runtime drift:',d[0]['estimated_offset_change_over_runtime_sec'])
          PY

      - name: Run exhaustive whole-film QC and adjudicate known editor IDs
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_v10/qc/exhaustive
          python3 CHICAGO/tools/final_prepublication_qc.py \
            --video "$OUT" \
            --shots /tmp/chicago_v10/work/V10_SHOTS.json \
            --captions /tmp/chicago_v10/remotion/public/captions.json \
            --overlays /tmp/chicago_v10/remotion/public/overlays.json \
            --scene-map "$SCENE_MAP" \
            --script "$SCRIPT" \
            --voice-words "$WORDS" \
            --srt "$SRT" \
            --fact-map "$FACT_MAP" \
            --timeline "$TIMELINE" \
            --outdir /tmp/chicago_v10/qc/exhaustive \
            | tee /tmp/chicago_v10/qc/EXHAUSTIVE_GATE_RAW.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('/tmp/chicago_v10')
          d=json.loads((root/'qc/exhaustive/EXHAUSTIVE_QC.json').read_text())
          shots=json.loads((root/'work/V10_SHOTS.json').read_text())

          # V3_* and end are deliberate editor-created shot IDs introduced during
          # the accepted V3 sequence cleanup. They are not missing story material.
          missing=d['script']['shots']['missing_scene_ids']
          unexpected_ids=[
              x for x in missing
              if not (str(x['scene']).startswith('V3_') or str(x['scene'])=='end')
          ]

          # Blur-collapse detector is deliberately hypersensitive at hard cuts.
          # Adjudicate only when the flagged frame is on/within two frames of
          # a planned shot boundary.
          boundaries=sorted(set(
              [int(x['a']) for x in shots] + [int(x['b']) for x in shots]
          ))
          blur=d['frame']['one_frame_blur_anomalies']
          blur_adjudication=[]
          bad_blur=[]
          for x in blur:
              frame=int(x['frame'])
              dist,boundary=min((abs(frame-b),b) for b in boundaries)
              row={**x,'nearest_boundary':boundary,'distance_frames':dist}
              blur_adjudication.append(row)
              if dist>2:
                  bad_blur.append(row)

          raw_issues=d['automatic_gate']['issues']
          remaining=[]
          for issue in raw_issues:
              if 'blur-collapse' in issue:
                  if bad_blur: remaining.append(issue)
              elif 'unknown scene IDs' in issue:
                  if unexpected_ids: remaining.append(issue)
              else:
                  remaining.append(issue)

          report={
              'raw_gate':d['automatic_gate'],
              'editor_id_missing_scene_rows':missing,
              'unexpected_missing_scene_rows':unexpected_ids,
              'blur_adjudication':blur_adjudication,
              'unadjudicated_blur_rows':bad_blur,
              'remaining_issues':remaining,
              'final_gate':'PASS_ADJUDICATED' if not remaining else 'FAIL'
          }
          (root/'qc/EXHAUSTIVE_GATE.json').write_text(
              json.dumps(report,indent=2),encoding='utf-8'
          )
          print(json.dumps(report,indent=2))
          assert not unexpected_ids, unexpected_ids
          assert not bad_blur, bad_blur
          assert not remaining, remaining
          assert report['final_gate']=='PASS_ADJUDICATED'
          PY

      - name: Correct fact, source and license coverage audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, os, re
          from pathlib import Path
          out=Path('/tmp/chicago_v10/qc')

          def read(path):
              text=Path(path).read_text(encoding='utf-8-sig',errors='replace')
              sample=text[:5000]
              try:
                  dialect=csv.Sniffer().sniff(sample,delimiters=';,\t,')
                  delim=dialect.delimiter
              except:
                  delim=';'
              rows=list(csv.DictReader(text.splitlines(),delimiter=delim))
              return rows,delim

          facts,fdel=read(os.environ['FACT_MAP'])
          lics,ldel=read(os.environ['LICENSES'])
          shots=json.loads(Path('/tmp/chicago_v10/work/V10_SHOTS.json').read_text(encoding='utf-8-sig'))

          def find_column(rows,preds):
              if not rows:return None
              keys=list(rows[0].keys())
              for k in keys:
                  lk=(k or '').strip().lower()
                  if any(p in lk for p in preds): return k
              return None

          sk=find_column(facts,['status','lock','verify'])
          ck=find_column(facts,['confidence','certainty'])
          # infer if headers differ
          if sk is None and facts:
              for k in facts[0]:
                  vals=[(r.get(k) or '').strip().upper() for r in facts]
                  if sum(v in ('LOCKED','PASS','VERIFIED') for v in vals) >= max(1,len(vals)//2):
                      sk=k;break
          if ck is None and facts:
              for k in facts[0]:
                  vals=[(r.get(k) or '').strip().upper() for r in facts]
                  if sum(v in ('HIGH','MEDIUM','LOW') for v in vals) >= max(1,len(vals)//2):
                      ck=k;break

          statuses=[(r.get(sk) or '').strip() for r in facts] if sk else []
          confs=[(r.get(ck) or '').strip() for r in facts] if ck else []
          nonlocked=[x for x in statuses if x.upper() not in ('LOCKED','PASS','VERIFIED')]

          lic_by_id={}
          missing_fields=[]
          for r in lics:
              rid=(r.get('id') or r.get('ID') or '').strip()
              if rid: lic_by_id[rid]=r
              source=(r.get('source_page') or r.get('source') or '').strip()
              lic=(r.get('license') or '').strip()
              if not source or not lic:
                  missing_fields.append(rid or '(unknown)')

          refs=set()
          for s in shots:
              blob=' '.join(str(s.get(k,'')) for k in ('source','asset'))
              refs.update(re.findall(r'(?<![A-Za-z0-9])(A\d{2})(?=[^0-9]|$)',blob))
          missing_refs=sorted(x for x in refs if x not in lic_by_id)

          risks={}
          for x in sorted(refs):
              if x in lic_by_id:
                  risk=(lic_by_id[x].get('risk') or '').strip()
                  risks[risk]=risks.get(risk,0)+1

          report={
            'fact_delimiter':fdel,
            'fact_headers':list(facts[0].keys()) if facts else [],
            'fact_rows':len(facts),
            'status_column':sk,
            'confidence_column':ck,
            'status_values':statuses,
            'confidence_values':confs,
            'nonlocked_fact_count':len(nonlocked),
            'license_delimiter':ldel,
            'license_rows':len(lics),
            'license_rows_missing_source_or_license':missing_fields,
            'referenced_archive_ids':sorted(refs),
            'referenced_archive_ids_missing_manifest':missing_refs,
            'referenced_license_risk_counts':risks,
            'music_attribution_bytes':Path(os.environ['MUSIC_ATTR']).stat().st_size,
          }
          (out/'FACT_LICENSE_AUDIT_CORRECTED.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert len(facts)==23
          assert len(nonlocked)==0
          assert not missing_fields
          assert not missing_refs
          assert report['music_attribution_bytes']>0
          PY

      - name: Audit silences against spoken-word transcript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,os
          from pathlib import Path
          words=json.loads(Path(os.environ['WORDS']).read_text(encoding='utf-8-sig',errors='replace'))
          log=Path('/tmp/chicago_v10/qc/SILENCEDETECT.log').read_text(errors='replace')
          starts=[float(x) for x in re.findall(r'silence_start:\s*([0-9.]+)',log)]
          ends=[float(x) for x in re.findall(r'silence_end:\s*([0-9.]+)',log)]
          sil=list(zip(starts,ends))
          conflicts=[]
          for a,b in sil:
              overlap=[]
              for w in words:
                  s=float(w['start']);e=float(w['end'])
                  if min(b,e)-max(a,s)>0.08:
                      overlap.append({'word':w.get('word',''),'start':s,'end':e})
              if overlap: conflicts.append({'silence':[a,b],'words':overlap[:10]})
          report={'silence_intervals':sil,'count':len(sil),'voice_conflicts':conflicts}
          Path('/tmp/chicago_v10/qc/SILENCE_VO_AUDIT.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          assert not conflicts
          PY

      - name: End-screen geometry QC
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, cv2, re

          src=Path('CHICAGO/V10/src/index.jsx').read_text()
          builder=Path('CHICAGO/V10/build_brand_native_outro.py').read_text()
          img=cv2.imread('/tmp/chicago_v10/remotion/public/end_screen_first_episode.png')
          assert img is not None
          h,w=img.shape[:2]
          assert (w,h)==(1920,1080)

          # Canonical 06 geometry intentionally carried into the clean Episode 1 asset.
          m=re.search(r'cx,cy,r=(\d+),(\d+),(\d+)',builder)
          assert m
          cx,cy,r=map(int,m.groups())
          assert (cx,cy,r)==(957,704,138)

          # End captions are constrained to x < 340 at review resolution.
          # Circle begins at (957-138)/2 = 409.5 px.
          caption_x_max=960-620
          circle_x_min=(cx-r)/2
          gap=circle_x_min-caption_x_max

          checks={
            'uses_accepted_static_outro':'end_screen_first_episode.png' in src,
            'no_watch_next':'WATCH NEXT' not in src,
            'no_continue_exploring':'CONTINUE EXPLORING' not in src,
            'caption_right_620':'right:endMode?620:70' in src,
