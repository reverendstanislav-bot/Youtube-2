name: Build 10 Shorts Final Masters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_hia_shorts_final.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: hia-shorts-final-masters
  cancel-in-progress: true

jobs:
  chicago:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip fonts-dejavu-core
          mkdir -p /tmp/chi/{out,qc}

      - name: Download corrected Chicago R14 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chi
          gh release download chicago-r14-editorial-recut-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4 source.mp4
          test -s source.mp4
          echo '26d267a2e91ea32263a34ec1da5f002a7072dd62796e5a1ae74b053d45a8172e  source.mp4' | sha256sum -c -

      - name: Prepare final-quality renderer
        run: |
          set -euo pipefail
          cp SHORTS_RENDER/build_ffmpeg.py /tmp/chi/build_final.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/chi/build_final.py')
          s=p.read_text()
          old='"-c:v","libx264","-preset","veryfast","-crf","17","-pix_fmt","yuv420p",\n        "-r",str(fps),"-c:a","aac","-b:a","192k","-ar","48000","-ac","2",'
          new='"-c:v","libx264","-preset","medium","-crf","14","-pix_fmt","yuv420p",\n        "-profile:v","high","-color_range","tv","-color_primaries","bt709","-color_trc","bt709","-colorspace","bt709",\n        "-r",str(fps),"-c:a","aac","-b:a","256k","-ar","48000","-ac","2",'
          if old not in s: raise SystemExit('final quality patch token not found')
          p.write_text(s.replace(old,new))
          PY
          python3 -m py_compile /tmp/chi/build_final.py

      - name: Render Chicago final-master candidates
        run: |
          set -euo pipefail
          python3 /tmp/chi/build_final.py             --map CHICAGO/SHORTS/shorts_extraction_map.json             --source /tmp/chi/source.mp4 --episode-key chicago --fps 25             --outdir /tmp/chi/out --qcdir /tmp/chi/qc
          for f in /tmp/chi/out/*.mp4; do
            mv "$f" "${f%.mp4}_FINAL_MASTER.mp4"
          done

      - name: Deep QC Chicago masters
        run: |
          set -euo pipefail
          MAP=CHICAGO/SHORTS/shorts_extraction_map.json ROOT=/tmp/chi FPS=25 python3 - <<'PY'
          import json,os,subprocess,hashlib,re
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path(os.environ['ROOT']); q=root/'qc'; out=root/'out'; fps=int(os.environ['FPS'])
          mp=json.loads(Path(os.environ['MAP']).read_text())
          report={'episode':'CHICAGO','status':'PASS','quality':'H264 CRF14 medium / AAC 256k','shorts':[]}
          font=ImageFont.load_default()
          for sh in mp['shorts']:
              sid=sh['id']; p=out/f'{sid}_FINAL_MASTER.mp4'
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
              v=next(x for x in probe['streams'] if x['codec_type']=='video')
              a=next(x for x in probe['streams'] if x['codec_type']=='audio')
              dur=float(probe['format']['duration'])
              dec=q/f'{sid}_FINAL_decode.txt'
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              black=q/f'{sid}_FINAL_black.txt'
              with black.open('w') as fh:
                  subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(p),'-vf','blackdetect=d=.30:pix_th=.015','-an','-f','null','-'],stdout=subprocess.DEVNULL,stderr=fh)
              full_black=len(re.findall(r'black_start:',black.read_text(errors='ignore')))
              ok=(
                v['width']==1080 and v['height']==1920 and v['r_frame_rate']==f'{fps}/1'
                and v.get('pix_fmt')=='yuv420p'
                and a.get('sample_rate')=='48000' and int(a.get('channels',0))==2
                and abs(dur-sh['duration_sec'])<.45
                and rc==0 and dec.stat().st_size==0 and full_black==0
              )
              frames=[]
              for n,frac in enumerate([.06,.24,.42,.60,.78,.94],1):
                  t=max(.05,min(dur-.05,dur*frac)); jpg=q/f'{sid}_FINAL_{n}.jpg'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
                  frames.append(jpg)
              canvas=Image.new('RGB',(1080*3,1920*2),(16,16,16)); d=ImageDraw.Draw(canvas)
              for i,jpg in enumerate(frames):
                  im=Image.open(jpg).convert('RGB'); x=(i%3)*1080; y=(i//3)*1920
                  canvas.paste(im,(x,y)); d.rectangle((x,y,x+300,y+44),fill=(10,10,10))
                  d.text((x+8,y+13),f'{sid} FINAL {i+1}/6',fill=(245,245,245),font=font)
              canvas.thumbnail((1620,1920)); canvas.save(q/f'{sid}_FINAL_CONTACT.jpg',quality=91)
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              report['shorts'].append({
                'id':sid,'duration':dur,'width':v['width'],'height':v['height'],'fps':v['r_frame_rate'],
                'pix_fmt':v.get('pix_fmt'),'audio_rate':a.get('sample_rate'),'audio_channels':a.get('channels'),
                'decode_ok':rc==0,'black_events':full_black,'technical_pass':ok,'sha256':sha
              })
              if not ok: report['status']='FAIL'
          (q/'FINAL_QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS': raise SystemExit(report)
          PY
          grep -R -n '100,100)}' /tmp/chi/qc/*.ass && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-final-chicago
          path: |
            /tmp/chi/out
            /tmp/chi/qc
          compression-level: 0
          retention-days: 14

  tc497:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip fonts-dejavu-core
          mkdir -p /tmp/tc/{out,qc}

      - name: Download TC497 R14 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/tc
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 source.mp4
          test -s source.mp4
          echo 'd889dd45d43f091f4d76bd76ae7929cb23c6c1ecd68a3c1d73ac4c5a18c2292e  source.mp4' | sha256sum -c -

      - name: Prepare final-quality renderer
        run: |
          set -euo pipefail
          cp SHORTS_RENDER/build_ffmpeg.py /tmp/tc/build_final.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/tc/build_final.py')
          s=p.read_text()
          old='"-c:v","libx264","-preset","veryfast","-crf","17","-pix_fmt","yuv420p",\n        "-r",str(fps),"-c:a","aac","-b:a","192k","-ar","48000","-ac","2",'
          new='"-c:v","libx264","-preset","medium","-crf","14","-pix_fmt","yuv420p",\n        "-profile:v","high","-color_range","tv","-color_primaries","bt709","-color_trc","bt709","-colorspace","bt709",\n        "-r",str(fps),"-c:a","aac","-b:a","256k","-ar","48000","-ac","2",'
          if old not in s: raise SystemExit('final quality patch token not found')
          p.write_text(s.replace(old,new))
          PY
          python3 -m py_compile /tmp/tc/build_final.py

      - name: Render TC497 final-master candidates
        run: |
          set -euo pipefail
          python3 /tmp/tc/build_final.py             --map TC497/SHORTS/shorts_extraction_map.json             --source /tmp/tc/source.mp4 --episode-key tc497 --fps 30             --outdir /tmp/tc/out --qcdir /tmp/tc/qc
          for f in /tmp/tc/out/*.mp4; do
            mv "$f" "${f%.mp4}_FINAL_MASTER.mp4"
          done

      - name: Deep QC TC497 masters
        run: |
          set -euo pipefail
          MAP=TC497/SHORTS/shorts_extraction_map.json ROOT=/tmp/tc FPS=30 python3 - <<'PY'
          import json,os,subprocess,hashlib,re
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path(os.environ['ROOT']); q=root/'qc'; out=root/'out'; fps=int(os.environ['FPS'])
          mp=json.loads(Path(os.environ['MAP']).read_text())
          report={'episode':'TC497','status':'PASS','quality':'H264 CRF14 medium / AAC 256k','shorts':[]}
          font=ImageFont.load_default()
          for sh in mp['shorts']:
              sid=sh['id']; p=out/f'{sid}_FINAL_MASTER.mp4'
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
              v=next(x for x in probe['streams'] if x['codec_type']=='video')
              a=next(x for x in probe['streams'] if x['codec_type']=='audio')
              dur=float(probe['format']['duration'])
              dec=q/f'{sid}_FINAL_decode.txt'
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              black=q/f'{sid}_FINAL_black.txt'
              with black.open('w') as fh:
                  subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(p),'-vf','blackdetect=d=.30:pix_th=.015','-an','-f','null','-'],stdout=subprocess.DEVNULL,stderr=fh)
              full_black=len(re.findall(r'black_start:',black.read_text(errors='ignore')))
              ok=(
                v['width']==1080 and v['height']==1920 and v['r_frame_rate']==f'{fps}/1'
                and v.get('pix_fmt')=='yuv420p'
                and a.get('sample_rate')=='48000' and int(a.get('channels',0))==2
                and abs(dur-sh['duration_sec'])<.45
                and rc==0 and dec.stat().st_size==0 and full_black==0
              )
              frames=[]
              for n,frac in enumerate([.06,.24,.42,.60,.78,.94],1):
                  t=max(.05,min(dur-.05,dur*frac)); jpg=q/f'{sid}_FINAL_{n}.jpg'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
                  frames.append(jpg)
              canvas=Image.new('RGB',(1080*3,1920*2),(16,16,16)); d=ImageDraw.Draw(canvas)
              for i,jpg in enumerate(frames):
                  im=Image.open(jpg).convert('RGB'); x=(i%3)*1080; y=(i//3)*1920
                  canvas.paste(im,(x,y)); d.rectangle((x,y,x+300,y+44),fill=(10,10,10))
                  d.text((x+8,y+13),f'{sid} FINAL {i+1}/6',fill=(245,245,245),font=font)
              canvas.thumbnail((1620,1920)); canvas.save(q/f'{sid}_FINAL_CONTACT.jpg',quality=91)
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              report['shorts'].append({
                'id':sid,'duration':dur,'width':v['width'],'height':v['height'],'fps':v['r_frame_rate'],
                'pix_fmt':v.get('pix_fmt'),'audio_rate':a.get('sample_rate'),'audio_channels':a.get('channels'),
                'decode_ok':rc==0,'black_events':full_black,'technical_pass':ok,'sha256':sha
              })
              if not ok: report['status']='FAIL'
          (q/'FINAL_QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS': raise SystemExit(report)
          PY
          grep -R -n '100,100)}' /tmp/tc/qc/*.ass && exit 1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-final-tc497
          path: |
            /tmp/tc/out
            /tmp/tc/qc
          compression-level: 0
          retention-days: 14

  package_release:
    needs: [chicago,tc497]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hia-shorts-final-chicago
          path: /tmp/final/CHICAGO

      - uses: actions/download-artifact@v4
        with:
          name: hia-shorts-final-tc497
          path: /tmp/final/TC497

      - name: Build final package
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/{CHICAGO,TC497,QC,MAPS}
          cp /tmp/final/CHICAGO/out/*_FINAL_MASTER.mp4 /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/CHICAGO/
          cp /tmp/final/TC497/out/*_FINAL_MASTER.mp4 /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/TC497/
          cp -r /tmp/final/CHICAGO/qc /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/QC/CHICAGO
          cp -r /tmp/final/TC497/qc /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/QC/TC497
          cp CHICAGO/SHORTS/SHORTS_EXTRACTION_MAP.md CHICAGO/SHORTS/shorts_extraction_map.json /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/MAPS/
          cp TC497/SHORTS/SHORTS_EXTRACTION_MAP.md TC497/SHORTS/shorts_extraction_map.json /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/MAPS/
          cat > /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS/STATUS.txt <<'EOF'
          HIDDEN INDUSTRIAL AMERICA — 10 SHORTS FINAL MASTER CANDIDATES
          5 Chicago + 5 TC-497
          1080x1920 H.264 / yuv420p / BT.709 / AAC 48k stereo
          Technical QC: required PASS before package release.
          Visual QC: two-panel vertical layout, caption-safe framing, white captions + orange active word.
          Provenance: explicit only when unambiguous; ambiguous beats defer to the visible source frame.
          Publication status: AWAITING USER VISUAL APPROVAL. Files are not marked PUBLISHED/APPROVED by automation.
          EOF
          cd /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS
          find CHICAGO TC497 -type f -name '*.mp4' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cd /tmp/pkg
          zip -q -r -0 HIA_SHORTS_10_FINAL_MASTERS.zip HIA_SHORTS_10_FINAL_MASTERS
          sha256sum HIA_SHORTS_10_FINAL_MASTERS.zip > HIA_SHORTS_10_FINAL_MASTERS.zip.sha256
          ls -lh HIA_SHORTS_10_FINAL_MASTERS.zip

      - name: Publish downloadable final-master package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/pkg
          TAG=hia-shorts-10-final-masters-20260923
          gh release delete "$TAG" --repo reverendstanislav-bot/Youtube-2 -y >/dev/null 2>&1 || true
          gh release create "$TAG"             HIA_SHORTS_10_FINAL_MASTERS.zip             HIA_SHORTS_10_FINAL_MASTERS.zip.sha256             --title 'HIA — 10 Shorts Final Masters'             --notes '10 vertical 1080x1920 master candidates: 5 Chicago + 5 TC-497. Technical QC passed before packaging. Source-locked long-form narration, white/orange word captions, vertical safe layout, no new AI generation. Awaiting user visual approval before publication.'             --repo reverendstanislav-bot/Youtube-2

      - uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-10-final-masters
          path: |
            /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS.zip
            /tmp/pkg/HIA_SHORTS_10_FINAL_MASTERS.zip.sha256
          compression-level: 0
          retention-days: 30
