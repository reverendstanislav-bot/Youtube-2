name: Make HIA End Screen Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/make_hia_end_screen_preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Make compact preview
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('CHICAGO/BRANDING/reference/06_end_screen_background.png')
          im=Image.open(src).convert('RGB')
          print('ORIGINAL_SIZE', im.size)
          w=640
          h=round(im.height*w/im.width)
          im=im.resize((w,h))
          out=Path('CHICAGO/BRANDING/reference/06_end_screen_preview_640.jpg')
          im.save(out,quality=72,optimize=True)
          print('PREVIEW_SIZE', im.size, out.stat().st_size)
          PY

      - name: Commit preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/BRANDING/reference/06_end_screen_preview_640.jpg
          git commit -m "Add compact preview of canonical HIA end screen"
          git push
