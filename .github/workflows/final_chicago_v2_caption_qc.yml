name: Final Chicago V2 Caption QC

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/final_chicago_v2_caption_qc.yml'

permissions:
  contents: write

jobs:
  final-caption-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full ffmpeg tesseract-ocr imagemagick python3-pil

      - name: Download and reconstruct archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/chicago_src
          cd /tmp/chicago_src
          gh release download chicago-source-archive-v1 \
            --repo reverendstanislav-bot/Youtube-2 \
            --pattern 'Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part*'
          cat Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part00 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part01 \
              Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar.part02 \
              > Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar
          echo '2fcfcd4767ce0d6234b72a33bde08ea0b5fe0cdb4eb3d9150515cba56ef705eb  Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar' | sha256sum -c -

      - name: Extract V2 and build script
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2
          cd /tmp/chicago_src
          7z x -y Hidden_Industrial_America_Chicago_CODEX_READY_v7.rar \
            -o/tmp/v2 \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.mp4" \
            "-ir!*/_V2/final/HIA_CHICAGO_V2.srt" \
            "-ir!*/_V2/work/hia_v2.py"
          V2="$(find /tmp/v2 -type f -path '*/_V2/final/HIA_CHICAGO_V2.mp4' | head -n1)"
          SRT="$(find /tmp/v2 -type f -path '*/_V2/final/HIA_CHICAGO_V2.srt' | head -n1)"
          PY="$(find /tmp/v2 -type f -path '*/_V2/work/hia_v2.py' | head -n1)"
          test -s "$V2"; test -s "$SRT"; test -s "$PY"
          echo "V2=$V2" >> "$GITHUB_ENV"
          echo "SRT=$SRT" >> "$GITHUB_ENV"
          mkdir -p CHICAGO/AUDIT/V2_FINAL_QC
          cp "$PY" CHICAGO/AUDIT/V2_FINAL_QC/hia_v2.py

      - name: Generate cue-centered visual caption samples
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os, json, subprocess
          from pathlib import Path

          srt=Path(os.environ["SRT"]).read_text(encoding="utf-8-sig",errors="replace").strip()
          blocks=re.split(r"\n\s*\n",srt)
          cues=[]
          def tm(x):
              h,m,sms=x.replace(".",",").split(":")
              s,ms=sms.split(",")
              return int(h)*3600+int(m)*60+int(s)+int(ms[:3].ljust(3,"0"))/1000
          for b in blocks:
              l=[x.strip() for x in b.splitlines() if x.strip()]
              if len(l)<3 or "-->" not in l[1]: continue
              a,z=[tm(x.strip()) for x in l[1].split("-->")]
              cues.append({"start":a,"end":z,"text":" ".join(l[2:])})
          duration=max(c["end"] for c in cues)
          targets=[0.02,0.10,0.25,0.40,0.50,0.75,0.90,0.985]
          selected=[]
          for q in targets:
              t=duration*q
              c=min(cues,key=lambda x:abs(((x["start"]+x["end"])/2)-t))
              mid=(c["start"]+c["end"])/2
              c=dict(c); c["mid"]=mid; c["fraction"]=q; selected.append(c)
          out=Path("CHICAGO/AUDIT/V2_FINAL_QC")
          for i,c in enumerate(selected,1):
              fn=out/f"sample_{i:02d}_{c['mid']:.2f}s.jpg"
              subprocess.run(["ffmpeg","-y","-loglevel","error","-ss",f"{c['mid']:.3f}","-i",os.environ["V2"],"-frames:v","1",str(fn)],check=True)
          (out/"EXPECTED_CUES.json").write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: OCR lower caption region and compare to expected cue
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess, difflib
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance

          out=Path("CHICAGO/AUDIT/V2_FINAL_QC")
          cues=json.loads((out/"EXPECTED_CUES.json").read_text(encoding="utf-8"))
          imgs=sorted(out.glob("sample_*.jpg"))
          rows=[]
          norm=lambda s:" ".join(re.findall(r"[a-z0-9]+",s.lower()))
          for cue,imgp in zip(cues,imgs):
              im=Image.open(imgp).convert("RGB")
              w,h=im.size
              # Bottom 45% where burned captions normally live.
              crop=im.crop((0,int(h*.55),w,h))
              gray=ImageOps.grayscale(crop)
              gray=ImageEnhance.Contrast(gray).enhance(2.2)
              proc=gray.point(lambda p: 255 if p>155 else 0)
              proc_path=out/(imgp.stem+"_caption_region.png")
              proc.save(proc_path)
              res=subprocess.run(
                  ["tesseract",str(proc_path),"stdout","--psm","6","-l","eng"],
                  capture_output=True,text=True,check=False
              )
              ocr=res.stdout.strip()
              expected=cue["text"]
              a,b=norm(expected),norm(ocr)
              ratio=difflib.SequenceMatcher(None,a,b,autojunk=False).ratio() if a and b else 0.0
              exp_words=set(a.split()); got_words=set(b.split())
              overlap=len(exp_words&got_words)/max(1,len(exp_words))
              rows.append({
                  **cue,
                  "image":imgp.name,
                  "ocr_text":ocr,
                  "similarity":ratio,
                  "expected_word_overlap":overlap
              })
          (out/"VISIBLE_CAPTION_OCR.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          md=["# Chicago V2 — visible caption QC","",
              "This check samples frames at the midpoint of eight active cues across the film and compares visible text in the lower 45% of the encoded MP4 with the expected V2 SRT cue.","",
              "| # | Time | Expected cue | OCR lower region | Word overlap |",
              "|---:|---:|---|---|---:|"]
          for i,r in enumerate(rows,1):
              exp=r["text"].replace("|","/")
              ocr=" ".join(r["ocr_text"].split()).replace("|","/") or "—"
              md.append(f"| {i} | {r['mid']:.2f}s | {exp} | {ocr} | {r['expected_word_overlap']:.0%} |")
          burned=sum(r["expected_word_overlap"]>=.35 for r in rows)
          md += ["",f"Expected-cue text visibly detected in **{burned}/8** sampled encoded frames.",""]
          if burned>=6:
              md.append("Interpretation: V2 contains a visible/burned caption layer that broadly follows the V2 cue text at sampled points.")
          elif burned<=2:
              md.append("Interpretation: V2 does not appear to contain the V2 SRT as a visible/burned caption layer at sampled points. Treat V2 SRT as sidecar captions for YouTube unless another burned layer is separately detected.")
          else:
              md.append("Interpretation: mixed/ambiguous visible-caption result; do not promote without manual visual review.")
          (out/"VISIBLE_CAPTION_QC.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          PY

      - name: Inspect V2 build code for subtitle burn path
        run: |
          set -euo pipefail
          {
            echo '# V2 build-code caption/subtitle references'
            echo
            grep -nEi 'subtitle|caption|srt|ass|drawtext|subtitles=' CHICAGO/AUDIT/V2_FINAL_QC/hia_v2.py || true
          } > CHICAGO/AUDIT/V2_FINAL_QC/BUILD_CAPTION_REFERENCES.md

      - name: Final technical checks
        run: |
          set -euo pipefail
          ffmpeg -v error -xerror -i "$V2" -map 0:v:0 -map 0:a:0 -f null - 2> CHICAGO/AUDIT/V2_FINAL_QC/FULL_DECODE_ERRORS.txt
          test ! -s CHICAGO/AUDIT/V2_FINAL_QC/FULL_DECODE_ERRORS.txt
          ffprobe -v error -show_streams -show_format -of json "$V2" > CHICAGO/AUDIT/V2_FINAL_QC/FFPROBE.json
          sha256sum "$V2" > CHICAGO/AUDIT/V2_FINAL_QC/V2_SHA256.txt

      - name: Commit final QC
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHICAGO/AUDIT/V2_FINAL_QC
          git commit -m "Run final Chicago V2 visible caption QC"
          git push

      - name: Upload QC artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v2-final-qc
          path: CHICAGO/AUDIT/V2_FINAL_QC
          retention-days: 14
