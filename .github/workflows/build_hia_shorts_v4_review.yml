name: Build Shorts V4 Full-Frame Review

on:
  push:
    paths:
      - '.github/workflows/build_hia_shorts_v4_review.yml'
      - 'SHORTS_RENDER/build_ffmpeg.py'
      - 'CHICAGO/SHORTS/**'
      - 'TC497/SHORTS/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hia-shorts-v4-review
  cancel-in-progress: true

jobs:
  chicago:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip fonts-dejavu-core
          python3 -m py_compile SHORTS_RENDER/build_ffmpeg.py
          mkdir -p /tmp/chi/{out,qc}
      - name: Download Chicago R14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/chi
          gh release download chicago-r14-editorial-recut-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4'
          mv HIA_CHICAGO_R14_EDITORIAL_RECUT_REVIEW_1920x1080.mp4 source.mp4
      - name: Render Chicago V4 review
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_ffmpeg.py             --map CHICAGO/SHORTS/shorts_extraction_map.json             --source /tmp/chi/source.mp4 --episode-key chicago --fps 25             --outdir /tmp/chi/out --qcdir /tmp/chi/qc
      - name: QC + dense contact sheets
        run: |
          set -euo pipefail
          MAP=CHICAGO/SHORTS/shorts_extraction_map.json ROOT=/tmp/chi FPS=25 python3 - <<'PY'
          import json,os,subprocess,hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path(os.environ['ROOT']); q=root/'qc'; out=root/'out'; fps=int(os.environ['FPS'])
          mp=json.loads(Path(os.environ['MAP']).read_text())
          report={'episode':'CHICAGO','layout':'V4_FULL_FRAME_SINGLE_PLANE','status':'PASS','shorts':[]}
          font=ImageFont.load_default()
          for sh in mp['shorts']:
              sid=sh['id']; p=out/f'{sid}.mp4'
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
              v=next(x for x in probe['streams'] if x['codec_type']=='video')
              a=[x for x in probe['streams'] if x['codec_type']=='audio']
              dur=float(probe['format']['duration'])
              dec=q/f'{sid}_decode.txt'
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              ok=(v['width']==1080 and v['height']==1920 and v['r_frame_rate']==f'{fps}/1' and a and abs(dur-sh['duration_sec'])<.45 and rc==0 and dec.stat().st_size==0)
              frames=[]
              for n,frac in enumerate([.03,.14,.27,.40,.53,.66,.79,.91,.98],1):
                  t=max(.05,min(dur-.05,dur*frac)); jpg=q/f'{sid}_{n}.jpg'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
                  frames.append(jpg)
              canvas=Image.new('RGB',(1080*3,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas)
              for i,jpg in enumerate(frames):
                  im=Image.open(jpg).convert('RGB'); x=(i%3)*1080; y=(i//3)*1920
                  canvas.paste(im,(x,y))
                  d.rectangle((x,y,x+280,y+44),fill=(10,10,10))
                  d.text((x+8,y+13),f'{sid} {i+1}/9',fill=(245,245,245),font=font)
              canvas.thumbnail((1620,2880)); canvas.save(q/f'{sid}_CONTACT.jpg',quality=92)
              report['shorts'].append({'id':sid,'duration':dur,'decode_ok':rc==0,'technical_pass':bool(ok),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              if not ok: report['status']='FAIL'
          (q/'QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS': raise SystemExit(report)
          PY
          grep -R -n '100,100)}' /tmp/chi/qc/*.ass && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-v4-review-chicago
          path: |
            /tmp/chi/out
            /tmp/chi/qc
          compression-level: 0
          retention-days: 7

  tc497:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pil zip fonts-dejavu-core
          python3 -m py_compile SHORTS_RENDER/build_ffmpeg.py
          mkdir -p /tmp/tc/{out,qc}
      - name: Download TC497 R14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/tc
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 source.mp4
      - name: Render TC497 V4 review
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_ffmpeg.py             --map TC497/SHORTS/shorts_extraction_map.json             --source /tmp/tc/source.mp4 --episode-key tc497 --fps 30             --outdir /tmp/tc/out --qcdir /tmp/tc/qc
      - name: QC + dense contact sheets
        run: |
          set -euo pipefail
          MAP=TC497/SHORTS/shorts_extraction_map.json ROOT=/tmp/tc FPS=30 python3 - <<'PY'
          import json,os,subprocess,hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path(os.environ['ROOT']); q=root/'qc'; out=root/'out'; fps=int(os.environ['FPS'])
          mp=json.loads(Path(os.environ['MAP']).read_text())
          report={'episode':'TC497','layout':'V4_FULL_FRAME_SINGLE_PLANE','status':'PASS','shorts':[]}
          font=ImageFont.load_default()
          for sh in mp['shorts']:
              sid=sh['id']; p=out/f'{sid}.mp4'
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
              v=next(x for x in probe['streams'] if x['codec_type']=='video')
              a=[x for x in probe['streams'] if x['codec_type']=='audio']
              dur=float(probe['format']['duration'])
              dec=q/f'{sid}_decode.txt'
              with dec.open('w') as fh:
                  rc=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-f','null','-'],stderr=fh).returncode
              ok=(v['width']==1080 and v['height']==1920 and v['r_frame_rate']==f'{fps}/1' and a and abs(dur-sh['duration_sec'])<.45 and rc==0 and dec.stat().st_size==0)
              frames=[]
              for n,frac in enumerate([.03,.14,.27,.40,.53,.66,.79,.91,.98],1):
                  t=max(.05,min(dur-.05,dur*frac)); jpg=q/f'{sid}_{n}.jpg'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(jpg)],check=True)
                  frames.append(jpg)
              canvas=Image.new('RGB',(1080*3,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas)
              for i,jpg in enumerate(frames):
                  im=Image.open(jpg).convert('RGB'); x=(i%3)*1080; y=(i//3)*1920
                  canvas.paste(im,(x,y))
                  d.rectangle((x,y,x+280,y+44),fill=(10,10,10))
                  d.text((x+8,y+13),f'{sid} {i+1}/9',fill=(245,245,245),font=font)
              canvas.thumbnail((1620,2880)); canvas.save(q/f'{sid}_CONTACT.jpg',quality=92)
              report['shorts'].append({'id':sid,'duration':dur,'decode_ok':rc==0,'technical_pass':bool(ok),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              if not ok: report['status']='FAIL'
          (q/'QC.json').write_text(json.dumps(report,indent=2))
          if report['status']!='PASS': raise SystemExit(report)
          PY
          grep -R -n '100,100)}' /tmp/tc/qc/*.ass && exit 1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-v4-review-tc497
          path: |
            /tmp/tc/out
            /tmp/tc/qc
          compression-level: 0
          retention-days: 7

  package:
    needs: [chicago,tc497]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shorts-v4-review-chicago
          path: /tmp/all/CHICAGO
      - uses: actions/download-artifact@v4
        with:
          name: shorts-v4-review-tc497
          path: /tmp/all/TC497
      - name: Package
        run: |
          set -euo pipefail
          cd /tmp/all
          zip -q -r -0 HIA_SHORTS_10_V4_FULL_FRAME_REVIEW.zip CHICAGO TC497
          sha256sum HIA_SHORTS_10_V4_FULL_FRAME_REVIEW.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hia-shorts-10-v4-full-frame-review
          path: |
            /tmp/all/HIA_SHORTS_10_V4_FULL_FRAME_REVIEW.zip
            /tmp/all/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
