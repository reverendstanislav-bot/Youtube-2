name: Build TC497 S01 V6 Editorial Proof

on:
  push:
    paths:
      - '.github/workflows/build_tc497_s01_v6_proof.yml'
      - 'SHORTS_RENDER/build_editorial_proof.py'
      - 'TC497/SHORTS/TC497-S01_V6_PROOF.json'
      - 'TC497/SHORTS/shorts_extraction_map.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tc497-s01-v6-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pil jq fonts-dejavu-core
          python3 -m py_compile SHORTS_RENDER/build_editorial_proof.py
          mkdir -p /tmp/proof/qc
      - name: Download TC497 R14 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/proof
          gh release download tc497-r14-remotion-reedit-review-20260923             --repo reverendstanislav-bot/Youtube-2             --pattern 'TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4'
          mv TC497_R14_REMOTION_REEDIT_REVIEW_1920x1080.mp4 source.mp4
      - name: Render curated S01 proof
        run: |
          set -euo pipefail
          python3 SHORTS_RENDER/build_editorial_proof.py             --plan TC497/SHORTS/TC497-S01_V6_PROOF.json             --map TC497/SHORTS/shorts_extraction_map.json             --source /tmp/proof/source.mp4             --out /tmp/proof/TC497-S01_V6_EDITORIAL_PROOF.mp4             --qc /tmp/proof/qc
      - name: Technical QC and 12-frame contact sheet
        run: |
          set -euo pipefail
          P=/tmp/proof/TC497-S01_V6_EDITORIAL_PROOF.mp4
          ffmpeg -v error -xerror -i "$P" -f null - 2>/tmp/proof/qc/decode.txt
          test ! -s /tmp/proof/qc/decode.txt
          python3 - <<'PY'
          import subprocess, json
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          p=Path('/tmp/proof/TC497-S01_V6_EDITORIAL_PROOF.mp4'); q=Path('/tmp/proof/qc')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)]))
          times=[dur*x for x in [.02,.08,.16,.24,.32,.40,.50,.60,.70,.80,.90,.98]]
          imgs=[]
          for i,t in enumerate(times):
              j=q/f'f{i+1:02d}.jpg'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{t:.3f}','-i',str(p),'-frames:v','1','-q:v','2',str(j)],check=True)
              imgs.append((t,Image.open(j).convert('RGB').copy()))
          canvas=Image.new('RGB',(1080*4,1920*3),(16,16,16)); d=ImageDraw.Draw(canvas); font=ImageFont.load_default()
          for i,(t,im) in enumerate(imgs):
              x=(i%4)*1080; y=(i//4)*1920; canvas.paste(im,(x,y))
              d.rectangle((x,y,x+260,y+42),fill=(10,10,10)); d.text((x+8,y+12),f'{t:.1f}s',fill=(245,245,245),font=font)
          canvas.thumbnail((2160,2880)); canvas.save(q/'CONTACT.jpg',quality=92)
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          (q/'FFPROBE.json').write_text(json.dumps(info,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tc497-s01-v6-editorial-proof
          path: |
            /tmp/proof/TC497-S01_V6_EDITORIAL_PROOF.mp4
            /tmp/proof/qc
          compression-level: 0
          retention-days: 7
