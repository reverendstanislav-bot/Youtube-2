name: Build TC497 Final 1080p Master

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-master:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip zip

      - name: Download approved FULL V5 review artifact
        uses: actions/download-artifact@v4
        with:
          name: tc497-full-v5-review
          path: /tmp/v5artifact
          repository: reverendstanislav-bot/Youtube-2
          run-id: 35415899593
          github-token: ${{ github.token }}

      - name: Verify approved V5 inputs
        run: |
          set -euo pipefail
          test -s /tmp/v5artifact/TC497_FULL_V5_REVIEW_960x540.mp4
          test -s /tmp/v5artifact/FULL_V5_REPORT.zip
          mkdir -p /tmp/v5report
          unzip -q /tmp/v5artifact/FULL_V5_REPORT.zip -d /tmp/v5report
          test -s /tmp/v5report/V5_EBUR128.txt
          test -s /tmp/v5report/YOUTUBE_DESCRIPTION_MUSIC_CREDITS.txt

      - name: Build 1920x1080 upload master
        run: |
          set -euo pipefail
          mkdir -p TC497/FINAL_MASTER /tmp/finalreport

          # V5 review already contains the approved edit, captions, source labels,
          # visual fixes and final audio master. Upscale with high-quality Lanczos,
          # preserve 30 fps, re-encode at high bitrate-quality settings.
          ffmpeg -y -loglevel error             -i /tmp/v5artifact/TC497_FULL_V5_REVIEW_960x540.mp4             -vf "scale=1920:1080:flags=lanczos,format=yuv420p"             -c:v libx264 -preset slow -crf 15 -profile:v high -level 4.1             -c:a aac -b:a 320k             -movflags +faststart             TC497/FINAL_MASTER/TC497_FINAL_1080P_UPLOAD_MASTER.mp4

          ffprobe -v error             -show_entries stream=index,codec_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate:format=duration,size,bit_rate             -of json TC497/FINAL_MASTER/TC497_FINAL_1080P_UPLOAD_MASTER.mp4             > /tmp/finalreport/FINAL_FFPROBE.json

          ffmpeg -hide_banner -nostats             -i TC497/FINAL_MASTER/TC497_FINAL_1080P_UPLOAD_MASTER.mp4             -af ebur128=peak=true -f null - 2> /tmp/finalreport/FINAL_EBUR128.txt || true

          mkdir -p /tmp/finalreport/screens
          for t in 30 90 210 330 540 710 735 840 960 1083 1110 1212 1228; do
            ffmpeg -y -loglevel error -ss "$t"               -i TC497/FINAL_MASTER/TC497_FINAL_1080P_UPLOAD_MASTER.mp4               -frames:v 1 "/tmp/finalreport/screens/frame_${t}.jpg"
          done

          cp /tmp/v5report/YOUTUBE_DESCRIPTION_MUSIC_CREDITS.txt /tmp/finalreport/
          cp /tmp/v5report/MUSIC_MANIFEST_USED.json /tmp/finalreport/
          cat > /tmp/finalreport/FINAL_MASTER_INFO.txt <<'EOF'
          TC497 FINAL UPLOAD MASTER
          Resolution: 1920x1080
          Frame rate: 30 fps
          Video: H.264 High Profile
          Audio: AAC 320 kbps
          Source edit: approved FULL_V5 review cut
          Music: original procedural HIA underscore; no third-party commercial music file
          EOF

          (cd /tmp/finalreport && zip -q -r "$GITHUB_WORKSPACE/TC497/FINAL_MASTER/TC497_FINAL_MASTER_REPORT.zip" .)
          (cd TC497/FINAL_MASTER && sha256sum              TC497_FINAL_1080P_UPLOAD_MASTER.mp4              TC497_FINAL_MASTER_REPORT.zip              > SHA256SUMS.txt)

          ls -lh TC497/FINAL_MASTER/

      - name: Upload final master artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc497-final-1080p-master
          path: |
            TC497/FINAL_MASTER/TC497_FINAL_1080P_UPLOAD_MASTER.mp4
            TC497/FINAL_MASTER/TC497_FINAL_MASTER_REPORT.zip
            TC497/FINAL_MASTER/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
