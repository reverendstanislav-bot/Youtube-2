name: Preview Chicago V10 Brand Native Outro

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preview_chicago_v10_brand_native_outro.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip python3-pil

      - name: Download canonical HIA brand package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/hia_v10_brand
          mkdir -p /tmp/hia_v10_brand
          cd /tmp/hia_v10_brand
          gh release download chicago-channel-brand-assets-extracted-20260920             --repo reverendstanislav-bot/Youtube-2             --pattern 'HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip'
          unzip -q HIA_CHANNEL_BRAND_ASSETS_EXTRACTED.zip -d extracted

          BASE="$(find extracted -type f -name '07_generic_reusable_thumbnail_base.png' | head -n1)"
          test -s "$BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Build brand-native first-episode outro proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import os
          from pathlib import Path

          src=Image.open(os.environ['BASE']).convert('RGB')
          assert src.size==(1920,1080), src.size

          # Darken slightly for clean typography, without adding a box.
          dark=Image.new('RGB',src.size,(0,0,0))
          im=Image.blend(src,dark,0.12)

          d=ImageDraw.Draw(im)

          PAPER=(243,235,221)
          IVORY=(246,241,232)
          RUST=(165,82,53)

          # Robust system fonts available on Ubuntu.
          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          title=ImageFont.truetype(bold,52)
          tag=ImageFont.truetype(reg,28)
          sub=ImageFont.truetype(bold,30)
          sub2=ImageFont.truetype(reg,21)

          # HIA brand header.
          x=105; y=92
          d.rectangle([x,y,x+68,y+6],fill=RUST)
          d.text((x+92,y-24),'HIDDEN INDUSTRIAL AMERICA',font=title,fill=IVORY,
                 stroke_width=2,stroke_fill=(20,22,23))
          d.text((x+92,y+55),'THE INFRASTRUCTURE REMAINS',font=tag,fill=PAPER,
                 stroke_width=1,stroke_fill=(20,22,23))

          # Canonical Subscribe circle geometry copied from 06 End Screen.
          cx,cy,r=957,704,138

          # Slight local dark disk only inside circle so the future clickable avatar reads cleanly.
          overlay=Image.new('RGBA',im.size,(0,0,0,0))
          od=ImageDraw.Draw(overlay)
          od.ellipse([cx-r,cy-r,cx+r,cy+r],fill=(10,12,13,72))
          im=Image.alpha_composite(im.convert('RGBA'),overlay).convert('RGB')
          d=ImageDraw.Draw(im)

          # Double-ring treatment matching HIA paper/rust palette.
          d.ellipse([cx-r,cy-r,cx+r,cy+r],outline=PAPER,width=4)
          d.arc([cx-r-8,cy-r-8,cx+r+8,cy+r+8],start=210,end=325,fill=RUST,width=5)

          # Subscribe copy centered below circle.
          bbox=d.textbbox((0,0),'SUBSCRIBE',font=sub)
          tw=bbox[2]-bbox[0]
          d.text((cx-tw/2,cy+r+42),'SUBSCRIBE',font=sub,fill=RUST,
                 stroke_width=1,stroke_fill=(20,22,23))

          line='HIDDEN INDUSTRIAL AMERICA'
          bbox=d.textbbox((0,0),line,font=sub2)
          tw=bbox[2]-bbox[0]
          d.text((cx-tw/2,cy+r+88),line,font=sub2,fill=PAPER,
                 stroke_width=1,stroke_fill=(20,22,23))

          # Visual guide for the editor only: left-bottom caption safe zone marker,
          # kept OUT of final asset.
          proof=im.copy()
          pd=ImageDraw.Draw(proof)
          pd.rounded_rectangle([85,830,750,1010],radius=18,outline=(95,116,125),width=3)
          pd.text((105,845),'FINAL NARRATION CAPTIONS SAFE ZONE',font=sub2,fill=(170,185,190))

          out=Path('/tmp/hia_v10_brand')
          im.save(out/'V10_FIRST_EPISODE_OUTRO_CLEAN_1920x1080.png',compress_level=6)
          proof.resize((960,540)).save(out/'V10_FIRST_EPISODE_OUTRO_PROOF_960x540.jpg',quality=92)

          # Extra proof with clickable avatar simulated by actual channel avatar,
          # strictly for inspection; final clean asset stays empty.
          avatar_path=next(Path('/tmp/hia_v10_brand/extracted').rglob('01_avatar_logo.png'))
          av=Image.open(avatar_path).convert('RGB')
          av=av.resize((2*r-22,2*r-22))
          mask=Image.new('L',av.size,0)
          md=ImageDraw.Draw(mask)
          md.ellipse([0,0,av.width-1,av.height-1],fill=255)
          sim=im.copy()
          sim.paste(av,(cx-r+11,cy-r+11),mask)
          sim.resize((960,540)).save(out/'V10_OUTRO_SIMULATED_YOUTUBE_SUBSCRIBE_960x540.jpg',quality=92)
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: chicago-v10-brand-native-outro-proof
          path: |
            /tmp/hia_v10_brand/V10_FIRST_EPISODE_OUTRO_CLEAN_1920x1080.png
            /tmp/hia_v10_brand/V10_FIRST_EPISODE_OUTRO_PROOF_960x540.jpg
            /tmp/hia_v10_brand/V10_OUTRO_SIMULATED_YOUTUBE_SUBSCRIBE_960x540.jpg
          retention-days: 14
