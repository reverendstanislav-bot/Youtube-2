name: VIDEO006 NARA 1963 Project Pluto Film Mirror Research
on:
  push:
    paths:
      - '.github/workflows/project_pluto_lasvn1_mirror.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and download inspectors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install yt-dlp pillow
      - name: Retrieve public primary-government-film mirror for research
        run: python PROJECT_PLUTO/ARCHIVE/research_lasvn1_mirror.py
      - name: Save inspected stills and actual source technical metadata
        if: always()
        run: |
          mkdir -p PROJECT_PLUTO/ARCHIVE/LASVN1_REFERENCE_FRAME_REVIEW
          cp pluto_LASVN1_NARA_reference/*.json PROJECT_PLUTO/ARCHIVE/LASVN1_REFERENCE_FRAME_REVIEW/ || true
          cp pluto_LASVN1_NARA_reference/FILM_SCREEN_*.jpg PROJECT_PLUTO/ARCHIVE/LASVN1_REFERENCE_FRAME_REVIEW/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_PLUTO/ARCHIVE/LASVN1_REFERENCE_FRAME_REVIEW/
          if ! git diff --cached --quiet; then git commit -m "LASVN1 NARA authentic 1963 film source research [skip ci]"; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LASVN1_1963_Primary_Film_Research_ONLY_Rights_HOLD
          path: pluto_LASVN1_NARA_reference/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
