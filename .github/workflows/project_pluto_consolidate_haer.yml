name: Project Pluto — Bundle 39 Real Historical Source Photos
on:
  push:
    paths:
      - '.github/workflows/project_pluto_consolidate_haer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Restore all independently validated archive original batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p haer_sources engine_photos
          gh release download project-pluto-direct-archive-photos-20261021 --pattern 'P00*.jpg' --dir engine_photos
          for I in $(seq 0 11); do
            N=$(printf "%02d" "$I")
            mkdir -p haer_sources/batch_$N
            gh release download "project-pluto-haer-originals-$N-20261021" --pattern '*.tif' --dir haer_sources/batch_$N
            gh release download "project-pluto-haer-originals-$N-20261021" --pattern 'SOURCE_MANIFEST.json' --dir haer_sources/batch_$N
          done
      - name: Validate original TIFF image pixels and manifest hashes, make one ZIP
        run: python PROJECT_PLUTO/ARCHIVE/consolidate_haer_v1.py
      - name: Publish one straightforward archive download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=project-pluto-39-real-historical-photos-20261021
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Project Pluto — 39 actual source photos and TIFFs" --notes "3 actual Tory engine photos plus 36 original Library of Congress HAER facility TIFF scans. The 36 facility photos document the real Area 26 site after 1968, not the 1964 running test. Sources hashes/rejections in archive, per-item reuse QC OPEN. No generated images."
          gh release upload "$TAG" PROJECT_PLUTO_REAL_HISTORICAL_PHOTOS_39_FILES.zip PROJECT_PLUTO_HIA_PHOTO_ARCHIVE/PHOTO_MASTER_INDEX.csv PROJECT_PLUTO_HIA_PHOTO_ARCHIVE/REVIEW_STATUS.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pluto_Real_39_Photo_Masters
          path: PROJECT_PLUTO_REAL_HISTORICAL_PHOTOS_39_FILES.zip
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
